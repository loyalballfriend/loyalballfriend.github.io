<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fd0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="2026 秋季學期課表、溫書時段、考試日程與待辦清單，支援離線使用。">
<!-- ===== 可安裝網頁應用（PWA）設定 ===== -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時間表">
<meta name="application-name" content="時間表">
<meta name="format-detection" content="telephone=no">
<title>時間表 · 2026 秋季</title>
<script>
/* 先套用主題，避免載入時閃一下白色 */
(function(){
  try{
    var raw=localStorage.getItem('timetable-2026f-v3');
    var t=(raw?JSON.parse(raw):{}).theme||'auto';
    var d=(t==='dark')||(t==='auto'&&window.matchMedia&&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', d?'dark':'light');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', d?'#0e1219':'#2f5fd0');
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#f2f4f9; --panel:#ffffff; --line:#e4e8f1; --line2:#d2d9e6;
    --text:#1c2432; --muted:#7b8699; --accent:#2f5fd0; --accent-soft:#e9efff;
    --wk:#fbfcff; --r:16px;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.07);
    --h:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans TC",
                "Noto Sans TC","Microsoft JhengHei","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;
    -webkit-font-smoothing:antialiased;padding:20px 18px 60px;
  }
  .app{max-width:1340px;margin:0 auto}

  /* ---------- 頂欄 ---------- */
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:14px}
  .brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;
            padding:2px 8px;border-radius:9px;outline:none;transition:.15s;display:inline-block}
  .brand h1:hover{background:#fff}
  .brand h1:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  .brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted);padding-left:8px}
  .grow{flex:1 1 auto}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);
       border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
       box-shadow:var(--sh);margin-bottom:14px}
  .btn{appearance:none;border:1px solid var(--line2);background:#fff;color:var(--text);
       padding:7px 13px;border-radius:9px;font-size:13.5px;font-family:inherit;
       cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#27509f;color:#fff}
  .btn.ico{padding:7px 11px;font-size:15px;line-height:1}
  .btn.danger:hover{border-color:#d93a3f;color:#d93a3f;background:#fff2f2}

  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 14px;font-size:13.5px;font-family:inherit;
              cursor:pointer;color:var(--muted);font-weight:500;position:relative}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;
              background:#e5484d;color:#fff;font-size:10.5px;line-height:16px;font-weight:700;
              vertical-align:1px}
  .seg button.on .badge{background:#fff;color:var(--accent)}

  .weeklbl{font-weight:600;font-size:14.5px;min-width:190px;text-align:center;color:#2b3547}
  .weeklbl small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .tip{font-size:12.5px;color:#12894a;background:#e8f8ef;border:1px solid #c4ecd7;
       padding:4px 11px;border-radius:999px;opacity:0;transition:opacity .3s;white-space:nowrap}
  .tip.on{opacity:1}

  /* ---------- 左右滑動切換檢視（滑入動畫） ----------
     主路徑用 Web Animations API（見 swipeAnim），下面嘅 keyframes 只係舊瀏覽器後備。
     .swiping 係動畫期間嘅提示，令瀏覽器提早把張卡提上獨立合成層：
     之後每一格都只係改 transform／opacity，唔使重畫，主執行緒忙都照跑 60fps。 */
  .card.swiping{will-change:transform,opacity;backface-visibility:hidden}
  @keyframes swInNext{from{opacity:.4;transform:translateX(32px)}to{opacity:1;transform:none}}
  @keyframes swInPrev{from{opacity:.4;transform:translateX(-32px)}to{opacity:1;transform:none}}
  .card.swin-next{animation:swInNext .24s cubic-bezier(.22,.61,.36,1)}
  .card.swin-prev{animation:swInPrev .24s cubic-bezier(.22,.61,.36,1)}
  @media (prefers-reduced-motion: reduce){
    .card.swin-next,.card.swin-prev{animation:none}
  }

  /* ---------- 卡片 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        box-shadow:var(--sh);overflow:hidden}
  .card[hidden]{display:none}

  /* ---------- 週視圖 ---------- */
  .wkhead{display:grid;grid-template-columns:64px repeat(7,1fr);
          border-bottom:1.5px solid var(--line2);background:#fff}
  .wkhead .gut{border-right:1.5px solid var(--line2)}
  .wkhead .dh{padding:8px 5px 9px;text-align:center;border-right:1px solid var(--line);position:relative}
  .wkhead .dh:last-child{border-right:none}
  .wkhead .dh b{display:block;font-size:13.5px;font-weight:600;color:#3a465c}
  .wkhead .dh span{display:block;font-size:11.5px;color:#98a2b5;margin-top:2px}
  .wkhead .dh.wk{background:var(--wk)}
  .wkhead .dh.today{background:var(--accent-soft)}
  .wkhead .dh.today b{color:var(--accent)}
  .wkhead .dh.today span{color:#7d9ce8}
  .dh-todo{display:inline-block;margin-top:4px;background:#e5484d;color:#fff;font-size:9.5px;
           font-weight:700;padding:1px 6px;border-radius:8px;line-height:1.5}

  /* 週視圖：本週待辦條 */
  .wktodo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;
          border-bottom:1px solid var(--line);background:#fcfdff}
  .wktodo .wkt-h{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px;flex:0 0 auto}
  .wktodo .wkt-n{background:#eef1f7;color:#7b8699;border-radius:8px;padding:1px 7px;font-size:11px;flex:0 0 auto}
  .wktodo .wkt-list{display:flex;flex-wrap:wrap;gap:7px;flex:1 1 100%;min-width:0}
  /* 每週溫書時數 */
  .wkstudy{padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcff}
  .wkstudy .ws-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .wkstudy .ws-lbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .wkstudy .ws-num{font-size:20px;font-weight:700;color:var(--text);
                   font-variant-numeric:tabular-nums;line-height:1.1}
  .wkstudy .ws-unit{font-size:12px;color:var(--muted)}
  .wkstudy .ws-pill{margin-left:auto;font-size:11.5px;font-weight:600;border-radius:20px;
                    padding:3px 10px;white-space:nowrap}
  .wkstudy .ws-pill.ok{background:#e6f6ee;color:#0f6e56}
  .wkstudy .ws-pill.near{background:#fdf3e3;color:#8a5a12}
  .wkstudy .ws-pill.low{background:#fdeceb;color:#a32d2d}
  .wkstudy .ws-pill.none{background:#eef1f7;color:#7b8699}
  .wkstudy .ws-bar{height:7px;border-radius:20px;background:#e8ecf4;margin-top:8px;overflow:hidden}
  .wkstudy .ws-bar i{display:block;height:100%;border-radius:20px;transition:width .3s}
  .wkstudy .ws-bar i.ok{background:#1d9e75}
  .wkstudy .ws-bar i.near{background:#e0a02a}
  .wkstudy .ws-bar i.low{background:#e5484d}
  .wkstudy .ws-days{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .wkstudy .ws-d{flex:1 1 0;min-width:34px;text-align:center;font-size:10.5px;
                 color:#98a2b5;border-radius:7px;padding:3px 2px;background:#f1f4fa}
  .wkstudy .ws-d b{display:block;font-size:11.5px;color:#b3bccb;font-weight:600;
                   font-variant-numeric:tabular-nums}
  .wkstudy .ws-d.on{background:var(--accent-soft)}
  .wkstudy .ws-d.on b{color:var(--accent)}
  .wkstudy .ws-hint{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .wkstudy .ws-rec{margin-left:9px;padding:4px 12px;font-size:12px;flex:0 0 auto}
  .wkstudy .ws-split{margin-top:7px;font-size:11.5px;color:var(--muted)}
  /* 連續溫書日數 */
  .wkstudy .ws-streak{font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 10px;
                      white-space:nowrap;background:#eef2ff;color:#4a5a8a}
  .wkstudy .ws-streak b{font-variant-numeric:tabular-nums;color:#2f3d6b}
  /* 分科拆帳 */
  .wkstudy .ws-subj{margin-top:9px;border-top:1px dashed var(--line2);padding-top:9px}
  .wkstudy .ws-subj-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wkstudy .ws-subj-lbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .wkstudy .ws-seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .wkstudy .ws-seg button{appearance:none;border:0;background:transparent;font:inherit;
    font-size:11.5px;color:var(--muted);padding:3px 9px;cursor:pointer}
  .wkstudy .ws-seg button.on{background:var(--accent);color:#fff}
  .wkstudy .ws-subj-tot{margin-left:auto;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .wkstudy .ws-subj-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .wkstudy .ws-schip{display:flex;align-items:center;gap:6px;background:#fff;
    border:1px solid var(--line2);border-radius:9px;padding:4px 8px;font-size:11.5px;max-width:100%}
  .wkstudy .ws-schip b{font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:118px}
  .wkstudy .ws-schip i{font-style:normal;color:#7b8699;font-variant-numeric:tabular-nums}
  .wkstudy .ws-schip.none{border-style:dashed}
  .wkstudy .ws-schip.none b{color:#7b8699;font-weight:500}
  .wkstudy .ws-sbar{display:inline-block;width:42px;height:5px;border-radius:20px;
    background:#e8ecf4;overflow:hidden;flex:0 0 auto}
  .wkstudy .ws-sbar em{display:block;height:100%;background:var(--accent);border-radius:20px}
  .wkstudy .ws-schip.none .ws-sbar em{background:#b3bccb}
  .wkstudy .ws-smore{font-size:11.5px;color:var(--muted);align-self:center}
  html[data-theme="dark"] .wkstudy .ws-streak{background:#232b40;color:#a9b6dd}
  html[data-theme="dark"] .wkstudy .ws-streak b{color:#dbe3ff}
  html[data-theme="dark"] .wkstudy .ws-schip{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .wkstudy .ws-sbar{background:#2a3244}
  html[data-theme="dark"] .wkstudy .ws-schip.none .ws-sbar em{background:#5a6478}
  html[data-theme="dark"] .wkstudy .ws-seg{border-color:#2c3446}
  /* 本週溫書記錄對話框 */
  .lgrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);
         flex-wrap:wrap}
  .lgrow:last-of-type{border-bottom:none}
  .lgrow.today{background:var(--accent-soft);border-radius:8px;padding-left:8px;padding-right:8px}
  .lgd{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--text)}
  .lgd small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
  .lginput,.lgmin{flex:0 0 56px;width:56px;padding:8px 6px;border:1px solid var(--line2);border-radius:9px;
           font-family:inherit;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;
           color:var(--text);background:#fff}
  .lginput:focus,.lgmin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .lgin{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .lgu{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
  .lgnote{margin:-3px 0 7px 0;font-size:11.5px;color:#0f766e;background:#eefaf8;
          border:1px solid #cdeee9;border-radius:8px;padding:5px 9px;line-height:1.5}
  /* 分科下拉：獨立一行，唔會逼走原本嘅小時／分鐘輸入框 */
  .lgsubj{flex:1 1 100%;margin-top:6px;padding:7px 8px;border:1px solid var(--line2);
          border-radius:9px;font:inherit;font-size:12.5px;background:#fff;color:var(--text);
          max-width:100%}
  .lgsubj:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  html[data-theme="dark"] .lgsubj{background:#12171f;color:var(--text)}
  html[data-theme="dark"] .lgnote{color:#9FE3DD;background:#11302e;border-color:#1d4a46}
  .lgtot{margin-top:11px;padding:9px 11px;background:#f7f9fd;border:1px solid var(--line);
         border-radius:10px;font-size:13px;color:var(--muted);text-align:center}
  .lgtot b{font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
  html[data-theme="dark"] .lginput,html[data-theme="dark"] .lgmin{background:#12171f}
  html[data-theme="dark"] .lgtot{background:#1a2130}
  @media(max-width:420px){
    .lgrow{gap:7px}
    .lginput,.lgmin{flex:0 0 46px;width:46px;padding:8px 4px}
    .lgu{font-size:11.5px}
  }
  /* 本週「做過咩」摘要（非溫書時間） */
  .wkacts{padding:9px 12px;border-bottom:1px solid var(--line);background:#fdfcf8}
  .wa-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .wa-lbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .wa-num{font-size:20px;font-weight:700;color:var(--text);
          font-variant-numeric:tabular-nums;line-height:1.1}
  .wa-unit{font-size:12px;color:var(--muted)}
  .wa-note{font-size:11.5px;color:#a8b1c0}
  .wa-add{margin-left:auto;padding:4px 12px;font-size:12px;flex:0 0 auto}
  .wa-list{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .wa-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);
           border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--text);max-width:100%}
  .wa-chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .wa-chip i{font-style:normal;color:#7b8699;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wa-bar{display:block;width:34px;height:5px;border-radius:20px;background:#e8ecf4;overflow:hidden}
  .wa-bar em{display:block;height:100%;background:#93a0b4;border-radius:20px}
  html[data-theme="dark"] .wkacts{background:#15181f}
  html[data-theme="dark"] .wa-chip{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .wa-bar{background:#2a3244}
  /* 記錄做過咩 對話框 */
  .akdays{display:flex;gap:5px;margin:10px 0 12px}
  .akday{flex:1 1 0;min-width:0;border:1px solid var(--line2);background:#fff;border-radius:9px;
         padding:6px 2px;font-family:inherit;font-size:12px;color:var(--text);cursor:pointer;line-height:1.25}
  .akday small{display:block;font-size:10px;color:var(--muted);margin-top:1px}
  .akday.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .akday.on small{color:rgba(255,255,255,.8)}
  .akday.today:not(.on){border-color:var(--accent);color:var(--accent)}
  .akrow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .aklbl{flex:0 0 42px;font-size:13px;font-weight:500;color:var(--text)}
  .akin{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;
        font-family:inherit;font-size:14px;color:var(--text);background:#fff}
  .akin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .akquick{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 11px 50px}
  .akq{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:3px 11px;
       font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
  .akq:hover{border-color:var(--accent);color:var(--accent)}
  .akt{padding:8px 9px;border:1px solid var(--line2);border-radius:9px;font-family:inherit;
       font-size:14px;color:var(--text);background:#fff;font-variant-numeric:tabular-nums}
  .akt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .aku{font-size:12.5px;color:var(--muted)}
  .akdur{margin-left:auto;font-size:12px;color:#0f766e;font-variant-numeric:tabular-nums}
  .akdur.bad{color:#a32d2d}
  .aklist{margin-top:4px;border-top:1px solid var(--line);padding-top:9px}
  .aklt{font-size:11.5px;color:#7b8699;margin-bottom:6px}
  .akmsg{font-size:11.5px;color:#0f766e;background:#eefaf8;border:1px solid #cdeee9;
         border-radius:8px;padding:5px 9px;margin-bottom:7px}
  .aknone{font-size:12px;color:var(--muted);padding:6px 0}
  .akitem{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;
          border:1px solid var(--line);margin-bottom:5px;font-size:12.5px}
  .akitem.on{border-color:var(--accent);background:var(--accent-soft)}
  .akt2{flex:0 0 auto;color:#7b8699;font-variant-numeric:tabular-nums;font-size:11.5px}
  .akn{flex:1;min-width:0;font-weight:600;color:var(--text);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .akm{flex:0 0 auto;font-style:normal;color:#7b8699;font-size:11.5px}
  .akb{flex:0 0 auto;border:1px solid var(--line2);background:#fff;border-radius:7px;
       padding:2px 8px;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
  .akb:hover{border-color:var(--accent);color:var(--accent)}
  .akb.del:hover{border-color:#e5484d;color:#e5484d}
  html[data-theme="dark"] .akday,
  html[data-theme="dark"] .akin,
  html[data-theme="dark"] .akq,
  html[data-theme="dark"] .akt,
  html[data-theme="dark"] .akb{background:#12171f}
  html[data-theme="dark"] .akmsg{color:#9FE3DD;background:#11302e;border-color:#1d4a46}
  html[data-theme="dark"] .akdur{color:#9FE3DD}
  /* 溫書計時器 */
  .tmclock{font-size:40px;font-weight:700;text-align:center;letter-spacing:1px;
           font-variant-numeric:tabular-nums;color:var(--text);line-height:1.15;margin:4px 0 2px}
  .tmclock.run{color:var(--accent)}
  .tmclock.pause{color:#c08a2a}
  .tmstate{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:3px}
  .tmsince{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:14px;
           min-height:17px;line-height:1.5}
  .tmsince b{color:var(--accent);font-variant-numeric:tabular-nums}
  .tmbtns{display:flex;gap:9px}
  .tmbtns .btn{flex:1;min-width:0}
  .tmresult{margin-top:12px;padding:11px 12px;border-radius:10px;background:#e6f6ee;
            color:#0f6e56;font-size:13px;line-height:1.7;text-align:center}
  .tmresult .tmsub{font-size:12px;color:#3f8a72}
  /* 計時模式切換（自由／番茄） */
  .tmmode{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;
          margin-bottom:12px}
  .tmmode .tmm{flex:1;appearance:none;border:0;background:transparent;font:inherit;
    font-size:12.5px;font-weight:500;color:var(--muted);padding:8px 6px;cursor:pointer}
  .tmmode .tmm.on{background:var(--accent);color:#fff}
  /* 番茄鐘條 */
  .pomo{border:1px solid var(--line2);border-radius:11px;padding:10px 11px;margin-bottom:12px;
        background:#f7f9fd}
  .pomo-top{display:flex;align-items:center;gap:8px}
  .pomo-ph{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .pomo-ph.work{background:#fde8e6;color:#a32d2d}
  .pomo-ph.rest{background:#e6f6ee;color:#0f6e56}
  .pomo-left{margin-left:auto;font-size:19px;font-weight:700;color:var(--text);
             font-variant-numeric:tabular-nums}
  .pomo-dots{display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .pomo-dots i{width:8px;height:8px;border-radius:50%;background:#d8deea;display:block}
  .pomo-dots i.on{background:var(--accent)}
  .pomo-sub{margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .pomo-sub b{color:var(--accent)}
  .pomo-set{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;
            border-top:1px dashed var(--line2);padding-top:9px}
  .pomo-set label{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
  .pomo-set input{width:48px;padding:5px 4px;border:1px solid var(--line2);border-radius:8px;
    font:inherit;font-size:12px;text-align:center;background:#fff;color:var(--text)}
  /* 計時器：溫書科目 */
  .tmsubjrow{display:flex;align-items:center;gap:9px;margin:12px 0 10px}
  .tmsubjrow .tslbl{font-size:12px;font-weight:600;color:#7b8699;white-space:nowrap}
  .tmsubjrow .tsel{flex:1;min-width:0;padding:8px 9px;border:1px solid var(--line2);
    border-radius:9px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
  .tmsubjrow .tsel:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  html[data-theme="dark"] .pomo{background:#1a2130}
  html[data-theme="dark"] .pomo-set input,html[data-theme="dark"] .tmsubjrow .tsel{background:#131924}
  html[data-theme="dark"] .pomo-dots i{background:#39435a}
  /* ⚠️ 呢條一定要有：上面嘅深色規則帶咗 [data-theme] 屬性，權重係 (0,2,2)，
     會壓過 `.pomo-dots i.on` (0,2,1) —— 唔補返就會見到 4 粒點全部灰晒，
     明明完成咗都冇反應。 */
  html[data-theme="dark"] .pomo-dots i.on{background:var(--accent)}
  html[data-theme="dark"] .tmmode{border-color:#2c3446}
  .btn.rec{background:var(--accent);color:#fff;border-color:var(--accent);
           font-variant-numeric:tabular-nums}
  html[data-theme="dark"] .tmclock.pause{color:#efb45a}
  html[data-theme="dark"] .tmresult{background:#123326;color:#5dcaa5}
  html[data-theme="dark"] .tmresult .tmsub{color:#3f8a72}
  html[data-theme="dark"] .btn.rec{color:#0e1219}
  .wkt-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);
            background:#fff;border-radius:999px;padding:5px 11px 5px 9px;font-family:inherit;
            font-size:12.5px;color:#3a465c;cursor:pointer;max-width:100%;line-height:1.3}
  .wkt-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .wkt-chip b{font-weight:700;color:#98a2b5;font-size:11.5px;flex:0 0 auto}
  .wkt-chip:hover b{color:var(--accent)}
  .wkt-chip .wkt-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
  .wkt-chip .tdcd{font-size:11px;padding:3px 7px;flex:0 0 auto}
  .wkt-chip.late{border-color:#f3c2c4;background:#fff7f7}
  .wkt-chip.late b{color:#d93a3f}
  .wkt-chip.today{border-color:#f4d1ad;background:#fffaf3}
  .wkt-chip.today b{color:#c9600a}
  .tdrow.flash{background:var(--accent-soft);border-color:var(--accent)}

  .wkbody{display:grid;grid-template-columns:64px 1fr;position:relative}
  .times{position:relative;border-right:1.5px solid var(--line2)}
  .times .t{position:absolute;right:8px;font-size:11px;color:#a4aec0;white-space:nowrap;
            font-variant-numeric:tabular-nums}
  .cols{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
  .cols .col{position:relative;border-right:1px solid var(--line)}
  .cols .col:last-child{border-right:none}
  .cols .col.wk{background:var(--wk)}
  .cols .col.today{background:#f6f9ff}
  .hr{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
  .hr.half{background:#f1f4f9}
  .nowline{position:absolute;left:0;right:0;height:2px;background:#e5484d;z-index:5;pointer-events:none}
  .nowline::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;
                   border-radius:50%;background:#e5484d}

  .blk{position:absolute;border-radius:8px;border-left:4px solid;padding:5px 7px;
       font-size:11.5px;line-height:1.35;cursor:pointer;overflow:hidden;
       box-shadow:0 1px 2px rgba(16,24,40,.06);transition:box-shadow .12s}
  .blk:hover{box-shadow:0 4px 14px rgba(16,24,40,.16);z-index:4}
  .blk b{display:block;font-weight:600;font-size:12px;letter-spacing:.1px}
  .blk i{display:block;font-style:normal;opacity:.85;font-size:11px}
  .blk em{display:block;font-style:normal;opacity:.72;font-size:10.5px;margin-top:1px}
  .blk.oneoff{border-left-style:dashed}
  .blk.study{border-left-style:dashed;opacity:.94}
  .blk.study b{font-weight:600}
  /* 計時器自動記錄嘅時段：同「溫書時段」分開，用點線 + 錶面標記 */
  .blk.sess{border-left-style:dotted;opacity:.96}
  .blk.sess b::before{content:'⏱';font-size:10px;margin-right:4px;opacity:.85}
  .blk.sess em{opacity:.85}
  /* 非溫書時間：灰、斜紋感、更低調，一眼分得出唔係溫書 */
  .blk.act{border-left-style:dotted;opacity:.82}
  .blk.act b{font-weight:500;font-size:11.5px}
  .blk.act b::before{content:'·';font-size:14px;margin-right:4px;opacity:.6;line-height:0}
  .blk.act em{opacity:.8}
  .blk.exam{border:2px solid;border-left-width:5px;box-shadow:0 2px 8px rgba(16,24,40,.13)}
  .blk.exam b::before{content:'考';font-size:9.5px;background:rgba(20,28,44,.72);color:#fff;
                      padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px;
                      letter-spacing:1px}

  .empty{position:absolute;left:64px;right:0;top:0;bottom:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:9px;color:#9aa5b8;font-size:13.5px;
         pointer-events:none;text-align:center;padding:24px;line-height:1.75}
  .empty[hidden]{display:none}
  .empty b{color:#5b6880;font-size:15px;font-weight:600}
  .empty small{font-size:12.5px;color:#a8b1c2}

  /* ---------- 月總覽 ---------- */
  .months{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px;padding:16px}
  .mo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .mo h3{margin:0;padding:10px 12px;font-size:14px;font-weight:600;background:#f7f9fd;
         border-bottom:1px solid var(--line);color:#3a465c;display:flex;justify-content:space-between}
  .mo h3 span{color:var(--muted);font-weight:400;font-size:12px}
  .mo table{width:100%;border-collapse:collapse;table-layout:fixed}
  .mo th{font-size:10.5px;color:#98a2b5;font-weight:500;padding:5px 0;text-align:center}
  .mo td{border:1px solid #eef1f7;height:70px;vertical-align:top;padding:4px 3px;
         font-size:10.5px;cursor:pointer;overflow:hidden}
  .mo td:hover{background:#f7f9ff}
  .mo td.out{background:#fafbfd;color:#c8d0dd;cursor:default}
  .mo td.today{background:var(--accent-soft)}
  .mo .dn{color:#8c97a9;font-size:10px;font-weight:500}
  .mo td.today .dn{color:var(--accent);font-weight:700}
  .mo .chip{display:block;border-radius:4px;padding:1.5px 4px;margin-top:2px;font-size:9.5px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2.5px solid;
            letter-spacing:-.1px}
  .mo .chip.study{border-left-style:dashed}
  .mo .chip.sess{border-left-style:dotted}
  .mo .chip.exam{border-left-width:4px;font-weight:700}
  .mo .more{font-size:9.5px;color:var(--muted);margin-top:1px;display:block}
  /* 月總覽：每週溫書時數欄 */
  .mo th.wksum{width:46px;font-size:9.5px;color:#98a2b5;padding:5px 0}
  .mo td.wksum{width:46px;text-align:center;vertical-align:middle;padding:4px 2px;
               font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
               color:#98a2b5;background:#fbfcff;cursor:pointer}
  .mo td.wksum b{display:block;font-size:12px}
  .mo td.wksum small{font-size:9px;font-weight:400;color:#b3bccb}
  .mo td.wksum.hit{color:#0f6e56;background:#f2fbf7}
  .mo td.wksum.hit small{color:#5aa88c}
  .mo td.wksum.miss{color:#a32d2d;background:#fdf6f6}
  .mo td.wksum.miss small{color:#cf8a8a}
  .mo .tddot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#e5484d;
             margin-left:3px;vertical-align:1px}

  /* ---------- 月總覽：手機要「剛剛好睇得晒」 ----------
     上面用 minmax(520px,1fr)：桌面舒服，但螢幕窄過 520px 就會撐爆成 520px，
     而 .card 係 overflow:hidden，於是右邊「六」同「溫書」兩欄會被直接切走
     （390px 實測：容器 368px、月格 520px，差 152px，冇得捲）。
     窄螢幕強制一欄 + 收窄內距／字級，令 8 欄塞得入 320px 以上嘅機。
     用 `screen and` 而唔係純 max-width：唔想影響列印（列印另有 repeat(2,1fr)）。 */
  @media screen and (max-width:760px){
    .months{grid-template-columns:1fr;gap:12px;padding:10px}
    .mo h3{font-size:12.5px;padding:8px 10px}
    .mo h3 span{font-size:10.5px}
    .mo th{font-size:9px;padding:4px 0}
    .mo th.wksum,.mo td.wksum{width:28px}
    .mo td{height:56px;padding:3px 1px;font-size:9.5px}
    .mo .dn{font-size:9.5px}
    .mo .chip{font-size:8.5px;padding:1px 1.5px;border-left-width:2px;border-radius:3px;
              margin-top:1.5px;letter-spacing:-.2px}
    .mo .chip.exam{border-left-width:3px}
    .mo .more{font-size:8.5px}
    .mo td.wksum b{font-size:11px}
    .mo td.wksum small{font-size:8px}
    .mo .tddot{width:4px;height:4px;margin-left:2px}
  }

  /* ---------- 待辦清單 ---------- */
  .todo-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
             flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
  .todo-head h2{margin:0;font-size:16px}
  .todo-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
  .todo-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .todo-add input[type=text]{padding:9px 12px;border:1px solid var(--line2);border-radius:9px;
       font-size:14px;font-family:inherit;width:250px}
  .todo-add input[type=date]{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;
       font-size:13px;font-family:inherit;color:var(--muted)}
  .todo-add input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,95,208,.12)}
  .bar-progress{height:6px;background:#eef1f7;border-radius:3px;overflow:hidden;margin:0 20px 4px}
  .bar-progress i{display:block;height:100%;background:#31a24c;border-radius:3px;transition:width .3s}
  .todo-body{padding:8px 20px 22px}
  .tsec{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px;margin:18px 0 8px;
        display:flex;align-items:center;gap:8px}
  .tsec .n{background:#eef1f7;color:#7b8699;border-radius:8px;padding:1px 7px;font-size:11px}
  .tsec.late{color:#d93a3f}
  .tsec.late .n{background:#ffe9e9;color:#d93a3f}
  .tdrow{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);
         border-radius:11px;margin-bottom:7px;transition:.15s;background:#fff;
         flex-wrap:wrap;row-gap:8px}
  .tdrow:hover{border-color:var(--line2);background:#fafbfe}
  .tdrow.done{opacity:.5}
  .tdrow input[type=checkbox]{width:17px;height:17px;accent-color:#31a24c;cursor:pointer;flex:0 0 auto}
  /* ⚠ .txt 一定要有 min-width，唔可以淨係 flex:1；v42 加咗延後／釘住／
     日期徽章之後固定寬度嘅兄弟多咗，窄螢幕上會將文字欄壓到得一兩隻字闊，
     變成「每行一個字」。加咗 flex-basis 同 min-width 之後就會正常換行。 */
  .tdrow .txt{flex:1 1 140px;min-width:110px;font-size:14px;outline:none;padding:2px 4px;
              border-radius:6px;word-break:break-word}
  .tdrow .txt:focus{background:var(--accent-soft)}
  .tdrow.done .txt{text-decoration:line-through}
  .tdrow input[type=date]{border:1px solid transparent;background:transparent;font-size:12.5px;
       font-family:inherit;color:var(--muted);padding:4px 6px;border-radius:7px;cursor:pointer;
       width:132px;flex:0 0 auto;max-width:100%}
  .tdrow input[type=date]:hover{border-color:var(--line2);background:#fff}
  .tdrow input[type=date].due-soon{color:#c9760a;font-weight:600}
  .tdrow input[type=date].due-late{color:#d93a3f;font-weight:600}
  .tdrow .tdcd{flex:0 0 auto;font-size:11.5px;font-weight:700;line-height:1;
               padding:4px 8px;border-radius:999px;background:#eef1f7;color:#65718a;white-space:nowrap}
  .tdrow .tdcd.soon{background:#fff4e2;color:#c9760a}
  .tdrow .tdcd.today{background:#ffe6cf;color:#c9600a}
  .tdrow .tdcd.late{background:#ffe9e9;color:#d93a3f}
  .tdrow.done .tdcd{display:none}
  .tdrow .del{border:none;background:transparent;color:#c3cad7;cursor:pointer;font-size:16px;
              padding:2px 6px;border-radius:6px;line-height:1;font-family:inherit}
  .tdrow .del:hover{background:#fff0f0;color:#d93a3f}
  .tdempty{text-align:center;padding:44px 20px;color:#9aa5b8;line-height:1.9;font-size:13.5px}
  .tdempty b{display:block;color:#5b6880;font-size:15px;margin-bottom:6px}

  /* ---------- 目標成績 ---------- */
  .ghead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
         gap:12px;align-items:flex-end;justify-content:space-between}
  .ghead h2{margin:0;font-size:16px}
  .ghead p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
  .gbody{padding:14px 20px 22px}

  .gcard{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fff;
         overflow:hidden}
  .gcard>header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fafbfe;
                flex-wrap:wrap}
  .gcard>header .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .gcard>header b{font-size:14px;flex:1;min-width:90px}
  .gpill{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
         padding:3px 10px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .gpill.none{color:#9aa5b8;background:#eef1f7;font-weight:600}
  .gtgt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .gtgt select{border:1px solid var(--line2);border-radius:8px;padding:5px 7px;font-size:13px;
               font-family:inherit;font-weight:600;color:var(--text);background:#fff;cursor:pointer}
  .gtgt select:focus{outline:none;border-color:var(--accent)}
  .gempty{text-align:center;padding:44px 20px;color:#9aa5b8;line-height:1.9;font-size:13.5px}
  .gempty b{display:block;color:#5b6880;font-size:15px;margin-bottom:6px}
  /* 預計 GPA 條 */
  .gproj{display:flex;align-items:flex-start;gap:0;flex-wrap:wrap;padding:16px 20px;
         border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f7f9ff,#eef3ff)}
  .gpcell{flex:1 1 220px;min-width:0;padding-right:22px}
  .gpcell+.gpcell{border-left:1px solid #e2e8f7;padding-left:22px;padding-right:0}
  .gpcell .gpa-meta{margin-top:7px}
  .gproj .gp-hint{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:6px;max-width:460px}
  .gproj .gp-note{font-size:11.5px;color:#9aa5b8;width:100%;margin-top:9px;line-height:1.6}
  .gcred{font-size:11.5px;color:#a4aec0;white-space:nowrap;font-variant-numeric:tabular-nums}
  .gcred.warn{color:#c9760a}
  .scalegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:9px}
  .scalegrid label{display:block;font-size:12px;color:#5b6880;margin-bottom:4px;font-weight:600}
  .scalegrid input{width:100%;padding:8px 6px;border:1px solid var(--line2);border-radius:8px;
                   font-size:14px;font-family:inherit;text-align:center}
  .scalegrid input:focus{outline:none;border-color:var(--accent)}

  /* ---------- 抽屜 ---------- */
  .mask{position:fixed;inset:0;background:rgba(18,26,42,.42);z-index:80;display:flex;
        justify-content:flex-end;backdrop-filter:blur(2px)}
  .mask[hidden]{display:none}
  .drawer{width:min(540px,100%);height:100%;background:#fff;box-shadow:-10px 0 40px rgba(16,24,40,.2);
          display:flex;flex-direction:column;animation:sl .22s ease}
  @keyframes sl{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
                 align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .drawer header h2{margin:0;font-size:16px}
  .drawer .list{flex:1;overflow:auto;padding:12px 16px 24px}
  .gsec{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px;margin:16px 0 8px}
  .gsec:first-child{margin-top:0}
  .crow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);
        border-radius:11px;margin-bottom:9px;transition:.15s}
  .crow:hover{border-color:var(--line2);background:#fafbfe}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .crow .inf{flex:1;min-width:0}
  .crow .inf b{display:block;font-size:13.5px}
  .crow .inf span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .crow .acts{display:flex;gap:6px}
  .crow .acts button{border:none;background:#f2f5fa;color:#4c5a70;border-radius:7px;
                     padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
  .crow .acts button:hover{background:var(--accent-soft);color:var(--accent)}
  .crow .acts button.del:hover{background:#fff0f0;color:#d93a3f}

  /* ---------- 彈窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(18,26,42,.45);z-index:90;display:flex;
         align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
  .modal[hidden]{display:none}
  .dlg{background:#fff;border-radius:16px;width:min(450px,100%);box-shadow:0 24px 60px rgba(16,24,40,.28);
       overflow:hidden;animation:pop .18s ease;max-height:92vh;display:flex;flex-direction:column}
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
  .dlg h3{margin:0;padding:16px 20px 12px;font-size:16px;border-bottom:1px solid var(--line)}
  .dlg .bd{padding:16px 20px;overflow:auto}
  .dlg .ft{padding:12px 20px 16px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;
           border-top:1px solid var(--line);background:#fcfdff}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;color:#5b6880;margin-bottom:5px;font-weight:500}
  .fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;
    font-size:14px;font-family:inherit;color:var(--text);background:#fff}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,95,208,.12)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sws{display:flex;gap:8px;flex-wrap:wrap}
  .sws button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
  .sws button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
  .daypick{display:flex;gap:6px;flex-wrap:wrap}
  .daypick button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 0;
                  width:46px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--muted);
                  font-weight:500;transition:.15s}
  .daypick button:hover{border-color:var(--accent);color:var(--accent)}
  .daypick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .meta{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
        font-size:13px;color:#4c5a70;line-height:1.85;margin-bottom:14px}
  .meta b{color:var(--text)}
  .choice{display:flex;flex-direction:column;gap:10px}
  .choice button{text-align:left;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;
                 background:#fff;cursor:pointer;font-family:inherit;transition:.15s}
  .choice button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .choice b{display:block;font-size:14px;color:var(--text);margin-bottom:3px}
  .choice span{font-size:12.5px;color:var(--muted)}

  /* ---------- 截止倒數 ---------- */
  .cdhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
          flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
  .cdhead h2{margin:0;font-size:16px}
  .cdhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .cdhero{margin:16px 18px;border:1px solid #dbe4fb;border-radius:14px;padding:18px 20px;
          display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
          background:linear-gradient(135deg,#f5f8ff,#eef3ff)}
  .cdhero.today{background:linear-gradient(135deg,#fff7ec,#ffefd6);border-color:#f2ddb5}
  .cdhero.past{background:linear-gradient(135deg,#fff5f5,#ffecec);border-color:#f5d0d0}
  .cdh-left{min-width:0;flex:1}
  .cdh-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
           background:var(--accent-soft);color:var(--accent);margin-bottom:7px}
  .cdh-name{display:block;font-size:19px;font-weight:700;color:var(--text);line-height:1.35;
            word-break:break-word}
  .cdh-date{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
  .cdh-right{text-align:center;flex:0 0 auto;min-width:120px}
  .cdh-lead{display:block;font-size:12px;color:var(--muted);letter-spacing:1px}
  .cdh-num{font-size:52px;font-weight:800;line-height:1;color:var(--accent);
           font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .cdh-unit{font-size:15px;color:var(--muted);margin-left:3px}
  .cdh-live{display:block;margin-top:7px;font-size:13px;font-weight:600;color:#5b6880;
            font-variant-numeric:tabular-nums}
  .cdhero.today .cdh-num,.cdhero.today .cdh-live{color:#c9760a}
  .cdhero.past .cdh-num,.cdhero.past .cdh-live{color:#d93a3f}

  .cdlist{padding:4px 18px 18px}
  .cdsec{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px;margin:14px 0 8px}
  .cdsec:first-child{margin-top:6px}
  .cdsec .n{display:inline-block;margin-left:6px;background:#eef1f6;color:#7b8699;
            border-radius:8px;padding:0 7px;font-size:11px;line-height:17px;font-weight:700}
  .cdrow{display:flex;align-items:center;gap:13px;padding:11px 13px;border:1px solid var(--line);
         border-radius:12px;margin-bottom:9px;transition:.15s}
  .cdrow:hover{border-color:var(--line2);background:#fafbfe}
  .cdbox{flex:0 0 auto;width:58px;text-align:center;border-radius:10px;padding:6px 0;
         background:#eef2f9;color:#3d4757}
  .cdbox b{display:block;font-size:20px;font-weight:800;line-height:1.15;
           font-variant-numeric:tabular-nums}
  .cdbox span{font-size:10.5px;opacity:.82}
  .cdrow.soon .cdbox{background:#fdece0;color:#b45c14}
  .cdrow.week .cdbox{background:#fdf6dc;color:#8a6d13}
  .cdrow.today .cdbox{background:#ffe2e2;color:#c02b30}
  .cdrow.past .cdbox{background:#e7e9ee;color:#8a93a3}
  .cdinfo{flex:1;min-width:0}
  .cdinfo b{display:block;font-size:14px;font-weight:600;word-break:break-word}
  .cdinfo span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .cdrow.past .cdinfo b{color:#8a93a3}
  .cdtag{flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
         background:#eef1f6;color:#5b6880}
  .cdtag.t-exam{background:#fde3e4;color:#c02b30}
  .cdtag.t-todo{background:#e7eeff;color:#2f5fd0}
  .cdtag.t-assignment{background:#fdece0;color:#b45c14}
  .cdtag.t-project{background:#eae2fb;color:#6b3fb5}
  .cdtag.t-quiz{background:#e0f3ef;color:#0f766e}
  .cdacts{flex:0 0 auto;display:flex;gap:6px;align-items:center}
  .cdacts button{border:none;background:#f2f5fa;color:#4c5a70;border-radius:7px;
                 padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
  .cdacts button:hover{background:var(--accent-soft);color:var(--accent)}
  .cdacts button.del:hover{background:#fff0f0;color:#d93a3f}
  .cdsrc{font-size:11px;color:#a4aec0}
  .cdempty{text-align:center;padding:40px 20px;color:#9aa5b8;line-height:1.9;font-size:13.5px}
  .cdempty b{display:block;color:#5b6880;font-size:15px;margin-bottom:6px}

  /* ---------- GPA 計算機 ---------- */
  .gpa-sum{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:16px 20px;
           border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f7f9ff,#eef3ff)}
  .gpa-big{display:flex;align-items:baseline;gap:7px}
  .gpa-big b{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1;
             color:var(--accent);font-variant-numeric:tabular-nums}
  .gpa-big.none b{font-size:26px;color:#9aa5b8;letter-spacing:0}
  .gpa-big small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1.5px}
  .gpa-meta{display:flex;gap:20px;flex-wrap:wrap}
  .gpa-meta span{font-size:12px;color:var(--muted)}
  .gpa-meta b{display:block;font-size:17px;font-weight:700;color:var(--text);
              font-variant-numeric:tabular-nums;margin-bottom:1px}
  .gpa-body{padding:10px 16px 18px}
  .gpa-row{display:grid;grid-template-columns:1fr 74px 100px 48px 30px;gap:8px;align-items:center;
           padding:4px;border-radius:9px}
  .gpa-row:hover{background:#fafbfe}
  .gpa-row.head{font-size:11px;color:#98a2b5;font-weight:600;padding-bottom:2px}
  .gpa-row.head:hover{background:none}
  .gpa-row.head span{padding:0 8px}
  .gpa-row input,.gpa-row select{border:1px solid transparent;background:transparent;border-radius:8px;
     font-family:inherit;font-size:13.5px;padding:7px 8px;width:100%;color:var(--text);min-width:0}
  .gpa-row input:hover,.gpa-row select:hover{border-color:var(--line2);background:#fff}
  .gpa-row input:focus,.gpa-row select:focus{outline:none;border-color:var(--accent);background:#fff;
     box-shadow:0 0 0 3px rgba(47,95,208,.12)}
  .gpa-row input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
  .gpa-row select{cursor:pointer;font-weight:600;text-align:center}
  .gpa-row .gp{text-align:center;font-size:12.5px;color:#5b6880;font-weight:600;
               font-variant-numeric:tabular-nums}
  .gpa-row .x{border:none;background:transparent;color:#c3cad7;font-size:16px;cursor:pointer;
              border-radius:6px;line-height:1;padding:3px 0;font-family:inherit}
  .gpa-row .x:hover{background:#fff0f0;color:#d93a3f}
  .gpa-foot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:8px 4px 2px}
  .gpa-foot .btn{padding:5px 11px;font-size:12.5px}
  .gpa-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
  .gpa-legend div{border:1px solid var(--line);border-radius:9px;padding:7px 6px;text-align:center;
                  background:#fafbfe}
  .gpa-legend b{display:block;font-size:14px}
  .gpa-legend span{font-size:11px;color:var(--muted)}

  /* ---------- 每日記錄 ---------- */
  .diary-body{padding:14px 18px 20px}
  /* 每月總結 */
  .msum{padding:12px 18px 14px;border-bottom:1px solid var(--line);background:#fbfcff}
  .ms-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ms-lbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .ms-nav{display:flex;align-items:center;gap:5px}
  .ms-ar{width:24px;height:24px;border:1px solid var(--line2);background:#fff;border-radius:7px;
         font-family:inherit;font-size:15px;line-height:1;color:var(--text);cursor:pointer;padding:0}
  .ms-ar:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
  .ms-ar[disabled]{opacity:.32;cursor:default}
  .ms-mk{font-size:13px;font-weight:600;color:var(--text);min-width:104px;text-align:center;
         font-variant-numeric:tabular-nums}
  .ms-copy{margin-left:auto;padding:4px 12px;font-size:12px}
  .ms-toast{font-size:11.5px;border-radius:20px;padding:3px 10px}
  .ms-toast.ok{background:#e6f6ee;color:#0f6e56}
  .ms-toast.bad{background:#fdeceb;color:#a32d2d}
  .ms-sum{margin-top:10px;font-size:13px;line-height:1.75;color:var(--text);
          background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .ms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .ms-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 11px;
           min-width:0}
  .ms-k{display:block;font-size:11px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .ms-v{display:block;font-size:17px;font-weight:700;color:var(--text);margin-top:2px;
        font-variant-numeric:tabular-nums;line-height:1.25;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms-s{display:block;font-size:10.5px;color:var(--muted);font-style:normal;margin-top:2px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms-sparkwrap{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:11px;
                padding:8px 11px 5px}
  .ms-spark{display:block;width:100%;height:46px}
  .ms-sparkcap{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
  .ms-kw{margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ms-kwl{font-size:11px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .ms-chip{background:#fff;border:1px solid var(--line2);border-radius:20px;padding:3px 10px;
           font-size:11.5px;color:var(--text)}
  .ms-chip i{font-style:normal;color:#98a2b5;margin-left:5px;font-variant-numeric:tabular-nums}
  .ms-hi{margin-top:9px;font-size:12px;color:var(--muted)}
  .ms-hi b{color:var(--text)}
  .ms-empty{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.7;
            background:#fff;border:1px dashed var(--line2);border-radius:11px;padding:11px 13px}
  html[data-theme="dark"] .msum{background:#15181f}
  html[data-theme="dark"] .ms-sum,
  html[data-theme="dark"] .ms-card,
  html[data-theme="dark"] .ms-sparkwrap,
  html[data-theme="dark"] .ms-chip,
  html[data-theme="dark"] .ms-ar,
  html[data-theme="dark"] .ms-empty{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .ms-spark line{stroke:#2c3446}

  /* ---------- 歌手統計（日記） ---------- */
  .artstat{padding:12px 18px 14px;border-bottom:1px solid var(--line);background:#fbfcff}
  .as-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .as-lbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px}
  .as-seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .as-seg button{appearance:none;border:0;background:#fff;font-family:inherit;
                 font-size:11.5px;line-height:1;padding:5px 10px;cursor:pointer;color:var(--muted)}
  .as-seg button+button{border-left:1px solid var(--line2)}
  .as-seg button.on{background:var(--accent);color:#fff}
  .as-tot{margin-left:auto;font-size:11.5px;color:var(--muted);
          font-variant-numeric:tabular-nums;text-align:right}
  .as-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .as-row{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(46px,118px) 44px;
          align-items:center;gap:8px}
  .as-rk{font-size:11px;font-weight:700;color:#a7b0c0;text-align:right;
         font-variant-numeric:tabular-nums}
  .as-row:nth-child(1) .as-rk{color:var(--accent)}
  .as-nm{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;
         white-space:nowrap}
  .as-bar{display:block;height:7px;border-radius:6px;background:#e9edf5;overflow:hidden}
  .as-bar i{display:block;height:100%;border-radius:6px;background:var(--accent);opacity:.8}
  .as-row:nth-child(1) .as-bar i{opacity:1}
  .as-n{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .as-note{margin:9px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
  .as-retry{appearance:none;border:1px solid var(--line2);background:#fff;font-family:inherit;
            font-size:11.5px;line-height:1;border-radius:20px;padding:4px 11px;margin-left:7px;
            cursor:pointer;color:var(--accent);white-space:nowrap}
  .as-retry:hover{border-color:var(--accent);background:var(--accent-soft)}
  .as-busy{display:inline-block;margin-left:7px;font-size:11.5px;color:var(--accent)}
  html[data-theme="dark"] .as-retry{background:#1b2130;border-color:#2c3446}
  .as-empty{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.7;
            background:#fff;border:1px dashed var(--line2);border-radius:11px;padding:11px 13px}
  html[data-theme="dark"] .artstat{background:#15181f}
  html[data-theme="dark"] .as-seg button,
  html[data-theme="dark"] .as-empty{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .as-seg button.on{background:var(--accent);color:#fff}
  html[data-theme="dark"] .as-bar{background:#2c3446}
  /* ---------- 學期 / 季度管理 ---------- */
  .tmlist{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
  .tmitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;
          padding:8px 10px;background:#fff}
  .tmitem.cur{border-color:var(--accent);background:var(--accent-soft)}
  .tmi-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
            gap:2px;border:none;background:transparent;padding:2px 3px;font-family:inherit;
            cursor:pointer;text-align:left;color:inherit;border-radius:8px}
  .tmi-main:hover{background:rgba(127,127,127,.08)}
  .tmi-name{font-size:13.5px;font-weight:700;color:var(--text);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .tmi-sub{font-size:11.5px;color:var(--muted);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .tmi-cur{font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
           border-radius:20px;padding:0 7px;margin-left:5px;white-space:nowrap;vertical-align:1px}
  .tmitem button[data-act]{flex:0 0 auto;border:1px solid var(--line2);background:#fff;
           border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;
           font-weight:500;color:#41506b;white-space:nowrap}
  .tmitem button[data-act]:hover{border-color:var(--accent);color:var(--accent)}
  .tmitem button.del:hover{border-color:#e5484d;color:#e5484d}
  .tmform{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
  .tmfttl{font-size:13px;font-weight:700;color:var(--text)}
  .tmrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tmfld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .tmfld label{font-size:11.5px;font-weight:700;color:#7b8699;letter-spacing:.3px}
  .tmfld input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line2);
           border-radius:9px;font-family:inherit;font-size:13px;color:var(--text);background:#fff}
  .tmfld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .tmpv{font-size:12px;line-height:1.75;color:var(--muted);background:#fafbfe;
        border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .tmpv b{color:var(--text)}
  .tmpv.bad{border-color:#e5484d;color:#a32d2d;background:#fff5f5}
  .tmpv-warn{color:#a32d2d;font-weight:600}
  .tmfbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  html[data-theme="dark"] .tmitem{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .tmitem.cur{background:#1d2a3d;border-color:var(--accent)}
  html[data-theme="dark"] .tmitem button[data-act]{background:#232b3c;border-color:#37405a;color:#c3cde0}
  html[data-theme="dark"] .tmfld input{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .tmpv{background:#1b2130;border-color:#2c3446}
  html[data-theme="dark"] .tmpv.bad{background:#2a1a1c;border-color:#7a2f33}
  @media(max-width:760px){ .tmrow{grid-template-columns:1fr} }
  .dday{border:1px solid var(--line);border-radius:13px;margin-bottom:13px;background:#fff;
        overflow:hidden}
  .dday-head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#fafbfe;
             border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dday-date{font-size:14px;font-weight:700;color:var(--text);min-width:78px;
             font-variant-numeric:tabular-nums}
  .dday-date span{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:3px}
  .dday-head input[type=date]{border:1px solid var(--line2);border-radius:8px;padding:4px 7px;
             font-size:12.5px;font-family:inherit;color:var(--text);background:#fff}
  .dday-head input[type=date]:focus{outline:none;border-color:var(--accent)}
  .dday-head .grow{flex:1 1 auto}
  .dday-head button{border:none;background:#eef2fa;color:#41506b;border-radius:8px;padding:5px 10px;
             font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
  .dday-head button:hover{background:var(--accent-soft);color:var(--accent)}
  .dday-head button.del:hover{background:#fff0f0;color:#d93a3f}
  .dday-note{display:block;width:100%;border:none;border-bottom:1px solid var(--line);
             padding:11px 14px;font-family:inherit;font-size:13.5px;line-height:1.7;color:var(--text);
             resize:vertical;min-height:54px;background:#fff}
  .dday-note:focus{outline:none;background:#fcfdff}
  .dday-note::placeholder{color:#a8b1c2}
  .dday-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;
               padding:12px 14px}
  .dphoto{position:relative;margin:0;border-radius:11px;overflow:hidden;background:#eef1f7;
          aspect-ratio:1/1}
  .dphoto img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .dphoto.missing::after{content:'相片載入失敗';position:absolute;inset:0;display:flex;
          align-items:center;justify-content:center;font-size:11px;color:#98a2b5}
  .dphoto .x{position:absolute;top:5px;right:5px;border:none;background:rgba(18,26,42,.6);color:#fff;
          width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;
          font-family:inherit;opacity:0;transition:.15s}
  .dphoto:hover .x{opacity:1}
  .dphoto .x:hover{background:#d93a3f}
  .dday-empty{padding:13px 14px;color:#a8b1c2;font-size:12.5px}
  /* 心情評分（5 級 emoji） */
  .dday-mood{display:flex;align-items:center;gap:6px;padding:11px 14px 0;flex-wrap:wrap}
  .dday-mood .dmlbl{font-size:12px;font-weight:700;color:#7b8699;letter-spacing:.4px;margin-right:2px}
  .dday-mood button{border:1px solid transparent;background:#f4f6fa;border-radius:10px;
        font-size:19px;line-height:1;padding:5px 8px;cursor:pointer;font-family:inherit;
        opacity:.45;transition:.15s}
  .dday-mood button:hover{opacity:1;background:#eef2fa}
  .dday-mood button.on{background:var(--accent-soft);border-color:var(--accent);
        opacity:1;transform:scale(1.08)}
  .dmood-ic{font-style:normal;font-size:14px;margin-left:4px}
  /* 選中（貼上相片嘅目標） */
  .dday.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .dday.sel .dday-head{background:var(--accent-soft)}
  .dday.pasting{border-color:#31a24c;box-shadow:0 0 0 2px #d7f2de}
  /* 每日一歌 */
  .dday-song{padding:12px 14px 0}
  .dday-song .shead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .dday-song .shead b{font-size:12.5px;font-weight:700;color:#41506b}
  .dday-song .shead .grow{flex:1 1 auto}
  /* 封面 + 曲名（就算播放器載唔到都睇得到） */
  .dday-song .srow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .dday-song .cover{width:76px;height:76px;border-radius:10px;object-fit:cover;
        flex:0 0 auto;background:#eef1f7;display:block}
  .dday-song .cover.ph{display:flex;align-items:center;justify-content:center;
        font-size:10.5px;color:#a8b1c2;letter-spacing:.5px}
  .dday-song .smeta{min-width:0;display:flex;flex-direction:column;gap:3px}
  .dday-song .stitle{font-size:14.5px;font-weight:700;color:var(--text);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dday-song .ssub{font-size:12px;color:var(--muted);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 30 秒試聽（原生 audio 播放器） */
  .dday-song .prevrow{margin-bottom:10px}
  /* 認到嘅歌手名（歌手統計會用呢個名做合併） */
  .dday-song .sartist{align-self:flex-start;font-size:11px;color:var(--accent);
        background:var(--accent-soft);border-radius:999px;padding:2px 9px;
        max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dday-song .pvhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .dday-song .pvlbl{font-size:11.5px;font-weight:700;color:#2f5fd0;background:var(--accent-soft);
        border-radius:999px;padding:3px 9px;flex:0 0 auto}
  .dday-song .pvname{font-size:11.5px;color:var(--muted);min-width:0;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dday-song audio{width:100%;display:block;border-radius:10px}
  .dday-song .shead button{border:none;background:#eef2fa;color:#41506b;border-radius:7px;
        padding:4px 9px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .dday-song .shead button:hover{background:#fff0f0;color:#d93a3f}
  .dday-song .open{display:inline-block;margin-top:2px;font-size:12px;font-weight:600;
        color:var(--accent);text-decoration:none;border:1px solid var(--line2);
        border-radius:9px;padding:6px 11px;background:#fbfcff}
  .dday-song .open:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .dday-addsong{padding:12px 14px 0}
  .dday-addsong button{border:1px dashed var(--line2);background:#fbfcff;color:#5b6880;
        border-radius:9px;padding:6px 11px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .dday-addsong button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .dhint{font-size:12px;color:#9aa5b8;margin:4px 0 0}
  .songerr{color:#d93a3f;font-size:12px;margin-top:6px;min-height:15px}
  .card.dragging{outline:2px dashed var(--accent);outline-offset:-4px}
  .dempty{text-align:center;padding:44px 20px;color:#9aa5b8;line-height:1.9;font-size:13.5px}
  .dempty b{display:block;color:#5b6880;font-size:15px;margin-bottom:6px}
  .photoview{padding:14px;text-align:center}
  .photoview img{max-width:100%;max-height:82vh;border-radius:10px;display:block;margin:0 auto}
  .modal[data-mode=photo]{background:rgba(8,12,20,.82)}
  .modal[data-mode=photo] .dlg{background:transparent;box-shadow:none;width:auto;max-width:none;
       animation:none}

  /* ================= 可安裝 App（PWA） ================= */
  /* 避開 iPhone 瀏海／底部橫條，加入主畫面後不會被裁切 */
  body{
    padding:calc(20px + env(safe-area-inset-top,0px))
            calc(18px + env(safe-area-inset-right,0px))
            calc(60px + env(safe-area-inset-bottom,0px))
            calc(18px + env(safe-area-inset-left,0px));
  }
  @media (max-width:760px){
    body{
      padding:calc(14px + env(safe-area-inset-top,0px))
              calc(10px + env(safe-area-inset-right,0px))
              calc(50px + env(safe-area-inset-bottom,0px))
              calc(10px + env(safe-area-inset-left,0px));
    }
    .ms-grid{grid-template-columns:repeat(2,1fr)}
    .ms-copy{margin-left:0}
    .ms-mk{min-width:0}
    .artstat{padding:10px 12px 12px}
    .as-row{grid-template-columns:18px minmax(0,1fr) minmax(38px,68px) 40px;gap:6px}
    .as-tot{width:100%;margin-left:0;text-align:left}
  }

  /* 加入主畫面提示條 */
  .inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
        z-index:70;display:flex;align-items:center;gap:12px;background:#fff;
        border:1px solid var(--line);border-radius:14px;padding:11px 13px;
        box-shadow:0 12px 36px rgba(16,24,40,.2);animation:instup .28s ease;
        max-width:520px;margin:0 auto}
  @keyframes instup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .inst[hidden]{display:none}
  .inst img{width:40px;height:40px;border-radius:10px;flex:0 0 auto;
            box-shadow:0 2px 8px rgba(16,24,40,.16)}
  .inst .tx{flex:1;min-width:0}
  .inst .tx b{display:block;font-size:13.5px;font-weight:600}
  .inst .tx span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.55}
  .inst .x{border:none;background:transparent;color:#b6bfcd;font-size:20px;cursor:pointer;
           padding:0 4px;line-height:1;font-family:inherit;flex:0 0 auto}
  .inst .x:hover{color:#7b8699}
  @media print{.inst{display:none !important}}

  @media (display-mode: standalone){

  }
