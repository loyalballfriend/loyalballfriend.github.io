/* 讀圖 → 縮圖 → JPEG dataURL（唔想原相逼爆儲存） */
function shrinkImage(file, cb){
  if(!/^image\//.test(file.type||'')){ cb(null); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var raw=fr.result, img=new Image();
    img.onload=function(){
      try{
        var max=1280, w=img.width, h=img.height;
        if(w>max||h>max){ var s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var ctx=c.getContext('2d');
        if(!ctx){ cb({src:raw}); return; }
        ctx.drawImage(img,0,0,w,h);
        cb({src:c.toDataURL('image/jpeg',0.72)});
      }catch(e){ cb({src:raw}); }
    };
    img.onerror=function(){ cb(null); };
    img.src=raw;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

/* ---- Spotify 每日一歌（用官方 embed，唔需要登入） ---- */
var SPOT_KINDS=['track','album','playlist','artist','episode','show'];
function parseSpotify(input){
  var s=String(input||'').trim(); if(!s) return null;
  var m=s.match(/^spotify:([a-z]+):([A-Za-z0-9]+)$/);
  if(m && SPOT_KINDS.indexOf(m[1])>=0) return {type:m[1], id:m[2]};
  m=s.match(/open\.spotify\.com\/(?:embed\/)?(?:intl-[a-z-]+\/)?([a-z]+)\/([A-Za-z0-9]+)/i);
  if(m && SPOT_KINDS.indexOf(m[1].toLowerCase())>=0) return {type:m[1].toLowerCase(), id:m[2]};
  return null;
}
function spotifyOpenUrl(s){ return 'https://open.spotify.com/'+s.type+'/'+s.id; }
function spotifyLabel(t){
  return {track:'歌曲', album:'專輯', playlist:'播放清單', artist:'歌手', episode:'單集', show:'節目'}[t]||'音樂';
}

/* ---------- 歌手（「歌手統計」用） ----------
   一首歌嘅歌手名可能由幾個地方嚟，按可靠程度排先後：
     1. song.artist          —— 手動填，或者由 iTunes 自動填返（最可靠）
     2. song.preview.artist  —— iTunes Search 回傳嘅 artistName
     3. type === 'artist'    —— 貼嘅係「歌手」連結，oEmbed 個 title 本身就係歌手名
     4. 由「歌名／備註」拆     —— 只認前後都有空位嘅分隔符，
                                所以 "Jay-Z"、"AC/DC"、"blink-182" 唔會被拆爛
   四樣都冇 → 當「未知名稱」（唔亂估，寧願留空）。

   註：Spotify 嘅連結本身只有一個 track id，冇歌手名。
   官方 oEmbed（唯一有 CORS 嘅端點）只回曲名，冇 artist 欄位；
   embed 頁雖然有歌手名，但冇 Access-Control-Allow-Origin，瀏覽器讀唔到。
   所以實際路徑係：Spotify 連結 → oEmbed 拎到「準確曲名」→ iTunes 用曲名配對 → 歌手名。 */
var ART_SEP=/\s+[–—\-|｜·•]\s+/;
/* 配對用嘅正規化：去掉大小寫、括號內容、feat.、所有標點同空白 */
function songKey(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[（(\[][^)）\]]*[)）\]]/g,' ')
    .replace(/\b(?:feat|ft|with)\b\.?.*$/,' ')
    .replace(/[^0-9a-z\u4e00-\u9fff\u3040-\u30ff]+/g,'');
}
/* 嚴謹版：只去大小寫同多餘空白，括號保留（用嚟分辨 "X" 同 "X (Cover)"） */
function songKeyExact(s){
  return String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
}
function artistFromLabel(label, title){
  var s=String(label||'').trim(); if(!s) return '';
  var parts=s.split(ART_SEP);
  if(parts.length<2) return '';
  var a=parts[0].trim(), b=parts.slice(1).join(' ').trim();
  /* 有人會寫「歌名 – 歌手」（次序調轉）；頭一段其實就係歌名就改用尾嗰段 */
  if(b && title && songKey(a) && songKey(a)===songKey(title)) a=b;
  return (a.length>=2 && a.length<=60) ? a : '';
}
/* 1–3：唔使猜嘅來源（表單預填用呢個，唔會將「拆出嚟」嘅名當成用家填過） */
function songArtistAuto(song){
  if(!song) return '';
  var a=String(song.artist==null?'':song.artist).trim();
  if(a) return a;
  if(song.preview && song.preview.artist) return String(song.preview.artist).trim();
  if(song.type==='artist'){
    var t=String((song.meta && song.meta.title) || '').trim();
    if(t) return t;
  }
  return '';
}
function songArtist(song){
  if(!song) return '';
  return songArtistAuto(song) ||
    artistFromLabel(song.label, song.meta && song.meta.title);
}
/* 合併用嘅 key：忽略大小寫同多餘空白（"Taylor Swift" = "taylor  swift"） */
function artistKey(name){
  return String(name==null?'':name).trim().replace(/\s+/g,' ').toLowerCase();
}
/* 由一堆日記條目統計歌手：
     n     = 出現日數（一首歌一日，所以等於「聽咗幾多次」）
     songs = 唔同歌曲數
   同名會合併；顯示名取「出現最多」嗰個寫法（避免一時大寫一時細寫）。 */
function artistAgg(days){
  var cnt={}, order=[], variants={}, sset={}, songSet={}, unknown=0, total=0;
  (days||[]).forEach(function(d){
    if(!d || !d.song || !d.song.id) return;
    total++;
    var sk=(d.song.type||'track')+':'+d.song.id;
    songSet[sk]=1;
    var a=songArtist(d.song);
    var k=artistKey(a);
    if(!k){ unknown++; return; }
    if(!cnt[k]){ cnt[k]=0; order.push(k); variants[k]={}; sset[k]={}; }
    cnt[k]++;
    variants[k][a]=(variants[k][a]||0)+1;
    sset[k][sk]=1;
  });
  var list=order.map(function(k){
    var v=variants[k], best='', bn=-1;
    Object.keys(v).forEach(function(nm){ if(v[nm]>bn){ bn=v[nm]; best=nm; } });
    return { name:best, n:cnt[k], songs:Object.keys(sset[k]).length };
  }).sort(function(x,y){
    return y.n-x.n || (x.name<y.name ? -1 : (x.name>y.name ? 1 : 0));
  });
  return { list:list, total:total, unknown:unknown, artists:list.length,
           songs:Object.keys(songSet).length, top:list.length ? list[0] : null };
}
/* scope：'all' = 全部時間；'YYYY-MM' = 某個月 */
function diaryDaysIn(scope){
  var all=S.diary||[];
  if(!scope || scope==='all') return all.slice();
  return all.filter(function(d){ return mkOf(d.date)===scope; });
}
function artistStats(scope){ return artistAgg(diaryDaysIn(scope)); }
/* 用官方 oEmbed 拎封面 + 曲名（唔需要登入；已支援 CORS） */
var songMetaCache={};
function fetchSongMeta(song, cb){
  if(!song||!song.id){ cb(null); return; }
  var key=song.type+':'+song.id;
  if(songMetaCache[key]){ cb(songMetaCache[key]); return; }
  try{
    var x=new XMLHttpRequest();
    x.open('GET','https://open.spotify.com/oembed?url='+encodeURIComponent(spotifyOpenUrl(song)),true);
    x.timeout=9000;
    x.onload=function(){
      var meta=null;
      if(x.status>=200&&x.status<300){
        try{
          var j=JSON.parse(x.responseText);
          meta={ title:j.title||'', cover:j.thumbnail_url||'' };
        }catch(e){ meta=null; }
      }
      if(meta) songMetaCache[key]=meta;
      cb(meta);
    };
    x.onerror=function(){ cb(null); };
    x.ontimeout=function(){ cb(null); };
    x.send();
  }catch(e){ cb(null); }
}
/* 30 秒試聽 + 歌手名：iTunes Search API（免 key、CORS *）
   ─ 用「oEmbed 拎到嘅準確曲名」做主要搜尋詞（歌名／備註做次選）
   ─ 攞 5 個結果返嚟評分，唔再盲取第一個（減少「認錯歌手」）
   ─ 專輯連結用 entity=album（collectionName 配對，artistName 就係專輯歌手） */
var previewCache={};
/* 喺 iTunes 結果入面揀最似嘅一個：
     ・原字串一模一樣（連括號）→ 最高分（分辨原曲 vs "X (Cover)"）
     ・正規化後一樣 → 高分
     ・互相包含 → 中分
     ・有 30 秒試聽 / 有歌手名 → 各加少少（同分時優先）
   唔再盲取 results[0]，所以唔會隨便認錯歌手。 */
function pickItunes(list, want, wantRaw, isAlbum){
  var best=null, bestScore=-1;
  (list||[]).forEach(function(r){
    var nm = isAlbum ? r.collectionName : r.trackName;
    var k = songKey(nm), raw = songKeyExact(nm);
    var s = 0;
    if(raw && wantRaw && raw===wantRaw) s += 5;
    if(k && k===want) s += 6;
    else if(k && want && (k.indexOf(want)>=0 || want.indexOf(k)>=0)) s += 3;
    if(r.previewUrl) s += 2;
    if(r.artistName) s += 1;
    if(s>bestScore){ bestScore=s; best=r; }
  });
  return best;
}
function fetchSongPreview(song, cb){
  var isAlbum = !!(song && song.type==='album');
  var terms=[], mt='', lb='';
  if(song){
    mt=String((song.meta && song.meta.title) || '').trim();
    lb=String(song.label || '').trim();
  }
  if(mt) terms.push(mt);
  if(lb && songKey(lb)!==songKey(mt)) terms.push(lb);
  if(!terms.length){ cb(null); return; }
  var idx=0;
  (function next(){
    if(idx>=terms.length){ cb(null); return; }
    var q=terms[idx++];
    if(previewCache[q]!==undefined){
      if(previewCache[q]){ cb(previewCache[q]); return; }
      next(); return;
    }
    var done=false;
    function finish(out){
      if(done) return; done=true;
      previewCache[q]=out;
      if(out) cb(out); else next();
    }
    try{
      var x=new XMLHttpRequest();
      x.open('GET','https://itunes.apple.com/search?entity='+(isAlbum?'album':'song')+
        '&limit=5&term='+encodeURIComponent(q),true);
      x.timeout=9000;
      x.onload=function(){
        var out=null;
        if(x.status>=200&&x.status<300){
          try{
            var j=JSON.parse(x.responseText);
            var r=pickItunes(j.results||[], songKey(q), songKeyExact(q), isAlbum);
            /* 有結果就記住 artistName —— 就算冇 previewUrl（唔少歌都冇），
               歌手名一樣可以用嚟做統計。songHtml 只會喺有 url 時才出播放器。 */
            if(r) out={ url:r.previewUrl||'',
                        track:r.trackName || r.collectionName || '',
                        artist:r.artistName||'' };
          }catch(e){ out=null; }
        }
        finish(out);
      };
      x.onerror=function(){ finish(null); };
      x.ontimeout=function(){ finish(null); };
      x.send();
    }catch(e){ finish(null); }
  })();
}
function songHtml(song){
  if(!song||!song.id){
    return '<div class="dday-addsong"><button data-act="song">＋ 每日一歌（貼 Spotify 連結）</button></div>';
  }
  var meta=song.meta||{};
  var cover = meta.cover
    ? '<img class="cover" src="'+esc(meta.cover)+'" alt="" loading="lazy">'
    : '<span class="cover ph">COVER</span>';
  var title = meta.title || song.label || spotifyLabel(song.type);
  var sub = (song.label && song.label!==title) ? song.label : (spotifyLabel(song.type)+'　·　Spotify');
  /* 認到嘅歌手（用嚟做「歌手統計」）；認唔到就唔顯示，免得誤導 */
  var art = songArtist(song);
  var artHtml = art ? '<span class="sartist" title="歌手統計會計呢個名">歌手 · '+esc(art)+'</span>' : '';
  /* 30 秒試聽（iTunes 搜尋，免 key、有 CORS）→ 原生 audio */
  var prev='';
  if(song.preview && song.preview.url){
    var nm=[song.preview.artist, song.preview.track].filter(Boolean).join(' – ');
    prev='<div class="prevrow"><div class="pvhead"><span class="pvlbl">試聽 30 秒</span>'+
      (nm?'<span class="pvname">'+esc(nm)+'</span>':'')+'</div>'+
      '<audio controls preload="metadata" src="'+esc(song.preview.url)+'"></audio></div>';
  }
  return '<div class="dday-song">'+
    '<div class="shead"><b>每日一歌</b>'+
      '<span class="grow"></span>'+
      '<button data-act="song" title="更換歌曲">更換</button>'+
      '<button data-act="delsong" title="移除歌曲">✕</button>'+
    '</div>'+
    '<div class="srow">'+cover+
      '<div class="smeta"><b class="stitle">'+esc(title)+'</b>'+
        '<span class="ssub">'+esc(sub)+'</span>'+artHtml+'</div>'+
    '</div>'+
    prev+
    '<a class="open" href="'+spotifyOpenUrl(song)+'" target="_blank" rel="noopener">喺 Spotify 開啟全曲 ↗</a>'+
  '</div>';
}

function dayHtml(d){
  var dt=new Date(d.date+'T00:00:00'), ok=!isNaN(dt.getTime());
  var dLabel = ok ? (md(dt)+' <span>'+DOW[dow1(dt)-1]+'</span>') : esc(d.date);
  var ph=(d.photos||[]).map(function(p){
    return '<figure class="dphoto" data-pid="'+p.id+'">'+
      (p.src ? '<img src="'+p.src+'" alt="">' : '<img alt="" class="pending">')+
      '<button class="x" data-act="delphoto" title="刪除相片">✕</button></figure>';
  }).join('');
  var song=songHtml(d.song);
  var moodIc = (d.mood>=1 && d.mood<=5) ? ' <em class="dmood-ic">'+MOODS[d.mood-1]+'</em>' : '';
  return '<div class="dday" data-id="'+d.id+'">'+
    '<div class="dday-head">'+
      '<span class="dday-date">'+dLabel+moodIc+'</span>'+
      '<input type="date" class="dday-pick" value="'+d.date+'">'+
      '<span class="grow"></span>'+
      '<button data-act="addphoto">＋ 相片</button>'+
      '<button class="del" data-act="delday">刪除</button>'+
    '</div>'+
    moodRow(d)+
    song+
    '<textarea class="dday-note" placeholder="打少少 caption…（今日做咗咩）">'+esc(d.note||'')+'</textarea>'+
    (ph ? '<div class="dday-photos">'+ph+'</div>'
        : '<div class="dday-empty">仲未有相片，撳「＋ 相片」加入，或者直接貼上／拖入相片</div>')+
  '</div>';
}
function bindDiaryPhotos(scope){
  var figs=scope.querySelectorAll('.dphoto');
  Array.prototype.forEach.call(figs,function(fig){
    var img=fig.querySelector('img.pending'); if(!img) return;
    idbGet(fig.dataset.pid,function(rec){
      if(rec && rec.src){ img.src=rec.src; img.classList.remove('pending'); }
      else { fig.classList.add('missing'); }
    });
  });
}
/* 未拎過封面／試聽嘅歌 → 抓一次（先 oEmbed 再 iTunes），完成後更新該日嘅歌曲區塊 */
function bindDiarySongs(scope){
  Array.prototype.forEach.call(scope.querySelectorAll('.dday'),function(el){
    var d=findDay(el.dataset.id); if(!d||!d.song||!d.song.id) return;
    if(d.song.meta && d.song.preview!==undefined) return;
    function rerender(){
      var cur=document.querySelector('#diaryBody .dday[data-id="'+d.id+'"] .dday-song');
      if(cur) cur.outerHTML=songHtml(d.song);
      drawArtStat();   /* 認到歌手之後，統計卡即刻跟住更新 */
    }
    function fetchPreview(){
      if(d.song.preview!==undefined){ save(); rerender(); return; }
      fetchSongPreview(d.song,function(p){
        d.song.preview=p;
        /* 「歌曲」同「專輯」連結先信 iTunes 嘅 artistName：
           歌曲用曲名搜、專輯用 entity=album 搜，兩者都對得上。
           播放清單／節目係好多歌手夾埋，夾到嘅 artistName 同本身冇關係，所以唔填。
           已經有歌手名（手動填）就唔覆蓋。 */
        var ty=d.song.type||'track';
        if(p && p.artist && !d.song.artist && (ty==='track' || ty==='album'))
          d.song.artist=p.artist;
        save(); rerender();
      });
    }
    if(d.song.meta){ fetchPreview(); return; }
    fetchSongMeta(d.song,function(m){
      d.song.meta = m || {title:'',cover:''};   /* 失敗都記住，避免無限重試 */
      fetchPreview();
    });
  });
}
/* ================= 每月總結（自動生成） ================= */
var MSEL=null;                                  /* 睇緊邊個月：'YYYY-MM' */
function mkOf(ds){ return String(ds||'').slice(0,7); }
function mkNow(){ return todayStr().slice(0,7); }
function mkLabel(mk){
  return mk.slice(0,4)+' 年 '+parseInt(mk.slice(5,7),10)+' 月';
}
/* 該月所有日子 'YYYY-MM-DD' */
function mkDays(mk){
  var y=+mk.slice(0,4), m=+mk.slice(5,7);
  var n=new Date(y,m,0).getDate(), out=[];
  for(var i=1;i<=n;i++) out.push(mk+'-'+p2(i));
  return out;
}
function mkAdd(mk,n){
  var d=new Date(+mk.slice(0,4), +mk.slice(5,7)-1+n, 1);
  return d.getFullYear()+'-'+p2(d.getMonth()+1);
}
/* 有資料嘅月份（日記／非溫書記錄／溫書時數） */
function diaryMonths(){
  var set={}, out=[];
  function add(k){ if(k && /^\d{4}-\d{2}$/.test(k) && !set[k]){ set[k]=1; out.push(k); } }
  (S.diary||[]).forEach(function(d){ add(mkOf(d.date)); });
  (S.acts||[]).forEach(function(x){ add(mkOf(x.d)); });
  Object.keys(S.studyLog||{}).forEach(function(k){ add(mkOf(k)); });
  (S.studySessions||[]).forEach(function(x){ add(mkOf(x.d)); });
  out.sort();
  return out;
}
/* 可以行到嘅範圍（一定包住今個月，唔會行到冇意思嘅月份） */
function mkBounds(){
  var ms=diaryMonths(); ms.push(mkNow()); ms.sort();
  return { lo:ms[0], hi:ms[ms.length-1] };
}
function mkDefault(){
  var ms=diaryMonths(), now=mkNow();
  if(ms.indexOf(now)>=0) return now;
  var prev=null;
  ms.forEach(function(k){ if(k<now) prev=k; });
  return prev || (ms.length ? ms[ms.length-1] : now);
}
/* 心情 1–5 嘅顏色（低 → 高） */
var MOOD_BAR=['#e5484d','#e08a3c','#c9a227','#5aa06a','#1d9e75'];
/* 常見虛詞，唔想當成關鍵字 */
var KW_STOP={'今日':1,'昨天':1,'明天':1,'我哋':1,'佢哋':1,'自己':1,'之後':1,'而家':1,
  '因為':1,'所以':1,'但是':1,'不過':1,'然後':1,'一樣':1,'一個':1,'一下':1,'咁樣':1,
  '好似':1,'唔知':1,'唔係':1,'唔好':1,'覺得':1,'時間':1,'可以':1,'已經':1,'仲有':1,
  '都係':1,'好多':1,'終於':1,'其實':1,'或者':1,'如果':1,'呢個':1,'嗰個':1,'就是':1,
  'the':1,'and':1,'for':1,'with':1,'that':1,'this':1,'you':1,'was':1,'are':1,'had':1};
/* 由日記文字抽出成日提到嘅詞（中文用 2 字組合、英文用原字，至少出現 2 次） */
function topKeywords(text, n){
  var cnt={}, order=[];
  function bump(k){
    if(KW_STOP[k] || k.length<2) return;
    if(!cnt[k]){ cnt[k]=0; order.push(k); }
    cnt[k]++;
  }
  (String(text).match(/[\u4e00-\u9fff]+/g)||[]).forEach(function(r){
    for(var i=0;i+2<=r.length;i++) bump(r.substr(i,2));
  });
  (String(text).toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(bump);
  return order.map(function(k){ return {k:k, n:cnt[k]}; })
    .filter(function(x){ return x.n>=2; })
    .sort(function(a,b){ return b.n-a.n || (a.k<b.k?-1:1); })
    .slice(0,n);
}
/* 統計一個月：日記 + 心情 + 相片 + 歌 + 溫書 + 非溫書 */
function summarizeMonth(mk){
  var days=mkDays(mk), i, ds, d, j;
  var z={ mk:mk, total:days.length, days:0, noteDays:0, ph:0, songs:0, words:0,
          moods:0, moodAvg:null, dist:[0,0,0,0,0], best:null, worst:null,
          stMin:0, stDays:0, actM:0, actN:0, kws:[] };
  var textAll='', moodList=[];
  for(i=0;i<days.length;i++){
    ds=days[i];
    d=null;
    for(j=0;j<(S.diary||[]).length;j++) if(S.diary[j].date===ds){ d=S.diary[j]; break; }
    if(d){
      z.days++;
      z.ph += (d.photos||[]).length;
      if(d.song && d.song.id) z.songs++;
      var note=String(d.note||'').trim();
      if(note){ z.noteDays++; z.words += note.replace(/\s+/g,'').length; textAll += note+' '; }
      if(d.mood>=1 && d.mood<=5){
        z.moods++; z.dist[d.mood-1]++;
        moodList.push({ds:ds, v:d.mood});
        if(!z.best || d.mood>z.best.v) z.best={ds:ds, v:d.mood};
        if(!z.worst || d.mood<z.worst.v) z.worst={ds:ds, v:d.mood};
      }
    }
    var sm=logMin(ds);
    if(sm>0){ z.stMin+=sm; z.stDays++; }
    var am=actMin(ds);
    if(am>0){ z.actM+=am; }
    z.actN += actsOn(ds).length;
  }
  if(z.moods){
    var sum=0; moodList.forEach(function(x){ sum+=x.v; });
    z.moodAvg=sum/z.moods;
  }
  z.moodList=moodList;
  z.kws=topKeywords(textAll, 6);
  z.art=artistStats(mk);          /* 歌手統計（見 songArtist / artistAgg） */
  return z;
}
/* 一句自動生成嘅總結文字 */
function summarySentence(z){
  if(!z.days && !z.stMin && !z.actM) return '';
  var m=parseInt(z.mk.slice(5,7),10), s=[];
  s.push(m+' 月你記錄咗 '+z.days+' 日'+(z.days<z.total?('（成個月共 '+z.total+' 日）'):'')+'。');
  if(z.moodAvg!==null){
    var li=Math.min(4,Math.max(0,Math.round(z.moodAvg)-1));
    s.push('寫低咗 '+z.moods+' 日心情，平均 '+z.moodAvg.toFixed(1)+'／5，'+MOOD_LBL[li]+'。');
  }
  if(z.ph) s.push('相簿有 '+z.ph+' 張相'+(z.songs?('，揀咗 '+z.songs+' 首歌'):'')+'。');
  else if(z.songs) s.push('揀咗 '+z.songs+' 首歌。');
  if(z.art && z.art.top){
    s.push('聽得最多係 '+z.art.top.name+'（'+z.art.top.n+' 日'+
      (z.art.artists>1?('，成個月共 '+z.art.artists+' 位歌手'):'')+'）。');
  }
  if(z.noteDays) s.push('有 '+z.noteDays+' 日寫咗字，加埋 '+z.words+' 個字。');
  if(z.stMin) s.push('今個月溫書 '+hTxt(z.stMin)+' 小時'+
    (z.actM?('，另外 '+hTxt(z.actM)+' 小時做咗其他嘢'):'')+'。');
  else if(z.actM) s.push('今個月有 '+hTxt(z.actM)+' 小時記錄咗做其他嘢。');
  if(z.kws.length) s.push('成日提到「'+
    z.kws.slice(0,3).map(function(k){ return k.k; }).join('」「')+'」。');
  if(z.best && z.worst && z.best.v!==z.worst.v)
    s.push('心情最好係 '+md(new Date(z.best.ds+'T00:00:00'))+'，最低係 '+
           md(new Date(z.worst.ds+'T00:00:00'))+'。');
  else if(z.best) s.push('心情最好係 '+md(new Date(z.best.ds+'T00:00:00'))+'。');
  return s.join('');
}
/* 心情走勢：每日一條柱，高 = 心情好 */
function moodSpark(mk, moodList){
  var all=mkDays(mk), map={};
  moodList.forEach(function(x){ map[x.ds]=x.v; });
  var n=all.length, W=320, H=46, gap=2;
  var bw=Math.max(2,(W-(n-1)*gap)/n), bars='';
  for(var i=0;i<n;i++){
    var v=map[all[i]]; if(!v) continue;
    var h=(v/5)*(H-8), x=i*(bw+gap);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(H-h-2).toFixed(1)+'" width="'+bw.toFixed(1)+
          '" height="'+h.toFixed(1)+'" rx="1.5" fill="'+MOOD_BAR[v-1]+'"/>';
  }
  if(!bars) return '';
  return '<svg class="ms-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
         'aria-hidden="true"><line x1="0" y1="'+(H-2)+'" x2="'+W+'" y2="'+(H-2)+
         '" stroke="#e3e8f1" stroke-width="1"/>'+bars+'</svg>';
}
/* 純文字版總結（複製用） */
function summaryText(mk){
  var z=summarizeMonth(mk), L=[];
  L.push('【'+mkLabel(mk)+'】日記總結');
  L.push(summarySentence(z));
  if(z.moodAvg!==null){
    L.push('心情分佈：'+MOOD_LBL.map(function(l,i){
      return l+' '+z.dist[i];
    }).join('　'));
  }
  if(z.kws.length) L.push('成日提到：'+
    z.kws.map(function(k){ return k.k+'×'+k.n; }).join('、'));
  if(z.art && z.art.list.length) L.push('歌手：'+
    z.art.list.slice(0,5).map(function(x){ return x.name+'×'+x.n; }).join('、')+
    (z.art.artists>5?('　（共 '+z.art.artists+' 位）'):''));
  if(z.stMin) L.push('溫書：'+hTxt(z.stMin)+' 小時（'+z.stDays+' 日）');
  if(z.actM) L.push('非溫書：'+hTxt(z.actM)+' 小時（'+z.actN+' 段）');
  return L.filter(function(x){ return x; }).join('\n');
}
function msumCard(k, v, sub){
  return '<div class="ms-card"><span class="ms-k">'+k+'</span>'+
    '<b class="ms-v">'+v+'</b>'+(sub?'<i class="ms-s">'+sub+'</i>':'')+'</div>';
}
function drawMsum(){
  var el=document.getElementById('msum'); if(!el) return;
  if(!MSEL) MSEL=mkDefault();
  var b=mkBounds();
  if(MSEL<b.lo) MSEL=b.lo;
  if(MSEL>b.hi) MSEL=b.hi;
  var mk=MSEL, z=summarizeMonth(mk);
  /* 完全冇任何資料（全新用家）就唔顯示，免得同下面嘅空狀態重複 */
  if(!z.days && !z.stMin && !z.actM && !diaryMonths().length){
    el.hidden=true; el.innerHTML=''; return;
  }
  el.hidden=false;

  var h='<div class="ms-head"><span class="ms-lbl">每月總結</span>'+
    '<span class="ms-nav">'+
      '<button class="ms-ar" id="msPrev" aria-label="上個月"'+(mk<=b.lo?' disabled':'')+'>‹</button>'+
      '<b class="ms-mk">'+mkLabel(mk)+'</b>'+
      '<button class="ms-ar" id="msNext" aria-label="下個月"'+(mk>=b.hi?' disabled':'')+'>›</button>'+
    '</span>'+
    '<button class="btn ms-copy" id="msCopy">複製總結</button>'+
    '<span class="ms-toast" id="msToast" hidden></span></div>';

  if(!z.days && !z.stMin && !z.actM){
    el.innerHTML=h+'<div class="ms-empty">'+mkLabel(mk)+
      '未有記錄。寫咗日記、或者用過「溫書計時」／「記錄做過咩」，呢度就會自動有總結。</div>';
    bindMsum();
    return;
  }

  h+='<div class="ms-sum">'+esc(summarySentence(z))+'</div>';

  var moodV = z.moodAvg!==null
    ? (MOODS[Math.min(4,Math.max(0,Math.round(z.moodAvg)-1))]+' '+z.moodAvg.toFixed(1))
    : '—';
  h+='<div class="ms-grid">'+
    msumCard('記錄', z.days+' 日', '共 '+z.total+' 日'+(z.noteDays?(' · 寫字 '+z.noteDays+' 日'):''))+
    msumCard('心情', moodV, z.moods?('有評 '+z.moods+' 日'):'未評過')+
    msumCard('相片', z.ph+' 張', z.songs?('每日一歌 '+z.songs+' 首'):'')+
    msumCard('溫書', hTxt(z.stMin)+' 小時', z.actM?('非溫書 '+hTxt(z.actM)+' 小時'):(z.stDays?('有溫 '+z.stDays+' 日'):''))+
    '</div>';

  var sp=moodSpark(mk, z.moodList);
  if(sp) h+='<div class="ms-sparkwrap">'+sp+'<span class="ms-sparkcap">心情走勢（每日一條，越高越好）</span></div>';

  if(z.kws.length){
    h+='<div class="ms-kw"><span class="ms-kwl">成日提到</span>'+
      z.kws.map(function(k){ return '<span class="ms-chip">'+esc(k.k)+'<i>'+k.n+'</i></span>'; }).join('')+
      '</div>';
  }
  if(z.art && z.art.list.length){
    h+='<div class="ms-kw"><span class="ms-kwl">歌手</span>'+
      z.art.list.slice(0,6).map(function(x){
        return '<span class="ms-chip">'+esc(x.name)+'<i>'+x.n+'</i></span>';
      }).join('')+
      (z.art.artists>6?('<span class="ms-kwl">另 '+(z.art.artists-6)+' 位</span>'):'')+
      '</div>';
  }
  if(z.best && z.worst && z.best.v!==z.worst.v){
    h+='<div class="ms-hi">心情最好 <b>'+md(new Date(z.best.ds+'T00:00:00'))+' '+MOODS[z.best.v-1]+
       '</b>　·　最低 <b>'+md(new Date(z.worst.ds+'T00:00:00'))+' '+MOODS[z.worst.v-1]+'</b></div>';
  }
  el.innerHTML=h;
  bindMsum();
}
function bindMsum(){
  var p=document.getElementById('msPrev'), n=document.getElementById('msNext');
  if(p) p.addEventListener('click',function(){ MSEL=mkAdd(MSEL,-1); drawMsum(); drawArtStat(); });
  if(n) n.addEventListener('click',function(){ MSEL=mkAdd(MSEL,1); drawMsum(); drawArtStat(); });
  var c=document.getElementById('msCopy');
  if(c) c.addEventListener('click',function(){
    copyText(summaryText(MSEL), function(ok){
      var t=document.getElementById('msToast'); if(!t) return;
      t.hidden=false; t.textContent=ok?'已複製總結':'複製唔到，請長按選取';
      t.className='ms-toast'+(ok?' ok':' bad');
      setTimeout(function(){ t.hidden=true; },2200);
    });
  });
}
function copyText(t, cb){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ cb(true); },
        function(){ cb(fallbackCopy(t)); });
      return;
    }
  }catch(e){}
  cb(fallbackCopy(t));
}
function fallbackCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    if(ta.setSelectionRange) ta.setSelectionRange(0,t.length);
    var ok=false;
    try{
      if(typeof document.execCommand==='function') ok=document.execCommand('copy');
    }catch(e2){ ok=false; }
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}

/* 由 File 陣列加入相片（file input / 貼上 / 拖入共用） */
function addPhotosToDay(id, files){
  var d=findDay(id); if(!d) return;
  if(!d.photos) d.photos=[];
  var arr=Array.prototype.slice.call(files), i=0;
  (function next(){
    if(i>=arr.length){ save(); drawDiary(); return; }
    shrinkImage(arr[i++], function(res){
      if(!res){ next(); return; }
      var pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      if(idbReady){
        idbPut({id:pid, src:res.src}, function(ok){
          /* 寫入成功 → 只記 id；失敗 → 退回內嵌（容量有限但唔會唔見） */
          if(ok) d.photos.push({id:pid}); else d.photos.push({id:pid, src:res.src});
          next();
        });
      } else { d.photos.push({id:pid, src:res.src}); next(); }
    });
  })();
}
/* 剪貼簿／拖放抽出圖片檔 */
function imageFilesFromDataTransfer(dt){
  var out=[];
  if(!dt) return out;
  if(dt.items && dt.items.length){
    for(var i=0;i<dt.items.length;i++){
      var it=dt.items[i];
      if(it.kind==='file' && /^image\//.test(it.type||'')){
        var f=it.getAsFile && it.getAsFile();
        if(f) out.push(f);
      }
    }
  }
  if(!out.length && dt.files && dt.files.length){
    for(var j=0;j<dt.files.length;j++){
      if(/^image\//.test(dt.files[j].type||'')) out.push(dt.files[j]);
    }
  }
  return out;
}

function closeModal(){
  /* ⚠ 一定要「先 blur、後 hidden」。如果反過來（先將祖先設 hidden 再 blur），
     部分環境（包括 jsdom）嘅 blur() 會靜靜哋唔生效，focus 就永遠留喺嗰個
     已經睇唔到嘅輸入框上；之後打字會被「打字中」保護規則擋住，令全域快捷鍵
     （例如 ? / N / L / D）全部失效。 */
  var ae=document.activeElement;
  if(ae && ae!==document.body && modal.contains(ae)){ try{ ae.blur(); }catch(e){} }
  modal.hidden=true; modal.removeAttribute('data-mode');
}

/* ---------- 全域鍵盤快捷鍵 ----------
   規則：
   1. 打字中（input / textarea / contenteditable）一律唔搶鍵，除咗 Escape。
   2. 有彈窗／抽屜開住嗰陣，只准 Escape 同「?」，唔好偷偷轉頁。
   3. 用 e.key 而唔係 keyCode；數字用 1–7 對應 VIEW_ORDER。
   4. 有修飾鍵（Ctrl / Cmd / Alt）一律唔理，唔好搶瀏覽器嘅快捷鍵。 */
var KEYMAP = [
  ['1','週視圖','view:week'],
  ['2','月總覽','view:month'],
  ['3','待辦','view:todo'],
  ['4','倒數','view:countdown'],
  ['5','成績','view:grade'],
  ['6','GPA','view:gpa'],
  ['7','日記','view:diary'],
  ['←','上一週','prev'],
  ['→','下一週','next'],
  ['T','回到本週','today'],
  ['/','搜尋','search'],
  ['N','新增項目','add'],
  ['L','項目清單','list'],
  ['D','切換深／淺色','theme'],
  ['?','快捷鍵說明','help'],
  ['Esc','關閉彈窗','close']
];
function anyModalOpen(){
  var m=document.getElementById('modal'), k=document.getElementById('mask');
  return (m && !m.hidden) || (k && !k.hidden);
}
function keyRun(act){
  if(act.indexOf('view:')===0){ setView(act.slice(5)); return true; }
  var el;
  if(act==='prev'){ el=document.getElementById('prev'); }
  else if(act==='next'){ el=document.getElementById('next'); }
  else if(act==='today'){ el=document.getElementById('today'); }
  else if(act==='search'){ searchForm(); return true; }
  else if(act==='add'){ newChooser(); return true; }
  else if(act==='list'){ drawList(); document.getElementById('mask').hidden=false; return true; }
  else if(act==='theme'){
    var cur=S.theme||'auto';
    setTheme(cur==='dark'?'light':'dark'); return true;
  }
  else if(act==='help'){ keyHelp(); return true; }
  else if(act==='close'){ closeModal(); document.getElementById('mask').hidden=true; return true; }
  if(el){ el.click(); return true; }
  return false;
}
function keyHelp(){
  dlg.innerHTML='<h3>鍵盤快捷鍵</h3><div class="bd">'+
    '<div class="keytbl">'+
      KEYMAP.map(function(k){
        var keyHtml = k[0]==='←'?'←':k[0]==='→'?'→':k[0]==='Esc'?'Esc':k[0];
        return '<div class="keyrow"><kbd>'+esc(keyHtml)+'</kbd><span>'+esc(k[1])+'</span></div>';
      }).join('')+
    '</div>'+
    '<div class="bkinfo" style="margin-top:10px">'+
      '打字中（例如改待辦內容、日記）快捷鍵會自動讓路，唔會打亂你輸入嘅字。<br>'+
      '<b>←</b> 同 <b>→</b> 亦可以喺內容區<b>左右滑動</b>代替（可在設定閂掉）。'+
    '</div>'+
    '</div><div class="ft"><button class="btn pri" id="khClose">明白</button></div>';
  modal.hidden=false;
  document.getElementById('khClose').addEventListener('click',closeModal);
}
document.addEventListener('keydown',function(e){
  /* Escape 任何時候都要可以閂窗 */
  if(e.key==='Escape'){ closeModal(); document.getElementById('mask').hidden=true; return; }
  /* 有修飾鍵就唔好搶（Ctrl+N、Cmd+L… 留返俾瀏覽器） */
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var ae=document.activeElement||{};
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName||'')||!!ae.isContentEditable;
  if(typing){
    /* 打字中：只留 Escape 同「?」；其餘一律唔理 */
    if(e.key==='?' && !ae.isContentEditable){ /* 打字中就真係想打個問號 */ return; }
    return;
  }
  if(anyModalOpen()){
    /* 彈窗開住：只准「?」開說明，唔好偷偷轉頁 */
    if(e.key==='?'){ e.preventDefault(); keyHelp(); }
    return;
  }
  var map={'1':'view:week','2':'view:month','3':'view:todo','4':'view:countdown',
           '5':'view:grade','6':'view:gpa','7':'view:diary',
           'ArrowLeft':'prev','ArrowRight':'next','/':'search','?':'help',
           'n':'add','N':'add','l':'list','L':'list','d':'theme','D':'theme'};
  var act=null;
  if(map[e.key]) act=map[e.key];
  else if((e.key==='t'||e.key==='T')) act='today';
  if(!act) return;
  /* 用 ←/→ 嗰陣唔好連捲軸都郁 */
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='/') e.preventDefault();
  keyRun(act);
});

/* ---------- 自訂科目外觀（顏色 + 圖示） ---------- */
/* 只存「用戶改過嘅嘢」，冇改過嘅科目完全唔會入 subjectPref，
   所以舊資料零影響，刪走一科嘅偏好亦唔會影響課表本身。 */
var ICON_CHOICES = ['','📐','📊','💻','🧪','📖','✏️','🎨','🎵','🌏','⚖️','🧠','🔬','📝','🏛️','💡','🧮','🩺','🏗️','🗣️'];
function prefKey(code){ return normCode(code); }
function subjectPrefOf(code){
  var k=prefKey(code), p=S.subjectPref ? S.subjectPref[k] : null;
  return (p&&typeof p==='object') ? p : {};
}
/* 有效顏色：用戶自訂 > 課堂原本設定 > 預設
   ⚠ fallback 本身都要驗證：課堂嘅 color 可能係 PAL 冇嘅名，
     唔驗證就會令呼叫方 PAL[evColor(e)] 拎到 undefined 而爆。 */
function effColor(code, fallback){
  var p=subjectPrefOf(code);
  if(p.color && PAL[p.color]) return p.color;
  if(fallback && PAL[fallback]) return fallback;
  return 'blue';
}
function effIcon(code){
  var p=subjectPrefOf(code);
  return (typeof p.icon==='string') ? p.icon : '';
}
function setSubjectPref(code, patch){
  var k=prefKey(code); if(!k) return;
  if(!S.subjectPref || typeof S.subjectPref!=='object') S.subjectPref={};
  var cur=subjectPrefOf(code), next=Object.assign({},cur,patch);
  /* 清走空值，唔好留垃圾 */
  if(!next.color) delete next.color;
  if(!next.icon) delete next.icon;
  if(!Object.keys(next).length) delete S.subjectPref[k];
  else S.subjectPref[k]=next;
}
/* 圖示 chip：有圖示就喺代號前面加一個 span */
function iconHtml(code){
  var ic=effIcon(code);
  return ic ? '<i class="subjic">'+esc(ic)+'</i>' : '';
}
/* 用邊個 code 去查偏好？事件有 code，課堂有 code，兩者一樣 */
function evColor(e){
  if(!e) return 'blue';
  if(e.kind==='session') return e.color||'teal';
  if(e.kind==='act') return e.color||'gray';
  return effColor(e.code, e.color);
}

function swatchHtml(sel){
  var h='<div class="sws">';
  Object.keys(PAL).forEach(function(k){
    h+='<button type="button" data-c="'+k+'" class="'+(k===sel?'on':'')+
       '" style="background:'+PAL[k].bg+';border-color:'+PAL[k].bd+'" title="'+PAL[k].name+'"></button>';
  });
  return h+'</div>';
}
function bindSwatch(root,initial){
  var cur=initial, bs=root.querySelectorAll('.sws button');
  function paint(){
    for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].dataset.c===cur);
  }
  for(var i=0;i<bs.length;i++){ (function(b){
    b.addEventListener('click',function(){ cur=b.dataset.c; paint(); });
  })(bs[i]); }
  paint();
  return { get:function(){ return cur; }, set:function(c){ cur=c; paint(); } };
}

/* ================= 重繪 ================= */
function refreshAll(){
  /* 只畫「現時見到嘅」檢視 —— 其餘嘅等 setView() 切過去先畫。
     以前啟動時一次過畫齊 7 個（隱藏嗰啲根本冇人睇），白白拖慢開 App。
     所有 draw 函式都唔讀版面尺寸，所以延後畫完全冇副作用。 */
  renderView(S.view);
  drawList();
  var sel=document.getElementById('jump'); if(sel) sel.value=S.weekIdx;
  var ts=document.getElementById('termSel'); if(ts) ts.value=String(S.termIdx);
  drawSubttl();

/* 檢視次序：同工具列由左至右一致，左右滑動就照呢個次序行 */
var VIEW_ORDER=['week','month','todo','countdown','grade','gpa','diary'];
var VIEW_CARD={week:'weekCard',month:'monthCard',todo:'todoCard',countdown:'cdCard',
               grade:'gradeCard',gpa:'gpaCard',diary:'diaryCard'};
var VIEW_BTN={week:'vWeek',month:'vMonth',todo:'vTodo',countdown:'vCd',
              grade:'vGrade',gpa:'vGpa',diary:'vDiary'};

/* 畫一個檢視。呼叫時張卡可以係 hidden —— 所有 draw 函式都唔會讀版面尺寸，
   所以「先畫好、後顯示」係安全嘅，而且只會觸發一次 layout。 */
function renderView(v){
  if(v==='week') drawWeek();
  else if(v==='month') drawMonths();
  else if(v==='todo') drawTodo();
  else if(v==='countdown') drawCountdown();
  else if(v==='gpa') drawGpa();
  else if(v==='diary') drawDiary();
  else drawGrades();
}

/* 滑入動畫：dir>0 = 睇下一個（由右邊入），dir<0 = 睇上一個（由左邊入）
   用 Web Animations API 而唔係加 CSS class —— 唔使 void offsetWidth 強制重排，
   而且 transform／opacity 動畫會交由合成器（compositor）行，主執行緒塞車都唔會掉格。 */
var SW_ANIM=null, SW_ANIM_EL=null;
function swipeAnim(cardId,dir){
  var el=document.getElementById(cardId); if(!el) return;
  if(SW_ANIM && SW_ANIM_EL!==el){ try{ SW_ANIM.cancel(); }catch(e){} SW_ANIM=null; }
  var dx = dir>0 ? 34 : -34;

  if(el.animate){
    try{ if(SW_ANIM) SW_ANIM.cancel(); }catch(e){}
    el.classList.add('swiping');                 /* will-change：提佢上獨立合成層 */
    SW_ANIM = el.animate(
      [ { opacity:0.35, transform:'translate3d('+dx+'px,0,0)' },
        { opacity:1,    transform:'translate3d(0,0,0)' } ],
      { duration:240, easing:'cubic-bezier(.22,.61,.36,1)', fill:'none' }
    );
    SW_ANIM_EL = el;
    var done=function(){
      if(SW_ANIM_EL===el) SW_ANIM=null;
      clearTimeout(el.__swT);
      el.__swT=setTimeout(function(){ el.classList.remove('swiping'); },120);
    };
    try{ SW_ANIM.onfinish=done; SW_ANIM.oncancel=done; }
    catch(e){ setTimeout(done,260); }
    return;
  }

  /* 後備：唔支援 WAAPI 嘅舊瀏覽器，用返 CSS class + 強制 reflow */
  el.classList.remove('swin-next','swin-prev');
  void el.offsetWidth;
  el.classList.add(dir>0?'swin-next':'swin-prev');
  clearTimeout(el.__swT);
  el.__swT=setTimeout(function(){ el.classList.remove('swin-next','swin-prev'); },600);
}

function setView(v,dir){
  S.view=v;
  /* 1) 先畫好目標檢視 —— 佢而家仲係 hidden，唔會觸發 layout */
  renderView(v);
  /* 2) 再一次過切換可見性（連同工具列按鈕） */
  VIEW_ORDER.forEach(function(k){
    var c=document.getElementById(VIEW_CARD[k]); if(c) c.hidden=(k!==v);
    var b=document.getElementById(VIEW_BTN[k]); if(b) b.classList.toggle('on',k===v);
  });
  /* 3) 最後才落動畫 */
  if(dir) swipeAnim(VIEW_CARD[v],dir);
  save();
}

/* ================= 左右滑動切換檢視 ================= */
var SW={ on:false, x:0, y:0, t:0, axis:0 };
var SW_MIN=60;     /* 橫向要滑夠 60px 才當一次切換 */
var SW_YMAX=55;    /* 終點縱向偏移大過呢個數就當捲動，唔切換 */
var SW_TMAX=700;   /* 慢過 0.7 秒唔算（多數係拖曳選字） */
var SW_RATIO=1.6;  /* 橫向位移要係縱向嘅 1.6 倍以上 */
var SW_EDGE=26;    /* 貼住螢幕邊 26px 唔掂，讓返 Safari 嘅上一頁手勢 */

function swipeOn(){ return S.swipe!==false; }

/* 呢啲位唔應該觸發切換 */
function swipeBlocked(target){
  if(!target || target.nodeType!==1) return true;
  /* 有浮層開住（抽屜／對話框／相片燈箱）就完全唔理 */
  if(document.querySelector('.mask:not([hidden]),.modal:not([hidden])')) return true;
  var el=target, n=0;
  while(el && el.nodeType===1 && el!==document.body && n++<12){
    var tag=(el.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return true;
    if(el.isContentEditable) return true;
    var cls=el.classList;
    if(cls && (cls.contains('bar')||cls.contains('seg')||cls.contains('drawer'))) return true;
    if(el.scrollWidth-el.clientWidth>4){
      var st=window.getComputedStyle?window.getComputedStyle(el):null;
      if(st && (st.overflowX==='auto'||st.overflowX==='scroll')) return true;
    }
    el=el.parentElement;
  }
  return false;
}

/* step=+1 睇下一個，-1 睇上一個；到頭就唔動 */
function swipeStep(step){
  var i=VIEW_ORDER.indexOf(S.view); if(i<0) i=0;
  var n=i+step;
  if(n<0||n>=VIEW_ORDER.length) return false;
  setView(VIEW_ORDER[n],step);
  return true;
}

document.addEventListener('touchstart',function(e){
  SW.on=false; SW.axis=0;
  if(!swipeOn() || e.touches.length!==1) return;
  var t=e.touches[0];
  if(t.clientX<SW_EDGE || t.clientX>window.innerWidth-SW_EDGE) return;
  if(swipeBlocked(e.target)) return;
  SW.on=true; SW.x=t.clientX; SW.y=t.clientY; SW.t=Date.now();
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(!SW.on || e.touches.length!==1) return;
  var t=e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(!SW.axis){
    if(Math.abs(dx)<12 && Math.abs(dy)<12) return;      /* 未夠明顯，再等 */
    SW.axis = Math.abs(dx) > Math.abs(dy)*SW_RATIO ? 1 : -1;
  }
  /* 確定係橫向之後，食住呢個 touchmove，唔畀瀏覽器當成橫向拖動 */
  if(SW.axis===1 && e.cancelable) e.preventDefault();
},{passive:false});

document.addEventListener('touchend',function(e){
  if(!SW.on) return;
  SW.on=false;
  if(SW.axis!==1) return;
  var t=e.changedTouches && e.changedTouches[0]; if(!t) return;
  var dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(Date.now()-SW.t>SW_TMAX) return;
  if(Math.abs(dy)>SW_YMAX) return;
  if(Math.abs(dx)<SW_MIN) return;
  if(Math.abs(dx) < Math.abs(dy)*SW_RATIO) return;
  swipeStep(dx<0?1:-1);        /* 手指向左 = 睇右邊嗰個（下一個） */
},{passive:true});

document.addEventListener('touchcancel',function(){ SW.on=false; SW.axis=0; },{passive:true});

/* 切換學期：校正 TERM／WEEKS，重建週次選單，再決定停喺第幾週 */
function switchTerm(i){
  if(!S.terms || i<0 || i>=S.terms.length) return;
  S.termIdx=i;
  syncTerm();
  buildJump();
  var t=todayStr();
  if(t>=ymd(TERM) && t<=ymd(addD(TERM,WEEKS*7-1))){
    S.weekIdx=Math.max(0,Math.min(WEEKS-1,Math.round((mon(new Date())-TERM)/(7*864e5))));
  } else {
    S.weekIdx=0;
  }
  save(); refreshAll();
}

  else {
    var last=S.terms[S.terms.length-1];
    var st=last ? ymd(addD(termRange(last).e,1)) : normTermStart(todayStr());
    def={ name:(+st.slice(0,4))+' 春季', start:st, weeks:14 };
  }
  box.innerHTML=
    '<div class="tmfttl">'+(t?'修改學期':'新增學期')+'</div>'+
    '<div class="tmfld"><label>學期名稱</label>'+
      '<input id="tmName" maxlength="24" placeholder="例：2027 春季" value="'+esc(def.name)+'"></div>'+
    '<div class="tmrow">'+
      '<div class="tmfld"><label>開始日期</label>'+
        '<input type="date" id="tmStart" value="'+def.start+'"></div>'+
      '<div class="tmfld"><label>週數（1–30）</label>'+
        '<input type="number" id="tmWeeks" min="1" max="30" step="1" value="'+def.weeks+'"></div>'+
    '</div>'+
    '<div class="tmpv" id="tmPv"></div>'+
    '<div class="tmfbtns">'+
      '<button class="btn pri" id="tmSave">'+(t?'儲存':'新增學期')+'</button>'+
      (t?'<button class="btn" id="tmCancel2">取消</button>':'')+
    '</div>';
  tmPreview(i);
  $id('tmStart').addEventListener('input',function(){ tmPreview(i); });
  $id('tmWeeks').addEventListener('input',function(){ tmPreview(i); });
  $id('tmSave').addEventListener('click',function(){ tmSave(i); });
  var c=$id('tmCancel2'); if(c) c.addEventListener('click',function(){ tmFormHtml(null); });
}
function tmOverlap(from,until,skipIdx){
  for(var i=0;i<(S.terms||[]).length;i++){
    if(i===skipIdx) continue;
    var R=termRange(S.terms[i]);
    if(R && from<=R.until && until>=R.from) return S.terms[i].name;
  }
  return null;
}
function tmPreview(i){
  var p=$id('tmPv'); if(!p) return;
  var raw=$id('tmStart').value;
  var st=normTermStart(raw);
  var w=Math.max(1,Math.min(30,Math.round(+$id('tmWeeks').value||14)));
  var s=new Date(st+'T00:00:00');
  if(!raw||isNaN(s.getTime())){ p.className='tmpv bad'; p.textContent='請揀開始日期'; return; }
  var e=addD(s,w*7-1);
  var adj=(raw!==st);
  var ov=tmOverlap(st,ymd(e),(i==null)?null:i);
  p.className='tmpv';
  p.innerHTML='第 1 週：'+ds2cn(st)+' – '+ds2cn(ymd(addD(s,6)))+
    '<br>第 '+w+' 週（最後）：'+ds2cn(ymd(addD(s,(w-1)*7)))+' – '+ds2cn(ymd(e))+
    (adj?'<br><span class="tmpv-warn">開始日期會自動對齊到嗰個星期嘅星期一</span>':'')+
    (ov?'<br><span class="tmpv-warn">注意：同「'+esc(ov)+'」嘅日期重疊</span>':'');
}
function tmSave(i){
  var name=($id('tmName').value||'').trim();
  if(!name){ alert('請輸入學期名稱，例如「2027 春季」。'); $id('tmName').focus(); return; }
  var st=normTermStart($id('tmStart').value);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st)){ alert('請揀開始日期。'); return; }
  var w=Math.max(1,Math.min(30,Math.round(+$id('tmWeeks').value||14)));
  var t;
  if(i==null){ t=newTerm(name,st,w); S.terms.push(t); }
  else { t=S.terms[i]; t.name=name; t.start=st; t.weeks=w; }
  S.terms.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  S.termIdx=Math.max(0,S.terms.indexOf(t));
  syncTerm(); buildJump(); buildTermSel(); refreshAll();
  tmListHtml(); tmFormHtml(null);
  if(i==null) alert('已新增「'+name+'」，而家已切換到呢個學期。\n'+

}
function buildJump(){

/* ================= 目標成績 ================= */
var GRADES = ['A+','A','A-','B+','B','B-','C+','C','C-','D','F'];

function subjColor(code){
  var pf=subjectPrefOf(code);
  if(pf.color&&PAL[pf.color]) return pf.color;
  for(var i=0;i<S.courses.length;i++){
    /* ⚠ 一定要驗證課堂自己嘅 color 係唔係合法色名：
       舊資料／手改過嘅備份／外來種子都可能寫咗 PAL 冇嘅色（例如 'rose'），
       唔驗證就會令 PAL[color].bd 爆 TypeError，連累成個設定頁畫唔出。 */
    if(S.courses[i].code===code){
      var c=S.courses[i].color;
      if(c&&PAL[c]) return c;
      break;
    }
  }
  return 'gray';
}

/* ---------- 邊啲嘢先算係「科目」 ----------
   課表上面唔止有課堂：仲有「溫書時段」（tag:'study'）同計時器記錄。
   佢哋一樣係 S.courses 嘅成員，但冇成績、冇學分，
   所以絕對唔應該出現喺「目標成績」嘅科目清單入面。
   （新增溫書時段時如果冇填代號，code 會自動填做 '溫書'。） */
var NOT_SUBJECT = {'溫書':1, '計時':1, '計時記錄':1};

function isSubjectCode(code){
  var k = String(code==null ? '' : code).trim();
  return !!k && !NOT_SUBJECT[k];
}
function isSubjectCourse(c){
  if(!c || !isSubjectCode(c.code)) return false;
  return (c.tag || 'class') === 'class';   /* 舊資料冇 tag → 當課堂 */
}

function allSubjects(){
  var out=[], seen={};
  S.courses.forEach(function(c){
    if(!isSubjectCourse(c) || seen[c.code]) return;
    seen[c.code]=1; out.push(c.code);
  });
  /* 成績紀錄入面嘅科目照樣保留（可能係課表冇嘅科），但一樣要剔走溫書等 */
  Object.keys(S.grades).forEach(function(k){
    if(seen[k] || !isSubjectCode(k)) return;
    seen[k]=1; out.push(k);
  });
  return out;
}
function gradeRec(code){
  var g = S.grades[code];
  if(!g || typeof g!=='object'){ g = {target:''}; S.grades[code]=g; }
  if(typeof g.target!=='string') g.target = '';
  return g;
}
/* 學分：優先喺 GPA 清單配對（忽略空格／大小寫），配唔到當 3 學分 */
var DEF_CREDITS = 3;
function normCode(c){ return String(c==null?'':c).replace(/\s+/g,'').toUpperCase(); }
function creditOf(code){
  var k = normCode(code), rows = S.gpa || [];
  for(var i=0;i<rows.length;i++){
    if(normCode(rows[i].code)!==k) continue;
    var cr = parseFloat(rows[i].credits);
    if(!isNaN(cr) && cr>0) return cr;
  }
  return null;
}
/* 預計 GPA（本學期）+ 預計總 GPA（連以往已評分課程）
   本學期 = 只計已設目標嘅科；以往 = GPA 清單入面有 A+…F 嘅行（P／PP／未評分唔計） */
function gradeTotals(){
  var rows = S.gpa || [], gradedSet = {};
  var pc=0, pp=0, pastN=0;
  rows.forEach(function(r){
    var gp = gpOf(r.grade);              /* 未評分 / P / PP → null */
    if(gp===null) return;
    var cr = parseFloat(r.credits); if(isNaN(cr)||cr<0) cr=0;
    pc += cr; pp += gp*cr; pastN++;
    gradedSet[normCode(r.code)] = 1;     /* 記住邊啲科已經有真實成績 */
  });
  var tc=0, tp=0, targetN=0, skipped=[], noCredit=[];
  allSubjects().forEach(function(code){
    var t = gradeRec(code).target;
    if(!t) return;
    if(gradedSet[normCode(code)]){ skipped.push(code); return; }   /* 唔重複計 */
    var gp = gpOf(t); if(gp===null) return;
    var cr = creditOf(code); if(cr===null){ cr = DEF_CREDITS; noCredit.push(code); }
    tc += cr; tp += gp*cr; targetN++;
  });
  return {
    sem:{ gpa:(tc>0 ? tp/tc : null), credits:tc, counted:targetN, noCredit:noCredit },
    total:{ gpa:((pc+tc)>0 ? (pp+tp)/(pc+tc) : null), credits:pc+tc,
            pastN:pastN, pastCredits:pc, targetN:targetN, skipped:skipped }
  };
}
function gradeProjHtml(t){
  var sem = t.sem, tot = t.total;
  if(!sem.counted){
    return '<div class="gpcell"><div class="gpa-big none"><b>未設定目標</b></div>'+
      '<div class="gp-hint">喺下面揀每科嘅目標等級，就會即時估算本學期同埋總 GPA。</div></div>';
  }
  var h = '<div class="gpcell"><div class="gpa-big"><b>'+sem.gpa.toFixed(2)+'</b>'+
    '<small>預計 GPA</small></div>'+
    '<div class="gpa-meta">'+
      '<span><b>'+sem.counted+'</b>科已設目標</span>'+
      '<span><b>'+fmtNum(sem.credits)+'</b>計入學分</span>'+
    '</div></div>';
  if(tot.pastN > 0){
    h += '<div class="gpcell"><div class="gpa-big"><b>'+tot.gpa.toFixed(2)+'</b>'+
      '<small>預計總 GPA</small></div>'+
      '<div class="gpa-meta">'+
        '<span><b>'+fmtNum(tot.credits)+'</b>總學分</span>'+
        '<span><b>'+tot.pastN+'</b>以往已評分</span>'+
        '<span><b>'+tot.targetN+'</b>目標科</span>'+
      '</div></div>';
  }
  var notes = [];
  if(sem.noCredit.length){
    notes.push(sem.noCredit.length+' 科未配對到學分（'+sem.noCredit.map(esc).join('、')+
               '），暫以 '+DEF_CREDITS+' 學分計');
  }
  if(tot.skipped.length){
    notes.push('已有實際成績，唔重複計入目標：'+tot.skipped.map(esc).join('、'));
  }
  if(notes.length) h += '<div class="gp-note">'+notes.join('　·　')+'</div>';
  return h;
}
function drawGradeProj(){
  var el = document.getElementById('gradeProj'); if(!el) return;
  el.innerHTML = gradeProjHtml(gradeTotals());
}
/* 排序用：已設目標嘅按等級高低排前面，未設目標嘅排最後 */
function gradeRank(code){
  var i = GRADES.indexOf(gradeRec(code).target);
  return i<0 ? GRADES.length : i;
}
function gradeCardHtml(code){
  var g = gradeRec(code);
  var col = PAL[subjColor(code)] || PAL.gray;
  var cr = creditOf(code);
  var h = '<div class="gcard" data-code="'+esc(code)+'">';
  h += '<header><span class="dot" style="background:'+col.bd+'"></span>'+
       '<b>'+esc(code)+'</b>'+
       (g.target ? '<span class="gpill">目標 '+g.target+'</span>'
                 : '<span class="gpill none">未設目標</span>')+
       (cr===null
         ? '<span class="gcred warn" title="GPA 清單未有呢科嘅學分，暫以 '+DEF_CREDITS+' 學分計">學分未定</span>'
         : '<span class="gcred" title="學分（來自 GPA 清單）">'+fmtNum(cr)+' 學分</span>')+
       '<span class="gtgt"><select class="g-target" aria-label="目標等級">'+
       '<option value=""'+(g.target===''?' selected':'')+'>未設定</option>'+
       GRADES.map(function(x){
         return '<option value="'+x+'"'+(g.target===x?' selected':'')+'>'+x+'</option>';
       }).join('')+
       '</select></span></header>';
  h += '</div>';
  return h;
}
function gradeStatText(){
  var subs = allSubjects(), set=0;
  subs.forEach(function(c){ if(gradeRec(c).target) set++; });
  return subs.length+' 科 · '+set+' 科已設目標';
}
function drawGrades(){
  var body = document.getElementById('gradeBody'); if(!body) return;
  var subs = allSubjects();
  drawGradeProj();
  if(!subs.length){
    body.innerHTML = '<div class="gempty"><b>還沒有科目</b>'+
      '先按「＋ 新增」加入課堂，或按右上角「＋ 新增科目」建立一個</div>';
    var st0 = document.getElementById('gradeStat');
    if(st0) st0.textContent = '尚未設定任何目標';
    return;
  }
  subs.sort(function(a,b){
    var ra = gradeRank(a), rb = gradeRank(b);
    if(ra!==rb) return ra-rb;
    return a<b ? -1 : (a>b ? 1 : 0);
  });
  var h = '';
  subs.forEach(function(code){ h += gradeCardHtml(code); });
  body.innerHTML = h;
  var stat = document.getElementById('gradeStat');
  if(stat) stat.textContent = gradeStatText();
  if(!body.dataset.bound){
    body.dataset.bound = '1';
    body.addEventListener('change', onGradeChange);
  }
}
function onGradeChange(e){
  var el = e.target;
  if(!el || !el.classList || !el.classList.contains('g-target')) return;
  var card = el.closest('.gcard'); if(!card) return;
  var rec = gradeRec(card.dataset.code);
  rec.target = el.value;
  save(); drawGrades();
}

function prefersDark(){

  catch(e){ return false; }
}
function themeIsDark(){
  var t = S.theme || 'auto';
  if(t==='dark') return true;
  if(t==='light') return false;
  return prefersDark();
}
/* 只換屬性同色板（列印前可以強制轉淺色），唔會重畫 */
function paintTheme(dark){
  PAL = dark ? PAL_DARK : PAL_LIGHT;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', dark ? '#0e1219' : '#2f5fd0');
}

function setTheme(t){
  S.theme = (t==='light'||t==='dark') ? t : 'auto';
  applyTheme();
  refreshAll();          /* 課堂色塊用 inline 色，要重畫先跟到 */

/* ================= 備份／還原 ================= */
var BK_KEY = 'timetable-backup-at-v1';
var BK_APP = 'timetable-2026f';
/* 設定頁嘅子面板：null | 'copy' | 'paste' */
var SET_PANEL = null;
var CP_PHOTOS = null;   /* 複製面板用嘅相片快取 */
var CP_INC = true;      /* 複製面板：包唔包含日記相片 */
function fmtSize(n){
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
/* ---------- gzip（雲端同步用） ----------
   GitHub Gist 每個檔案只回傳頭 1 MB，一超過就 f.truncated=true，下載唔到。
   日記相片係 1280px JPEG 嘅 base64（一張 150–450 KB），三四張就爆。
   所以上傳前先用 gzip 壓一次：
   - 純 JSON（冇相）通常壓到原本嘅 1/6 – 1/4；
   - 相片係 base64 JPEG，已經壓縮過，gzip 得 1–2 成，但都聊勝於無。
   支援 CompressionStream 就用（Chrome 80+/Safari 16.4+/iOS 16.4+），
   唔支援就原樣上傳（向後兼容，唔會壞）。
   格式：gzip 出嚟係二進位，base64 之後包成 { _gz:1, n:<原文字數>, d:'<base64>' }。
   下載嗰邊見到 _gz 就解壓，冇 _gz 就當舊版純 JSON 直接讀 —— 新舊都通。 */
function gzSupported(){
  return (typeof CompressionStream === 'function') &&
         (typeof DecompressionStream === 'function') &&
         (typeof TextEncoder === 'function') && (typeof TextDecoder === 'function');
}
function b64FromBytes(bytes){
  var s='', CH=0x8000;   /* 一次過太大會爆 call stack，要切件 */
  for(var i=0;i<bytes.length;i+=CH){
    s += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(s);
}
function bytesFromB64(b64){
  var bin=atob(b64), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
/* 壓縮：cb(err, text) —— text 係可以塞入 gist 嘅字串。
   ⚠ 呢度唔可以引用 APP_VER：佢係喺下面 PWA 段落嘅另一個 IIFE 入面用 var 宣告，
     呢個 scope 睇唔到，一寫就會 ReferenceError，而個 error 會被 .catch 食咗，
     變成「靜靜哋唔壓縮」——最難捉嘅一種 bug。 */
function gzPack(text, cb){
  if(!gzSupported()){ cb(null, text); return; }
  try{
    var cs=new CompressionStream('gzip');
    var w=cs.writable.getWriter();
    /* ⚠ write() 一定要 await／catch：如果唔係，writer 收到錯誤會變成
       unhandled rejection，而 close() 就會跟住炸，成個壓縮靜靜哋失敗。 */
    w.write(new TextEncoder().encode(text)).then(function(){ return w.close(); })
     .catch(function(){ /* 下面 .arrayBuffer() 會 reject，統一喺嗰度處理 */ });
    new Response(cs.readable).arrayBuffer().then(function(ab){
      var bytes=new Uint8Array(ab);
      var b64=b64FromBytes(bytes);
      /* 包成 JSON。加 "_gz" 標記令下載嗰邊知係壓縮過。 */
      cb(null, JSON.stringify({ _gz:1, n:text.length, d:b64 }));
    }).catch(function(e){
      /* 壓唔到就原樣上傳（唔會壞，只係冇細到）。但唔好靜靜哋，
         留個記錄方便將來查。 */
      try{ if(console && console.warn) console.warn('gzPack 失敗，改為原樣上傳：', e && e.message); }catch(_e){}
      cb(null, text);
    });
  }catch(e){
    try{ if(console && console.warn) console.warn('gzPack 同步失敗：', e && e.message); }catch(_e){}
    cb(null, text);
  }
}
/* 解壓：輸入係 gist 檔案內容字串，回傳 Promise<string>（原始 JSON 文字）。
   如果唔係 gzip 包裝（舊版上傳嘅），就直接回傳原文 —— 咁就新舊都讀得。 */
function gzUnpack(text){
  var obj=null;
  try{ obj = JSON.parse(text); }catch(e){ obj=null; }
  if(!obj || !obj._gz || typeof obj.d!=='string'){
    return Promise.resolve(text);   /* 舊格式／未壓縮 */
  }
  if(!gzSupported()){
    return Promise.reject('呢個瀏覽器唔支援解壓（gzip），但雲端係壓縮檔。\n'+
      '請用較新嘅 Safari（16.4+）或 Chrome 開啟，或者去另一部機下載。');
  }
  try{
    var bytes=bytesFromB64(obj.d);
    var ds=new DecompressionStream('gzip');
    var w=ds.writable.getWriter();
    w.write(bytes); w.close();
    return new Response(ds.readable).text();
  }catch(e){
    return Promise.reject('解壓失敗：'+(e&&e.message?e.message:e));
  }
}
function buildPackObj(photos, includePhotos){
  var p = { app:BK_APP, format:3, exportedAt:new Date().toISOString(),
            title:S.title, state:S, photos: includePhotos ? (photos||[]) : [] };
  if(!includePhotos) p.noPhotos = true;
  return p;
}
/* ---------- 雲端相片：一張一個檔案 ----------
   ⚠️ 關鍵發現：Gist 嘅「1 MB 上限」只係 **API JSON 回應** 嘅截斷限制，
      唔係檔案大小限制——gist 單檔其實可以到 100 MB。
      API 回傳嘅 f.content 超過 1 MB 就會截斷（f.truncated=true），
      但 f.raw_url 可以拎到完整內容（10 MB 以下唔使 clone）。
      所以：文字（細、要即刻睇到）照放 timetable.json 走 API；
            相片（大）每張拆成獨立檔案，下載時逐張經 raw_url 拎。
      咁樣相片就永遠同步得到，唔會再撞 1 MB 天花板。 */
var PH_PREFIX = 'photo-';
var PH_EXT = '.jpg';
/* 相片 id 可能含有唔適合做檔名嘅字，一律轉成安全字元 */
function phSafeId(id){
  return String(id==null?'':id).replace(/[^A-Za-z0-9_-]/g, '_').slice(0,80);
}
function phFileOf(id){ return PH_PREFIX + phSafeId(id) + PH_EXT; }
/* dataURL → base64（gist API 收純 base64 字串做檔案內容） */
function phPayload(src){
  var s = String(src==null?'':src);
  var i = s.indexOf('base64,');
  return (i >= 0) ? s.slice(i+7) : s;
}
/* 由 gist 嘅 files map 抽出所有相片檔（回傳 [{id, name, url, sha}]） */
function phListFromFiles(files){
  var out=[];
  if(!files || typeof files!=='object') return out;
  Object.keys(files).forEach(function(name){
    if(name.indexOf(PH_PREFIX)!==0) return;
    var id = name.slice(PH_PREFIX.length);
    if(id.slice(-PH_EXT.length)===PH_EXT) id = id.slice(0, -PH_EXT.length);
    var f = files[name] || {};
    out.push({ id:id, name:name, url:f.raw_url||'', sha:f.content||'' });
  });

}
function idbAll(cb){
  if(!idbReady){ cb([]); return; }
  try{
    var out=[], r=idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).openCursor();
    r.onsuccess=function(e){
      var c=e.target.result;
      if(c){ out.push(c.value); c.continue(); } else cb(out);
    };
    r.onerror=function(){ cb(out); };
  }catch(e){ cb([]); }
}

/* ================= 全域搜尋 =================
   一個輸入框搵晒：課堂／科目、待辦、倒數、成績、GPA、日記（連內文同歌）、
   單次活動、溫書記錄。每筆結果都帶「跳去邊一頁＋要唔要打開佢」嘅指示，
   撳一下就飛去啱嘅位置，唔使自己去搵。

   唔用 S 以外嘅狀態，所以搜尋本身係純讀取，唔會改任何嘢。 */
var SEARCH_MIN = 1;          /* 一個字就開始搵（中文一個字已經有意義） */

function searchHay(){
  /* 預先砌一次可搜尋索引唔划算（資料量細，即場砌就得），
     但關鍵詞比對要「唔理大小寫同空白」——同 normCode 一致。 */
  return function(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,''); };
}
/* 高亮：把 query 嘅每一段（以空白分）用 <mark> 包住。已經 escape 過嘅字串先入。 */
function hl(escaped, terms){
  var out=escaped;
  terms.forEach(function(t){
    if(!t) return;
    /* 因為已經 escape，所以要搵嘅字都要 escape 一次先對得上（& < > 例外：query 好少用） */
    var re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
function searchAll(q){
  var raw=String(q||'').trim();
  if(raw.length<SEARCH_MIN) return [];
  var terms=raw.toLowerCase().split(/\s+/).filter(Boolean);
  var flat=searchHay();
  var hits=[];
  function add(o){
    /* 所有 terms 都要出現（AND），符合「越打越窄」嘅直覺 */
    var hay=flat(o._t||'');
    for(var i=0;i<terms.length;i++) if(hay.indexOf(flat(terms[i]))<0) return;
    delete o._t;
    hits.push(o);
  }

  /* 1) 課堂／科目：由課程本身（唔係逐日事件）出發，一個人只出一條 */
  var seenCode={};
  (S.courses||[]).forEach(function(c){
    if(!c.code) return;
    var k=normCode(c.code)+'|'+(c.sec||'');
    if(seenCode[k]) return; seenCode[k]=1;
    add({ kind:'course', id:c.id, title:(c.code||'')+(c.sec?' '+c.sec:''),
          sub:[TAGS[c.tag||'class']||'課堂', DOW[(+c.day||1)-1], (c.start||'')+'–'+(c.end||''),
               c.room||''].filter(Boolean).join('　·　'),
          _t:[c.code,c.sec,c.room,TAGS[c.tag||'class']].filter(Boolean).join(' '),
          go:{ view:'week' } });
  });
  /* 2) 單次活動 */
  (S.oneOff||[]).forEach(function(o){
    add({ kind:'oneoff', id:o.id, title:(o.code||'單次活動')+(o.sec?' '+o.sec:''),
          sub:ds2cn(o.date)+'　·　'+(o.start||'')+'–'+(o.end||'')+(o.room?('　·　'+o.room):''),
          _t:[o.code,o.sec,o.room,TAGS[o.tag]||''].filter(Boolean).join(' '),
          go:{ view:'week', date:o.date } });
  });
  /* 3) 待辦 */
  (S.todos||[]).forEach(function(t){
    var cd=t.done?'已完成':(t.due?(cdDayDiff(t.due)<0?'已逾期':(cdDayDiff(t.due)===0?'今日到期':(t.due+' 到期'))):'冇截止日');
    add({ kind:'todo', id:t.id, title:t.text||'（無內容）', sub:'待辦　·　'+cd,
          _t:[t.text,t.due].filter(Boolean).join(' '),
          go:{ view:'todo' } });
  });
  /* 4) 倒數項目 */
  (S.deadlines||[]).forEach(function(d){
    add({ kind:'deadline', id:d.id, title:d.name||'倒數項目',
          sub:'倒數　·　'+ds2cn(d.date)+(d.tag?('　·　'+d.tag):'')+(d.note?('　·　'+d.note):''),
          _t:[d.name,d.tag,d.note,d.date].filter(Boolean).join(' '),
          go:{ view:'countdown' } });
  });
  /* 5) 成績目標 */
  Object.keys(S.grades||{}).forEach(function(code){
    var g=S.grades[code]; if(!g||typeof g!=='object') return;
    if(!g.target) return;
    add({ kind:'grade', id:code, title:code, sub:'成績目標　·　'+g.target,
          _t:code+' '+g.target, go:{ view:'grade' } });
  });
  /* 6) GPA 課程 */
  (S.gpa||[]).forEach(function(r){
    add({ kind:'gpa', id:r.id, title:r.code||'（無代號）',
          sub:'GPA　·　'+(r.grade||'未有成績')+'　·　'+(r.credits||'?')+' 學分',
          _t:[r.code,r.grade,r.credits].filter(Boolean).join(' '), go:{ view:'gpa' } });
  });
  /* 7) 日記：內文、心情、歌名、歌手 */
  (S.diary||[]).forEach(function(d){
    var note=String(d.note||'').trim();
    var songTitle = d.song ? String((d.song.meta&&d.song.meta.title)||d.song.label||'').trim() : '';
    var songArt = d.song ? songArtist(d.song) : '';
    var ph=(d.photos||[]).length;
    if(!note && !songTitle && !ph && !(d.mood>=1)) return;
    var subBits=['日記', ds2cn(d.date)];
    if(d.mood>=1) subBits.push('心情 '+'😞😕😐🙂😄'.slice((d.mood-1),1));
    if(ph) subBits.push(ph+' 張相');
    if(songTitle) subBits.push('🎵 '+songTitle+(songArt?(' — '+songArt):''));
    add({ kind:'diary', id:d.id, title:note?note.split('\n')[0].slice(0,60):(songTitle||'（只有相片）'),
          sub:subBits.join('　·　'), _note:note,
          _t:[note,songTitle,songArt,d.date].filter(Boolean).join(' '),
          go:{ view:'diary', date:d.date } });
  });
  /* 8) 溫書記錄（有科目嘅先值得搜） */
  (S.studySessions||[]).forEach(function(x){
    if(!x.subj) return;
    add({ kind:'session', id:x.id, title:'溫書：'+x.subj,
          sub:'溫書記錄　·　'+ds2cn(x.d)+'　·　'+x.s+'–'+x.e+'　·　'+hTxt(x.m)+' 小時',
          _t:[x.subj,x.d].filter(Boolean).join(' '), go:{ view:'week', date:x.d } });
  });

  /* 排序：完全符合標題 > 標題開頭 > 標題包含 > 其他；同分時按類型固定次序 */
  var order={course:0,oneoff:1,todo:2,deadline:3,grade:4,gpa:5,diary:6,session:7};
  var t0=flat(raw);
  function score(h){
    var t=flat(h.title);
    if(t===t0) return 0;
    if(t.indexOf(t0)===0) return 1;
    if(t.indexOf(t0)>=0) return 2;
    return 3;
  }
  hits.forEach(function(h){ h._s=score(h); });
  hits.sort(function(a,b){
    return a._s-b._s || (order[a.kind]-order[b.kind]) || 0;
  });
  return hits;
}
/* 跳去結果：先切換檢視，再（如果有）打開嗰一筆 */

/* ================= 匯出 iCalendar（.ics） =================
   為咩要 .ics：純前端 PWA 冇得做真系統通知，但匯出一個標準日曆檔
   再 import 落手機／iPad／Google 日曆，之後**系統自己彈提示**——
   呢個係唯一可以喺唔裝 App 嘅前提下攞到真提醒嘅方法。

   特別注意幾個 iCalendar 嘅硬規矩（錯咗會靜靜哋 import 唔到）：
   1. 行尾一定要 CRLF。
   2. 每行唔可以超過 75 個 octet；長過就要折行，續行開頭要有一個空格。
      ——而且要用 UTF-8 位元組數去數，唔係字元數（中文一個字 3 bytes）。
   3. 文字值入面嘅 \ ; , 同換行要 escape 成 \\ \; \, \n。
   4. 本地時間要寫成 floating time（YYYYMMDDTHHMMSS，唔加 Z），
      咁匯入嗰部機先會照佢自己嘅時區顯示，唔會飄。 */

/* UTF-8 位元組長度 */
function utf8Len(s){
  var n=0;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<0x80) n+=1;
    else if(c<0x800) n+=2;
    else if(c>=0xD800&&c<=0xDBFF){ n+=4; i++; }   /* 代理對：4 bytes 一個 emoji */
    else n+=3;
  }
  return n;
}
/* RFC 5545 §3.1 折行：每條實體行唔可以超過 75 octets，續行以單一空格開頭。
   ⚠ 個空格本身都佔 1 octet，所以「內容」每行最多只可以放 75（第一行）／74（續行）。
   ⚠ 一定要逐個 code point 處理：如果當 UTF-16 code unit 逐個字切，
     一個 emoji（📐 = 兩個 code unit、4 octets）就會被切開，
     寫落檔就會變成兩個殘缺嘅 UTF-8 序列 —— 而 round-trip 測試仲會照過，
     因為拼返埋係一樣字串。呢個 bug 只有逐段驗位元組邊界先捉得到。 */
function icsFold(line){
  var out=[], cur='', curLen=0, i=0;
  function push(){
    out.push((out.length?' ':'')+cur);
    cur=''; curLen=0;
  }
  while(i<line.length){
    var cp=line.codePointAt(i);
    var ch=String.fromCodePoint(cp);
    i += (cp>0xFFFF ? 2 : 1);
    var L=utf8Len(ch);
    var cap = out.length ? 74 : 75;
    if(curLen+L>cap && cur!=='') push();
    cur+=ch; curLen+=L;
  }
  if(cur!==''||!out.length) push();
  return out.join('\r\n');
}
/* 文字值 escape */
function icsEsc(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')
    .replace(/\r\n|\r|\n/g,'\\n');
}
/* 內容行：NAME;PARAM=..:VALUE 都要折行 */
function icsLine(name, params, value){
  var k=name;
  if(params) k+=';'+params;
  return icsFold(k+':'+value);
}
/* 'YYYY-MM-DD' + 'HH:MM' → 'YYYYMMDDTHHMMSS'（floating time） */
function icsStamp(ds, hm, addMin){
  var d=new Date(ds+'T'+((hm&&/^\d{2}:\d{2}$/.test(hm))?hm:'00:00')+':00');
  if(isNaN(d.getTime())) return '';
  if(addMin) d=new Date(d.getTime()+addMin*60000);
  return ''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+
         p2(d.getHours())+p2(d.getMinutes())+'00';
}
function icsDateOnly(ds){ return String(ds||'').replace(/-/g,''); }
function icsNowStamp(){
  var d=new Date();
  return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+
         p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';
}
/* 一個 VEVENT */
function icsEvent(o){
  var L=[];
  L.push('BEGIN:VEVENT');
  L.push(icsLine('UID',null,o.uid+'@timetable-pwa'));
  L.push(icsLine('DTSTAMP',null,icsNowStamp()));
  if(o.allday){
    /* 全日事件：DTEND 係「不含」嘅，所以要 +1 日 */
    L.push(icsLine('DTSTART','VALUE=DATE',icsDateOnly(o.date)));
    var e=new Date(o.date+'T00:00:00');
    if(!isNaN(e.getTime())){
      e=addD(e,1);
      L.push(icsLine('DTEND','VALUE=DATE',icsDateOnly(ymd(e))));
    }
  }else{
    var s=icsStamp(o.date,o.start,0), en=icsStamp(o.date,o.start,o.mins||60);
    if(!s||!en) return '';
    L.push(icsLine('DTSTART',null,s));
    L.push(icsLine('DTEND',null,en));
  }
  L.push(icsLine('SUMMARY',null,icsEsc(o.summary||'')));
  if(o.desc)  L.push(icsLine('DESCRIPTION',null,icsEsc(o.desc)));
  if(o.loc)   L.push(icsLine('LOCATION',null,icsEsc(o.loc)));
  if(o.cat)   L.push(icsLine('CATEGORIES',null,icsEsc(o.cat)));
  if(o.alarm) L.push(icsFold('BEGIN:VALARM'), icsFold('TRIGGER:-PT'+o.alarm+'M'),
                      icsFold('ACTION:DISPLAY'),
                      icsLine('DESCRIPTION',null,icsEsc(o.summary||'')), icsFold('END:VALARM'));
  if(o.rrule) L.push(icsLine('RRULE',null,o.rrule));
  if(o.exdate) o.exdate.forEach(function(d){ L.push(icsLine('EXDATE','VALUE=DATE',icsDateOnly(d))); });
  L.push('END:VEVENT');
  return L.join('\r\n');
}
/* 產生整份 .ics。opts: {course,oneoff,todo,deadline,study,alarm} */
function buildIcs(opts){
  opts = opts || {};
  var want=function(k){ return opts[k]!==false; };   /* 預設全開 */
  var R=termRange();
  var from = (R&&R.from) || todayStr();
  var until = (R&&R.until) || ymd(addD(new Date(),120));
  var evs=[], skipped=0;
  var alarmMin = (typeof opts.alarmMin==='number') ? opts.alarmMin : 10;

  function room(c){ return c.room ? String(c.room) : ''; }
  function secTxt(c){ return c.sec ? String(c.sec) : ''; }

  /* 1) 固定課堂：用 RRULE 每個星期重複，比逐日展開細好多，改嘅時候亦只需改一條 */
  if(want('course')){
    var tid=activeTermId();
    (S.courses||[]).forEach(function(c){
      if(+c.day<1||+c.day>7) return;
      if(c.tag!=='class' && c.tag!=='study' && c.tag!=='exam') return;
      if(c.term && tid && c.term!==tid) return;
      if(!c.start||!c.end) return;
      var a=s2m(c.start), b=s2m(c.end);
      if(b<=a) return;
      /* 由課堂生效日起，第一個同 c.day 相同嘅日子，就係 RRULE 嘅起點 */
      var cd=c.from||from;
      var d0=new Date(cd+'T00:00:00');
      if(isNaN(d0.getTime())) return;
      var shift=(+c.day - dow1(d0) + 7)%7;
      d0=addD(d0,shift);
      var ds0=ymd(d0);
      /* 課程已經過咗期、或者仲未生效，就唔匯出 */
      var endUntil = c.until || until;
      if(ds0>endUntil) { skipped++; return; }
      var wk = (c.tag==='exam') ? 'WKST=MO'
             : ('INTERVAL=1');
      var ex=[];
      /* 例外：跳過嘅日子 → EXDATE；改咗時間嘅日子 → 另外開一個獨立事件 */
      var exd=S.exceptions||{};
      Object.keys(exd).forEach(function(ds){
        var x=exd[ds]||{};
        if(x.skip && String(x.skip).indexOf(c.id)>=0){ ex.push(ds); return; }
        var m=x.mod && x.mod[c.id];
        if(!m) return;
        ex.push(ds);
        var st=m.start||c.start, en=m.end||c.end;
        if(!st||!en) return;
        var ma=s2m(st), mb=s2m(en);
        if(mb<=ma) return;
        var mx=(m.code||c.code||''), msec=(m.sec!=null?m.sec:c.sec);
        evs.push({ uid:'mv-'+c.id+'-'+ds, date:ds, start:st, mins:mb-ma,
                   summary:mx+(msec?(' '+msec):''),
                   desc:[TAGS[c.tag]||'課堂','（改時間：原定 '+c.start+'–'+c.end+'）'].join('\n'),
                   loc:room(m)||room(c), cat:'時間表', alarm:alarmMin });
      });
      var rr='FREQ=WEEKLY;'+wk+';UNTIL='+icsDateOnly(endUntil)+'T235900';
      evs.push({
        uid:'c-'+c.id, date:ds0, start:c.start, mins:b-a,
        summary:(c.code||'')+(secTxt(c)?' '+secTxt(c):''),
        desc:[TAGS[c.tag]||'課堂', c.tag==='study'?'（溫書時段）':''].filter(Boolean).join('\n'),
        loc:room(c), cat:'時間表', alarm:alarmMin, rrule:rr, exdate:ex
      });
    });
  }

  /* 2) 單次活動：唔使 RRULE，直接一日一條 */
  if(want('oneoff')){
    (S.oneOff||[]).forEach(function(o){
      if(!o.date) return;
      if(R && (o.date<R.from || o.date>R.until)) { skipped++; return; }
      var a=s2m(o.start), b=s2m(o.end);
      if(!(b>a)) { skipped++; return; }
      evs.push({ uid:'o-'+o.id, date:o.date, start:o.start, mins:b-a,
                 summary:(o.code||'')+(o.sec?' '+o.sec:''),
                 desc:(TAGS[o.tag]||'單次活動'), loc:room(o),
                 cat:'時間表', alarm:alarmMin });
    });
  }

  /* 3) 功課／待辦截止日：全日事件，而且提前一日再響一次，唔會臨尾先知 */
  if(want('todo')){
    (S.todos||[]).forEach(function(t){
      if(!t.due||t.done) return;
      evs.push({ uid:'t-'+t.id, date:t.due, allday:true,
                 summary:'截止：'+(t.text||'待辦'),
                 desc:'由時間表 App 匯出嘅待辦事項。',
                 cat:'功課', alarm:alarmMin });
      /* 提前一日嘅預告：只得當日截止就冇意思 */
      var dprev=ymd(addD(new Date(t.due+'T00:00:00'),-1));
      if(!isNaN(new Date(dprev+'T00:00:00').getTime()))
        evs.push({ uid:'t1-'+t.id, date:dprev, allday:true,
                   summary:'聽日截止：'+(t.text||'待辦'),
                   desc:'由時間表 App 匯出嘅提醒。', cat:'功課', alarm:alarmMin });
    });
  }

  /* 4) 倒數項目（考試、交論文、旅行…） */
  if(want('deadline')){
    (S.deadlines||[]).forEach(function(d){
      if(!d.date) return;
      var hasTime=/^\d{2}:\d{2}$/.test(d.time||'');
      evs.push({ uid:'d-'+d.id, date:d.date,
                 allday:!hasTime, start:hasTime?d.time:'00:00', mins:60,
                 summary:(d.name||'倒數項目')+(d.tag?('　['+d.tag+']'):''),
                 desc:d.note||'', cat:'倒數', alarm:hasTime?alarmMin:0 });
    });
  }

  /* 5) 溫書記錄：只匯出「實際溫過」嘅時段（計時記錄），當成歷史事件 */
  if(want('study')){
    (S.studySessions||[]).forEach(function(x){
      if(!x.d||!x.s||!x.e) return;
      var a=s2m(x.s), b=s2m(x.e);
      if(!(b>a)) b=a+Math.max(1,x.m||0);
      evs.push({ uid:'s-'+x.id, date:x.d, start:x.s, mins:Math.max(1,b-a),
                 summary:'溫書'+(x.subj?('：'+x.subj):''),
                 desc:'實際溫書 '+hTxt(x.m)+' 小時（由計時器記錄）。',
                 cat:'溫書', alarm:0 });
    });
  }

  /* 砌檔：一定要有 VERSION + PRODID + CALSCALE */
  var out=[];
  out.push('BEGIN:VCALENDAR');
  out.push('VERSION:2.0');
  out.push('PRODID:-//時間表 App//2026f//ZH-HK');
  out.push('CALSCALE:GREGORIAN');
  out.push('METHOD:PUBLISH');
  out.push(icsLine('X-WR-CALNAME',null,icsEsc(S.title||'時間表')));
  if(R) out.push(icsLine('X-WR-CALDESC',null,
    icsEsc((termName()||'')+'　'+R.from+' 至 '+R.until)));
  /* 摺行時要逐條 event 已經摺好，所以要 split 返做行再駁 */
  evs.forEach(function(e){
    var s=icsEvent(e);
    if(s) out.push(s);
  });
  out.push('END:VCALENDAR');
  return { text:out.join('\r\n')+'\r\n', count:evs.length, skipped:skipped,
           from:from, until:until };
}
/* 設定頁勾咗邊幾項 */

   ['icsDead','deadline'],['icsStudy','study']].forEach(function(p){

}

/* 核心：驗證 → 確認 → 套用。檔案匯入同貼上匯入共用。 */
function applyPack(pack, opts){
  if(!pack || pack.app!==BK_APP || !pack.state || typeof pack.state!=='object'){
    alert('呢份內容唔似係本 App 嘅備份。'); return false;
  }
  opts = opts || {};
  var st=pack.state, photos=pack.photos||[], noPho=!!pack.noPhotos;
  var msg='確定要匯入呢份備份？\n\n'+
    '備份時間：'+(pack.exportedAt ? String(pack.exportedAt).slice(0,16).replace('T',' ') : '未知')+'\n'+
    '課堂 '+((st.courses||[]).length)+' 項 · 待辦 '+((st.todos||[]).length)+' 項 · '+
    '日記 '+((st.diary||[]).length)+' 日 · 相片 '+photos.length+' 張\n\n'+
    (noPho ? '※ 呢份備份冇包含相片，目標裝置現有嘅日記相片會保留。\n\n' : '')+
    (opts.partial ? '※ 雲端有部分相片下載唔到，呢部機其餘相片會保留。\n\n' : '')+
    '⚠️ 其餘現有資料會被完全覆蓋，無法復原。';
  if(!confirm(msg)) return false;
  try{ localStorage.setItem(KEY,JSON.stringify(st)); }
  catch(e){ alert('寫入失敗：瀏覽器儲存空間可能唔夠。'); return false; }
  if(!idbReady || noPho){ afterImport(); return true; }
  /* 先清空相片倉，避免舊相片變孤兒（還原就係要完全一致）。
     但如果雲端有部分相片下載失敗，就唔清——寧願留住舊嘅都好過掉失。 */
  var writePhotos = function(){
    var i=0;
    (function next(){
      if(i>=photos.length){ afterImport(); return; }
      var rec=photos[i++];
      if(!rec || !rec.id){ next(); return; }
      idbPut({id:rec.id, src:rec.src}, function(){ next(); });
    })();
  };
  if(opts.partial){ writePhotos(); return true; }
  idbClear(writePhotos);
  return true;
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    var pack;
    try{ pack=JSON.parse(String(fr.result)); }
    catch(e){ alert('呢個檔案唔係有效嘅備份（JSON 解析失敗）。'); return; }
    applyPack(pack);
  };
  fr.onerror=function(){ alert('讀取檔案失敗，請再試一次。'); };
  fr.readAsText(file);
}
/* 貼上文字匯入 */
function doImportText(txt){

  try{ pack=JSON.parse(txt); }

  applyPack(pack);
}
/* ================= 雲端同步（GitHub Gist） =================
   只用 GitHub Gist 當一個「雲端檔案櫃」：上傳＝POST/PATCH 一個私密 gist，
   下載＝GET 返嚟再套用。冇後端、冇帳號系統，全靠一個 gist scope 嘅 token。

   Token 同 gistId 存在**獨立嘅 localStorage key**（唔喺 S 入面），所以：
   - 匯出備份檔唔會夾帶 token
   - 「複製備份文字」亦唔會漏出去
   - 換機還原之後，另一部機要各自貼自己嗰個 token */
var CLOUD_KEY = 'timetable-cloud-v1';
var GH_API = 'https://api.github.com';
var GH_FILE = 'timetable.json';
var CLOUD_MAX = 900 * 1024;      /* 留 124 KB 緩衝；Gist API 每檔 1 MB 就會截斷 */
var CLOUD = { token:'', gistId:'', inc:false, lastUp:'', lastDown:'', photos:{} };
var CLOUD_MSG = null, CLOUD_BUSY = false;

function cloudLoad(){
  try{
    var raw = canStore ? localStorage.getItem(CLOUD_KEY) : null;
    if(!raw) return;
    var d = JSON.parse(raw);
    if(!d || typeof d!=='object') return;
    if(typeof d.token==='string') CLOUD.token=d.token;
    if(typeof d.gistId==='string') CLOUD.gistId=d.gistId;
    if(typeof d.inc==='boolean') CLOUD.inc=d.inc;
    if(typeof d.lastUp==='string') CLOUD.lastUp=d.lastUp;
    if(typeof d.lastDown==='string') CLOUD.lastDown=d.lastDown;
    /* 相片同步指紋（v46）。舊版冇呢個 key → 留空 {}
       留空係安全嘅：第一次上傳會重傳全部相，之後就只傳有變嘅。 */
    if(d.photos && typeof d.photos==='object' && !Array.isArray(d.photos)) CLOUD.photos=d.photos;
  }catch(e){}
}
function cloudSave(){
  try{ if(canStore) localStorage.setItem(CLOUD_KEY, JSON.stringify(CLOUD)); }catch(e){}
}
function fmtStamp(iso){
  if(!iso) return '—';
  var d=new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+
         p2(d.getHours())+':'+p2(d.getMinutes());
}
function cloudStatText(){
  var s='上次上傳 <b>'+fmtStamp(CLOUD.lastUp)+'</b>　·　上次下載 <b>'+fmtStamp(CLOUD.lastDown)+'</b>';
  if(CLOUD.gistId) s+='<br>Gist：<b>'+esc(CLOUD.gistId)+'</b>';
  return s;
}
/* 更新狀態行（唔重畫成個設定頁） */
function cloudMsg(txt, kind){

  var el=document.getElementById('clStat');

function cloudBusy(txt){
