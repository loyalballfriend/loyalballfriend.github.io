  html[data-theme="dark"] .cdrow:hover{background:#1a2130}
  html[data-theme="dark"] .cdbox{background:#232b39;color:#c3cbd9}
  html[data-theme="dark"] .cdrow.soon .cdbox{background:#3a2c14;color:#f0a94a}
  html[data-theme="dark"] .cdrow.week .cdbox{background:#333014;color:#d8cd6a}
  html[data-theme="dark"] .cdrow.today .cdbox{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .cdrow.past .cdbox{background:#232a36;color:#7d879a}
  html[data-theme="dark"] .cdrow.past .cdinfo b{color:#7d879a}
  html[data-theme="dark"] .cdtag{background:#232b39;color:#b8c1d1}
  html[data-theme="dark"] .cdtag.t-exam{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .cdtag.t-todo{background:#1b2540;color:#9dbaff}
  html[data-theme="dark"] .cdtag.t-assignment{background:#3a2c14;color:#f0a94a}
  html[data-theme="dark"] .cdtag.t-project{background:#2a1f3d;color:#c9a6f5}
  html[data-theme="dark"] .cdtag.t-quiz{background:#12302c;color:#5fd3c6}
  html[data-theme="dark"] .cdacts button{background:#232b39;color:#b8c1d1}
  html[data-theme="dark"] .cdacts button.del:hover{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .cdsrc{color:#7d879a}
  /* GPA */
  html[data-theme="dark"] .gpa-sum{background:linear-gradient(135deg,#171d2a,#141a26)}
  html[data-theme="dark"] .gpa-row:hover{background:#1a2130}
  html[data-theme="dark"] .gpa-row.head{color:var(--muted)}
  html[data-theme="dark"] .gpa-row input:hover,
  html[data-theme="dark"] .gpa-row select:hover{background:#1c222d}
  html[data-theme="dark"] .gpa-row input:focus,
  html[data-theme="dark"] .gpa-row select:focus{background:#1c222d}
  html[data-theme="dark"] .gpa-row .gp{color:#aab4c6}
  html[data-theme="dark"] .gpa-row .x{color:#5c6577}
  html[data-theme="dark"] .gpa-row .x:hover{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .gpa-legend div{background:#1a2130}
  /* 日記 */
  html[data-theme="dark"] .dday{background:var(--panel)}
  html[data-theme="dark"] .dday-head{background:#1a2130}
  html[data-theme="dark"] .dday-head input[type=date]{background:#1c222d}
  html[data-theme="dark"] .dday-head button{background:#232b39;color:#b8c1d1}
  html[data-theme="dark"] .dday-head button.del:hover{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .dday-note{background:var(--panel)}
  html[data-theme="dark"] .dday-note:focus{background:#131924}
  html[data-theme="dark"] .dday-note::placeholder{color:#6b7484}
  html[data-theme="dark"] .dphoto{background:#232b39}
  html[data-theme="dark"] .dphoto.missing::after{color:var(--muted)}
  html[data-theme="dark"] .dday-empty{color:#6b7484}
  html[data-theme="dark"] .dday-mood .dmlbl{color:var(--muted)}
  html[data-theme="dark"] .dday-mood button{background:#232b39}
  html[data-theme="dark"] .dday-mood button:hover{background:#2b3446}
  html[data-theme="dark"] .dday.pasting{border-color:#43b6ae;box-shadow:0 0 0 2px #12302c}
  html[data-theme="dark"] .dday-song .shead b{color:#b8c1d1}
  html[data-theme="dark"] .dday-song .cover{background:#232b39}
  html[data-theme="dark"] .dday-song .cover.ph{color:#7d879a}
  html[data-theme="dark"] .dday-song .pvlbl{color:#9dbaff}
  html[data-theme="dark"] .dday-song .shead button{background:#232b39;color:#b8c1d1}
  html[data-theme="dark"] .dday-song .shead button:hover{background:#3a1a1d;color:#ff8f8f}
  html[data-theme="dark"] .dday-song .open{background:#1c222d}
  html[data-theme="dark"] .dday-addsong button{background:#1c222d;color:var(--muted)}
  html[data-theme="dark"] .dhint{color:var(--muted)}
  html[data-theme="dark"] .songerr{color:#ff8f8f}
  /* 加入主畫面提示條 */
  html[data-theme="dark"] .inst{background:#1c222d}
  html[data-theme="dark"] .inst .x{color:#6b7484}
  html[data-theme="dark"] .inst .x:hover{color:var(--muted)}
  /* 設定對話框：外觀三段掣 */
  .theme3{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .theme3 button{flex:1;border:none;background:#fff;padding:9px 8px;font-size:13px;
                 font-family:inherit;cursor:pointer;color:var(--muted);font-weight:500}
  .theme3 button+button{border-left:1px solid var(--line2)}
  .theme3 button.on{background:var(--accent);color:#fff}
  html[data-theme="dark"] .theme3 button{background:#1c222d}
  html[data-theme="dark"] .theme3 button.on{background:var(--accent);color:#0e1219}
  /* 科目顏色／圖示 */
  .subjic{font-style:normal;margin-right:3px;font-size:1.02em;line-height:1}
  .subjpref{margin-top:9px;max-height:250px;overflow:auto;border:1px solid var(--line2);
            border-radius:10px;background:var(--panel)}
  .spgrid{display:flex;flex-direction:column}
  .sprow{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:13px}
  .sprow+.sprow{border-top:1px solid var(--line2)}
  .spdot{width:22px;height:22px;border-radius:6px;flex:none;display:flex;
         align-items:center;justify-content:center;color:#fff;font-size:12px}
  .spdot .subjic{margin:0;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .spname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          font-weight:500;color:var(--text)}
  .spmeta{font-size:11.5px;color:var(--muted);flex:none}
  .sbtn{border:1px solid var(--line2);background:transparent;color:var(--text);
        font-family:inherit;font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;flex:none}
  .sbtn:hover{border-color:var(--accent);color:var(--accent)}
  .sbtn.ghost{color:var(--muted)}
  .subssws{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .subssws button{width:38px;height:30px;border-radius:8px;border:1px solid var(--line2);
                  cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--muted)}
  .subssws button.on{box-shadow:0 0 0 2px var(--accent);color:var(--text)}
  .subssws button[data-c=""]{width:auto;padding:0 11px;background:transparent}
  .spicons{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .spicons button{width:36px;height:34px;border-radius:8px;border:1px solid var(--line2);
                  background:transparent;cursor:pointer;font-size:16px;font-family:inherit;
                  color:var(--muted)}
  .spicons button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .spicons button[data-i=""]{font-size:11.5px}
  .spinput{margin-top:6px;width:100%;padding:7px 9px;border:1px solid var(--line2);
           border-radius:8px;font-family:inherit;font-size:13px;background:transparent;
           color:var(--text)}
  html[data-theme="dark"] .subjpref{background:#151a23}
  /* 待辦：優先次序相關 */
  .tdrow.urg{border-left:3px solid #d9534f}
  html[data-theme="dark"] .tdrow.urg{border-left-color:#ff8f8f}
  .snz{flex:none;border:1px solid var(--line2);background:transparent;color:var(--muted);
       font-family:inherit;font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer}
  .snz:hover{border-color:var(--accent);color:var(--accent)}
  .pin{flex:none;border:none;background:transparent;cursor:pointer;font-size:15px;
       padding:0 2px;color:#c3cad7;line-height:1}
  .pin:hover{color:#e0a53c}
  .pin.on{color:#e0a53c}
  html[data-theme="dark"] .pin{color:#5a6377}
  html[data-theme="dark"] .pin.on{color:#f0c05a}
  /* 快捷鍵說明表 */
  .keytbl{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:10px;
          overflow:hidden;margin-top:2px}
  .keyrow{display:flex;align-items:center;gap:12px;padding:8px 12px;font-size:13px}
  .keyrow+.keyrow{border-top:1px solid var(--line2)}
  .keyrow kbd{flex:none;min-width:34px;text-align:center;padding:3px 8px;font-size:11.5px;
              font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);
              border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;
              background:var(--bg);color:var(--text)}
  .keyrow span{color:var(--muted)}
  /* 全域搜尋 */
  .sqinput{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;
           font-family:inherit;font-size:15px;background:transparent;color:var(--text);margin-top:2px}
  .sqinput:focus{outline:none;border-color:var(--accent);
                 box-shadow:0 0 0 3px var(--accent-soft)}
  .sqhint{margin-top:8px;font-size:12px;color:var(--muted)}
  .sqlist{margin-top:9px;max-height:52vh;overflow:auto;
          border:1px solid var(--line2);border-radius:10px}
  .sqlist:empty{display:none}
  .sqrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
         border:none;background:transparent;padding:9px 11px;cursor:pointer;
         font-family:inherit;color:var(--text)}
  .sqrow+.sqrow{border-top:1px solid var(--line2)}
  .sqrow:hover{background:var(--accent-soft)}
  .sqb{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;
       justify-content:center;font-size:11px;font-weight:500;color:#fff;background:#93a0b4}
  .sqb-course{background:#5F93E6}
  .sqb-oneoff{background:#43B6AE}
  .sqb-todo{background:#E39A55}
  .sqb-deadline{background:#d9534f}
  .sqb-grade{background:#AC70E4}
  .sqb-gpa{background:#77BB3F}
  .sqb-diary{background:#E57A85}
  .sqb-session{background:#4aa8a0}
  .sqm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .sqm b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sqm span{font-size:11.5px;color:var(--muted);overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .sqm mark{background:#ffe9a8;color:inherit;border-radius:2px;padding:0 1px}
  .sqgo{color:var(--muted);font-size:16px;flex:none}
  .sqempty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
  html[data-theme="dark"] .sqm mark{background:#5a4a1a;color:#ffe9a8}
  /* 跳去結果之後嘅短暫highlight */
  .flashrow{animation:flashbg 2s ease-out}
  .flashday{animation:flashcol 2s ease-out}
  @keyframes flashbg{0%{background:var(--accent-soft)}100%{background:transparent}}
  @keyframes flashcol{0%{background:var(--accent-soft)}100%{background:transparent}}
  @media (prefers-reduced-motion:reduce){
    .flashrow,.flashday{animation:none}
  }
  /* 設定頁：匯出 .ics */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
         gap:6px;margin-top:9px}
  .icsta{margin-top:8px;width:100%;font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);
         font-size:11px;border:1px solid var(--line2);border-radius:8px;padding:8px;
         background:transparent;color:var(--muted);resize:vertical}
  /* 設定對話框：溫書下限輸入 */
  .minrow{display:flex;align-items:center;gap:9px}
  .minrow input{flex:0 0 96px;width:96px;font-variant-numeric:tabular-nums}
  .minunit{font-size:12.5px;color:var(--muted)}
  .bkstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px;margin-top:4px}
  .bkstat div{border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;
              background:#fafbfe}
  .bkstat b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .bkstat span{font-size:11px;color:var(--muted)}
  html[data-theme="dark"] .bkstat div{background:#1a2130}
  .bkinfo{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}
  .bkfile{display:none}
  /* 設定對話框：兩部機同步指引 */
  .sgwrap{margin-top:12px;border:1px solid var(--line);border-radius:10px;
          overflow:hidden;background:#fafbfe}
  .sgwrap>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;
                  font-weight:500;color:var(--text);display:flex;align-items:center;gap:7px}
  .sgwrap>summary::-webkit-details-marker{display:none}
  .sgwrap>summary::after{content:'\25BE';margin-left:auto;color:var(--muted);font-size:11px;
                         transition:transform .15s}
  .sgwrap[open]>summary::after{transform:rotate(180deg)}
  .sgbody{padding:0 12px 12px;font-size:12.5px;line-height:1.75;color:var(--muted)}
  .sgstep{display:flex;gap:9px;margin-top:9px}
  .sgstep .n{flex:none;width:19px;height:19px;border-radius:50%;background:var(--accent);
             color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;
             justify-content:center;margin-top:2px}
  .sgstep .n.g{background:#1d9e75}
  .sgstep b,.sgbody b{color:var(--text);font-weight:500}
  .sgwarn{margin-top:11px;padding:9px 10px;border-left:3px solid #d85a30;background:#fdf3ee;
          border-radius:0 8px 8px 0;font-size:12px;line-height:1.7}
  .sgwarn b{color:#993c1d}
  html[data-theme="dark"] .sgwrap{background:#1a2130}
  html[data-theme="dark"] .sgstep .n{color:#0e1219}
  html[data-theme="dark"] .sgwarn{background:#2a1a14;border-left-color:#f0997b}
  html[data-theme="dark"] .sgwarn b{color:#f0997b}
  /* 設定對話框：複製／貼上備份 */
  .cprow{display:flex;gap:9px}
  .cprow .btn{flex:1;min-width:0}
  .cpbox{margin-top:11px;border:1px solid var(--line);border-radius:10px;
         padding:10px;background:#fafbfe}
  .cpta{width:100%;box-sizing:border-box;height:104px;resize:vertical;
        border:1px solid var(--line2);border-radius:8px;padding:8px 9px;
        font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;
        color:var(--text);background:#fff;word-break:break-all;white-space:pre-wrap}
  .cpchk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);
         cursor:pointer;margin-bottom:9px;user-select:none}
  .cpchk input{margin:0}
  .cpstat{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
  .cpstat.ok{color:#1d9e75}
  .cpstat.bad{color:#d85a30}
  html[data-theme="dark"] .cpbox{background:#1a2130}
  html[data-theme="dark"] .cpta{background:#12171f}
  html[data-theme="dark"] .cpstat.ok{color:#5dcaa5}
  html[data-theme="dark"] .cpstat.bad{color:#f0997b}
  .sgtip{margin-top:11px;padding:9px 10px;border-left:3px solid var(--accent);
         background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:12px;
         line-height:1.7;color:var(--text)}
  /* 設定對話框：雲端同步（GitHub Gist） */
  .clin{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line2);
        border-radius:9px;font-family:inherit;font-size:13.5px;color:var(--text);background:#fff}
  .clin+.clin{margin-top:8px}
  .clin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* 設定頁嘅 .fld label 係 display:block，會壓住 .cpchk 嘅 flex，所以要提高優先度。
     ⚠️ 唔可以用 align-items:center + 一個 display:block 嘅說明 span ——
     說明會變成一個 flex item 同 checkbox 擠喺同一行，文字就會斷成「包含日 / 記相片」。
     正確做法：flex-wrap + 說明 flex-basis:100% 逼佢自己開一行。 */
  .fld label.cpchk{display:flex;flex-wrap:wrap;align-items:center;gap:7px;
                   margin-bottom:0;font-size:12.5px;font-weight:400;color:var(--text);
                   cursor:pointer;user-select:none}
  .fld label.cpchk input{flex:0 0 auto;width:auto;padding:0;margin:0}
  /* 相片選項本身唔夠位：呢個 label 有長說明，所以畀佢自己一行、唔同 .fld 爭位 */
  .fld label.cpchk .cpchktx{flex:0 0 auto;white-space:nowrap}
  .clstat{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.65;text-align:center}
  .clstat b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
  .clstat.ok{color:#1d9e75}
  .clstat.bad{color:#d85a30}
  /* 雲端同步：相片選項嘅補充說明同大小提示 */
  .fld label.cpchk .clnote{flex:1 0 100%;margin-top:3px;font-size:11.5px;font-weight:400;
    color:var(--muted);line-height:1.55;white-space:normal;cursor:default}
  .clsz{margin-top:9px;padding:8px 10px;border-radius:8px;background:var(--bg2);
    font-size:11.5px;line-height:1.6;color:var(--muted)}
  .clsz b{color:var(--text);font-variant-numeric:tabular-nums}
  html[data-theme="dark"] .clin{background:#12171f}
  html[data-theme="dark"] .clstat.ok{color:#5dcaa5}
  html[data-theme="dark"] .clstat.bad{color:#f0997b}
  #setBody .fld:last-child{margin-bottom:0}
  .sgtip b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="brand">
      <h1 id="ttl">時間表</h1>
      <p id="subttl">2026 秋季 · 2026/09/28 – 2027/01/03 · 共 14 週 · 點擊任何課堂即可編輯</p>
    </div>
    <div class="grow"></div>
    <span class="tip" id="tip">已儲存</span>
  </div>

  <div class="bar">
    <button class="btn ico" id="prev" title="上一週（←）">‹</button>
    <button class="btn" id="today" title="回到本週（T）">本週</button>
    <button class="btn ico" id="next" title="下一週（→）">›</button>
    <div class="weeklbl" id="wlbl"></div>
    <select class="btn" id="termSel" style="padding:7px 9px" title="切換學期"></select>
    <select class="btn" id="jump" style="padding:7px 9px"></select>
    <div class="grow"></div>
    <div class="seg">
      <button id="vWeek" class="on">週視圖</button>
      <button id="vMonth">月總覽</button>
      <button id="vTodo">待辦<span class="badge" id="todoBadge" hidden>0</span></button>
      <button id="vCd">倒數<span class="badge" id="cdBadge" hidden>0</span></button>
      <button id="vGrade">成績</button>
      <button id="vGpa">GPA</button>
      <button id="vDiary">日記</button>
    </div>
    <button class="btn" id="btnList">項目清單</button>
    <button class="btn" id="btnFind" title="全域搜尋（/）">🔍 搜尋</button>
    <button class="btn pri" id="btnAdd">＋ 新增</button>
    <button class="btn" id="btnTimer" title="溫書計時器：開住計時，離開 App 都照計，停就自動記錄（取至最近分鐘）">溫書計時</button>
    <button class="btn" id="btnSet" title="外觀同備份">設定</button>
    <button class="btn" id="btnPrint">列印</button>
  </div>

  <!-- 週視圖 -->
  <div class="card" id="weekCard">
    <div class="wkstudy" id="wkStudy" hidden></div>
    <div class="wkacts" id="wkActs" hidden></div>
    <div class="wkhead" id="wkhead"></div>
    <div class="wktodo" id="wkTodo" hidden></div>
    <div class="wkbody">
      <div class="times" id="times"></div>
      <div class="cols" id="cols"></div>
      <div class="empty" id="emptyMsg" hidden>
        <b>本週沒有課堂</b>
        <small>若你的課堂延續到 12 月，可在「項目清單」按 <b style="font-weight:600">延伸到 12/31</b><br>
        或按「＋ 新增」加入溫書時段、考試或活動</small>
      </div>
    </div>
  </div>

  <!-- 月總覽 -->
  <div class="card" id="monthCard" hidden>
    <div class="months" id="months"></div>
  </div>

  <!-- 待辦清單 -->
  <div class="card" id="todoCard" hidden>
    <div class="todo-head">
      <div>
        <h2>待辦事項</h2>
        <p id="todoStat">還沒有待辦事項</p>
      </div>
      <div class="todo-add">
        <input type="text" id="tdNew" placeholder="新增待辦事項…（按 Enter）">
        <input type="date" id="tdNewDue" title="截止日（可留空）">
        <button class="btn pri" id="tdAdd">新增</button>
      </div>
    </div>

/* ================= 學期（季度） =================
   S.terms = [{id, name, start:'YYYY-MM-DD', weeks}]
   S.termIdx = 而家睇緊邊個學期。TERM / WEEKS 係由當前學期推算出嚟嘅（見 syncTerm）。 */
var DEF_TERM = { name:'2026 秋季', start:'2026-09-28', weeks:14 };
function newTerm(name, start, weeks){
  return { id:uid(), name:name, start:normTermStart(start), weeks:Math.max(1,Math.min(30,+weeks||14)) };
}
function activeTerm(){
  if(!S.terms || !S.terms.length) return null;
  var i=Math.max(0,Math.min(S.terms.length-1, (+S.termIdx)||0));
  return S.terms[i];
}
function activeTermId(){ var t=activeTerm(); return t ? t.id : ''; }
function termRange(t){
  t = t || activeTerm();
  if(!t) return null;
  var s=new Date(t.start+'T00:00:00');
  if(isNaN(s.getTime())) return null;
  var w=Math.max(1,Math.min(30, +t.weeks||14));
  var e=addD(s, w*7-1);
  return { from:t.start, until:ymd(e), s:s, e:e, weeks:w, name:t.name||'' };
}
/* 依住當前學期校正全域 TERM / WEEKS */
function syncTerm(){
  var R=termRange();
  if(R){ TERM=R.s; WEEKS=R.weeks; }
  else { TERM=new Date(2026,8,28); WEEKS=14; }
}
/* 學期橫跨嘅月份（月總覽用） */
function termMonths(t){
  var R=termRange(t); if(!R) return [];
  var out=[], a=new Date(R.s.getFullYear(), R.s.getMonth(), 1);
  var b=new Date(R.e.getFullYear(), R.e.getMonth(), 1);
  while(a<=b && out.length<24){
    out.push([a.getFullYear(), a.getMonth()]);
    a=new Date(a.getFullYear(), a.getMonth()+1, 1);
  }
  return out;
}
function termName(t){ t=t||activeTerm(); return t ? (t.name||'未命名學期') : '未設定學期'; }
function termLabel(t){

}

function p2(n){ return n<10 ? '0'+n : ''+n; }

function addD(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mon(d){ var x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function dow1(d){ return ((d.getDay()+6)%7)+1; }
function m2s(m){ return p2(Math.floor(m/60))+':'+p2(m%60); }
function s2m(s){ var a=String(s).split(':'); return (+a[0])*60+(+a[1]); }
function md(d){ return (d.getMonth()+1)+'/'+p2(d.getDate()); }
function ds2cn(s){ return s ? s.replace(/-/g,'/') : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 依實際項目自動延伸時間軸（例如晚上的溫書時段） */
function dayRange(){
  var lo=8, hi=20;
  function scan(st,en){
    if(!st||!en) return;
    var a=Math.floor(s2m(st)/60), b=Math.ceil(s2m(en)/60);
    if(a<lo) lo=a;
    if(b>hi) hi=b;
  }
  /* 只計當前學期嘅嘢：其他學期嘅深夜活動唔應該撐高個時間軸 */
  var tid=activeTermId(), R=termRange();
  function inTerm(ds){ return !R || (ds>=R.from && ds<=R.until); }
  S.courses.forEach(function(c){
    if(c.term && tid && c.term!==tid) return;
    scan(c.start,c.end);
  });
  S.oneOff.forEach(function(o){
    if(!inTerm(o.date)) return;
    scan(o.start,o.end);
  });
  /* 計時器／非溫書記錄嘅時段都要計入，唔係嘅話深夜活動會畫到時間軸出面 */
  if(Array.isArray(S.studySessions))
    S.studySessions.forEach(function(x){ if(inTerm(x.d)) scan(x.s,x.e); });
  if(Array.isArray(S.acts))
    S.acts.forEach(function(x){ if(inTerm(x.d)) scan(x.s,x.e); });
  lo=Math.max(0,Math.min(lo,22));
  hi=Math.max(lo+1,Math.min(24,hi));
  return {from:lo,to:hi};
}

function evOn(date){

  var inTerm=function(d2){ return !R || (d2>=R.from && d2<=R.until); };
  var out=[];

    if(ex.skip&&ex.skip.indexOf(c.id)>=0) return;
    var m=(ex.mod&&ex.mod[c.id])||{};
    var e={ id:c.id, src:c, date:ds, kind:'course', tag:c.tag||'class',
            code:c.code, sec:c.sec, start:c.start, end:c.end, color:c.color, room:c.room };
    Object.keys(m).forEach(function(k){ e[k]=m[k]; });
    out.push(e);
  });
  S.oneOff.forEach(function(o){
    if(o.date!==ds) return;
    if(!inTerm(o.date)) return;    /* 唔屬於當前學期嘅單次活動唔顯示 */
    out.push({ id:o.id, src:o, date:ds, kind:'oneoff', tag:o.tag||'class',
               code:o.code, sec:o.sec, start:o.start, end:o.end, color:o.color, room:o.room });
  });
  /* 計時器記錄嘅溫書時段：當成一件獨立事件，週視圖／月總覽會自動畫出嚟。
     用 tag:'sess'（唔係 'study'），所以 schedOfDay() 唔會重複計佢嘅時數。 */
  sessOn(ds).forEach(function(x){
    out.push({ id:x.id, src:x, date:ds, kind:'session', tag:'sess',
               code:'溫書', sec:'計時', start:x.s, end:x.e, color:'teal', room:'' });
  });
  /* 非溫書時間記錄：一樣當成事件，週視圖會畫成灰色 block。
     tag:'act' 唔喺 TAGS 入面，亦唔會被任何溫書統計認到。 */
  actsOn(ds).forEach(function(x){
    out.push({ id:x.id, src:x, date:ds, kind:'act', tag:'act',
               code:x.label, sec:'', start:x.s, end:x.e, color:'gray', room:'' });
  });
  return out;
}
function todosOn(ds){

}
function openTodos(){ return S.todos.filter(function(t){ return !t.done; }); }
function curMon(){ return addD(TERM,S.weekIdx*7); }
function isToday(d){ return ymd(new Date())===ymd(d); }

/* ================= 每週溫書時數 ================= */
/* 下限：S.studyMin（分鐘／每星期）。0 或未設 = 唔追蹤。 */
function studyMinMin(){ var v=+S.studyMin; return (isFinite(v)&&v>0)?v:0; }
/* 分鐘 → 小時字串，去掉尾隨 0（180 → '3'、150 → '2.5'、45 → '0.75'） */
function hTxt(min){
  var s=(Math.max(0,min)/60).toFixed(2).replace(/\.?0+$/,'');
  return s===''?'0':s;
}
/* 課表上排定嘅溫書時段（計埋例外／改時間，已取消嘅唔計） */
function schedOfDay(d){
  var t=0;
  evOn(d).forEach(function(e){
    if(e.tag!=='study') return;
    var a=s2m(e.start), b=s2m(e.end);
    if(b>a) t+=b-a;
  });
  return t;
}
/* 手動記錄嘅每日實際溫書時數（分鐘）。冇記錄 = 0。 */
function logMin(ds){
  var v=S.studyLog ? S.studyLog[ds] : 0;
  return (typeof v==='number'&&isFinite(v)&&v>0) ? v : 0;
}
/* ---------- 計時器記錄嘅溫書時段 ---------- */
/* 每段：{id, d:'YYYY-MM-DD', s:'HH:MM', e:'HH:MM', m:實際溫書分鐘} */
function sessOn(ds){
  if(!Array.isArray(S.studySessions)) return [];
  return S.studySessions.filter(function(x){ return x.d===ds; })
    .sort(function(a,b){ return s2m(a.s)-s2m(b.s); });
}
function sessMin(ds){
  return sessOn(ds).reduce(function(t,x){ return t+((x.m>0)?x.m:0); }, 0);
}
function weekSessTotal(mon0){
  var t=0;
  for(var i=0;i<7;i++) t+=sessMin(ymd(addD(mon0,i)));
  return t;
}
/* 由兩個時間戳造一段記錄。跨日就夾到當日 23:59（時數照樣計落開始嗰日）。 */
function makeSession(fromTs,toTs,day,mins){
  var a=new Date(fromTs), b=new Date(toTs);
  var s=p2(a.getHours())+':'+p2(a.getMinutes());
  var e=p2(b.getHours())+':'+p2(b.getMinutes());
  if(ymd(b)!==day || s2m(e)<=s2m(s)) e='23:59';
  if(s2m(e)<=s2m(s)) e=m2s(Math.min(s2m(s)+1,1439));
  return { id:uid(), d:day, s:s, e:e, m:mins };
}
/* ---------- 分科溫書（v41） ----------
   點解要另開一個 studySubj，而唔係將 studyLog 改成 {科目: 分鐘}：
   studyLog 係「每日總數」，已經有好多地方（週達標、月總覽、備份、雲端同步）
   依賴佢係一個 number。改結構會拖冧舊資料同舊備份。所以兩個並行：
     studyLog[day]              = 當日總分鐘（唯一嘅總數來源，唔變）
     studySubj[day][科目]        = 分科拆帳
   舊資料（只有 studyLog、冇 studySubj）一律當「未指定」，唔會消失。
   唔變嘅不變量：sum(studySubj[day]) <= studyLog[day]，差額 = 未指定。 */
function normSubj(s){ return String(s==null?'':s).trim().replace(/\s+/g,' ').slice(0,40); }
var SUBJ_NONE='未指定';
var SUBJ_SCOPE='week';   /* 分科拆帳嘅範圍：'week' | 'all'（只係顯示狀態，唔入 S） */
function subjDayMap(ds){
  var m=S.studySubj ? S.studySubj[ds] : null;
  return (m&&typeof m==='object') ? m : {};
}
/* 加一筆分科時數（計時器記錄時用） */
function subjAdd(ds,subj,mins){
  var m=Math.round(mins);
  if(!(m>0)) return;
  if(!S.studySubj||typeof S.studySubj!=='object') S.studySubj={};
  var day=S.studySubj[ds];
  if(!day||typeof day!=='object'){ day={}; S.studySubj[ds]=day; }
  var k=normSubj(subj)||SUBJ_NONE;
  day[k]=(typeof day[k]==='number'?day[k]:0)+m;
}
/* 當日最主要嘅科目（用嚟預填表單，避免一儲存就抹走計時器標嘅科） */
function daySubj(ds){
  var m=subjDayMap(ds), best='', bn=-1;
  Object.keys(m).forEach(function(k){ if(m[k]>bn){ bn=m[k]; best=k; } });
  return best;
}
/* 某日嘅「有效溫書分鐘」：studyLog 優先，冇就用計時器時段加總。
   兩者唔可以相加 —— stopTimer 會同時寫入兩邊，相加會重複計。 */
function studyMinOfDay(ds){
  var a=logMin(ds);
  return a>0 ? a : sessMin(ds);
}
/* 一組日子嘅分科統計。days = ['YYYY-MM-DD', …]
   回傳 [{name, m, n}]，由多到少；未指定永遠排最後。 */
function subjStatsOf(days){
  var map={}, order=[];
  (days||[]).forEach(function(ds){
    var tagged=0, m=subjDayMap(ds);
    Object.keys(m).forEach(function(k){
      var v=m[k]; if(!(v>0)) return;
      if(!map[k]){ map[k]={name:k,m:0,n:0}; order.push(k); }
      map[k].m+=v; map[k].n++; tagged+=v;
    });
    /* 總數多過分科拆帳嘅部分 → 未指定（舊資料、或者手動填咗冇揀科） */
    var rest=studyMinOfDay(ds)-tagged;
    if(rest>0){
      if(!map[SUBJ_NONE]){ map[SUBJ_NONE]={name:SUBJ_NONE,m:0,n:0}; order.push(SUBJ_NONE); }
      map[SUBJ_NONE].m+=rest; map[SUBJ_NONE].n++;
    }
  });
  order.sort(function(a,b){
    if(a===SUBJ_NONE) return 1;                 /* 未指定一定排最後 */
    if(b===SUBJ_NONE) return -1;
    return map[b].m-map[a].m || (a<b?-1:(a>b?1:0));
  });
  var out=order.map(function(k){ return map[k]; });
  var tot=out.reduce(function(t,x){ return t+x.m; },0);
  return { list:out, total:tot,
           named:out.filter(function(x){ return x.name!==SUBJ_NONE; }).length,
           top:(out.length && out[0].name!==SUBJ_NONE) ? out[0] : null };
}
function weekDays(mon0){
  var a=[];
  for(var i=0;i<7;i++) a.push(ymd(addD(mon0,i)));
  return a;
}
function subjStatsWeek(mon0){ return subjStatsOf(weekDays(mon0)); }
function subjStatsAll(){
  var seen={};
  Object.keys(S.studyLog||{}).forEach(function(k){ seen[k]=1; });
  Object.keys(S.studySubj||{}).forEach(function(k){ seen[k]=1; });
  (S.studySessions||[]).forEach(function(x){ if(x&&x.d) seen[x.d]=1; });
  return subjStatsOf(Object.keys(seen).sort());
}
/* 分科選項：成績頁加過嘅科目 + 課堂代號 + 已經用過嘅科目名，去重排序 */
function subjOptions(){
  var set={}, out=[];
  function push(v){ var k=normSubj(v); if(k && !set[k]){ set[k]=1; out.push(k); } }
  Object.keys(S.grades||{}).forEach(push);
  (S.courses||[]).forEach(function(c){ push(c && c.code); });
  Object.keys(S.studySubj||{}).forEach(function(ds){
    Object.keys(subjDayMap(ds)).forEach(function(k){ if(k!==SUBJ_NONE) push(k); });
  });
  (S.studySessions||[]).forEach(function(x){ if(x&&x.subj) push(x.subj); });
  out.sort(function(a,b){ return a<b?-1:(a>b?1:0); });
  return out;
}
/* ---------- 連續溫書日數 ---------- */
/* 今日仲未溫唔算斷纜（由琴日倒推），否則朝早一開 App 就會見到 0 日。 */
function studyStreak(){
  var GUARD=4000, cur=0;
  var d=todayStr();
  if(studyMinOfDay(d)<=0) d=ymd(addD(new Date(d+'T00:00:00'),-1));
  while(cur<GUARD && studyMinOfDay(d)>0){
    cur++; d=ymd(addD(new Date(d+'T00:00:00'),-1));
  }
  /* 史上最長：將有記錄嘅日子排序，睇最長連續段 */
  var keys={};
  Object.keys(S.studyLog||{}).forEach(function(k){ if(studyMinOfDay(k)>0) keys[k]=1; });
  (S.studySessions||[]).forEach(function(x){ if(x&&x.d&&studyMinOfDay(x.d)>0) keys[x.d]=1; });
  var sorted=Object.keys(keys).sort(), best=0, run=0, prev=null;
  sorted.forEach(function(k){
    run = (prev && k===ymd(addD(new Date(prev+'T00:00:00'),1))) ? run+1 : 1;
    if(run>best) best=run;
    prev=k;
  });
  return { cur:cur, best:Math.max(best,cur) };
}
/* ---------- 非溫書時間記錄（「做過咩」） ---------- */
/* 每段：{id, d:'YYYY-MM-DD', s:'HH:MM', e:'HH:MM', m:分鐘, label:'做咩'} */
function actsOn(ds){

function weekActsTotal(mon0){

/* 本週按「做咩」分組，時數由多到少 */
function weekActsByLabel(mon0){

  for(var i=0;i<7;i++){
    actsOn(ymd(addD(mon0,i))).forEach(function(x){
      var k=x.label||'（冇寫）';
      if(!map[k]){ map[k]={label:k, m:0, n:0}; order.push(k); }
      map[k].m+=((x.m>0)?x.m:0); map[k].n++;
    });
  }
  order.sort(function(a,b){ return map[b].m-map[a].m; });
  return order.map(function(k){ return map[k]; });

/* 兩個 'HH:MM' 之間嘅分鐘（唔可以負數／跨日） */
function spanMin(a,b){
  var x=s2m(a), y=s2m(b);
  return (isFinite(x)&&isFinite(y)&&y>x) ? (y-x) : 0;
}
function weekLogTotal(mon0){
  var t=0;

function weekHasLog(mon0){ return weekLogTotal(mon0)>0 || weekSessTotal(mon0)>0; }
/* 一星期嘅溫書時數 = 課表排定 + 記錄（手動／計時）
   註：計時器記錄嘅時數會同時寫入 studyLog，所以呢度唔可以再加 sessT，否則會重複計。 */
function studyOfWeek(mon0){
  var days=[], sched=[], logs=[], sT=0, lT=0, xT=0;
  for(var i=0;i<7;i++){
    var d=addD(mon0,i), ds=ymd(d);
    var s=schedOfDay(d), l=logMin(ds);
    days.push(s+l); sched.push(s); logs.push(l);
    sT+=s; lT+=l; xT+=sessMin(ds);
  }
  return { days:days, sched:sched, logs:logs, sTot:sT, lTot:lT, sessT:xT,
           total:sT+lT, min:studyMinMin() };
}
function studyPct(tot,min){ return min>0 ? Math.min(100, Math.round(tot/min*100)) : 0; }
function studyCls(tot,min){

function actForm(day, editId, keepMsg){

  var rows=[].slice.call(dlg.querySelectorAll('.lgrow'));

/* ---------- 番茄鐘（v41） ----------
   設計取態：番茄鐘係「喺現有計時器上加一層節奏提示」，唔係另開一套計時。
   階段長度係用 timerElapsed()（即真正計緊嘅毫秒）去度，所以：
     · 暫停／繼續唔會打亂階段
     · 離開 App、鎖屏、熄瀏覽器返嚟，會自動「追返」漏咗嘅階段
   時數記錄方式完全不變 —— 停錶時照樣將本節總分鐘寫入 studyLog，
   所以番茄模式同自由模式記出嚟嘅數係同一種數，統計唔會分岔。 */
var POMO_PHASE={work:'專注',brk:'短休',long:'長休'};
var POMO_DEF={work:25,brk:5,long:15,every:4};
var POMO_FLASH=null, POMO_FLASH_T=null, POMO_CTX=null;
function normPomo(p){
  p=(p&&typeof p==='object')?p:{};
  function num(v,d,lo,hi){ v=+v; return (isFinite(v)&&v>=lo&&v<=hi)?Math.round(v):d; }
  var out={
    on:!!p.on,
    work:num(p.work,POMO_DEF.work,1,180),
    brk:num(p.brk,POMO_DEF.brk,1,60),
    long:num(p.long,POMO_DEF.long,1,120),
    every:num(p.every,POMO_DEF.every,2,12),
    round:(isFinite(+p.round)&&+p.round>0)?Math.floor(+p.round):0,
    phase:(p.phase==='brk'||p.phase==='long')?p.phase:'work',
    base:(isFinite(+p.base)&&+p.base>=0)?+p.base:0,
    ms:(isFinite(+p.ms)&&+p.ms>0)?+p.ms:0
  };
  if(!out.ms) out.ms=pomoLen(out,out.phase)*60000;
  return out;
}
function pomoLen(p,phase){
  if(phase==='brk') return p.brk;
  if(phase==='long') return p.long;
  return p.work;
}
function pomoOn(){ return !!(S.pomo && S.pomo.on); }
function pomoLeft(){
  var p=S.pomo;
  return Math.max(0, p.ms - (timerElapsed()-p.base));
}
function pomoPhaseName(){ return POMO_PHASE[S.pomo.phase] || '專注'; }
function pomoTodayDone(){ return (S.pomoDone && +S.pomoDone[todayStr()]) || 0; }
/* 開始新一節：輪數同階段重設（base 用 timerElapsed 做基準，開頭係 0） */
function pomoReset(){
  var p=S.pomo;
  p.phase='work'; p.round=0; p.base=0; p.ms=p.work*60000;
}
function pomoAdvance(){
  var p=S.pomo;
  if(p.phase==='work'){
    p.round++;
    if(!S.pomoDone||typeof S.pomoDone!=='object') S.pomoDone={};
    var ds=todayStr();
    S.pomoDone[ds]=(typeof S.pomoDone[ds]==='number'?S.pomoDone[ds]:0)+1;
    p.phase=(p.round % p.every===0) ? 'long' : 'brk';
  } else {
    p.phase='work';
  }
  p.ms=pomoLen(p,p.phase)*60000;
}
function pomoFlash(msg){
  POMO_FLASH=msg;
  if(POMO_FLASH_T) clearTimeout(POMO_FLASH_T);
  POMO_FLASH_T=setTimeout(function(){ POMO_FLASH=null; pomoRedraw(); }, 12000);
}
/* 嗶聲用 WebAudio 即時合成，唔使加任何外部檔案（保持單檔 PWA）。
   AudioContext 要喺用家手勢之後先開得聲，所以喺「開始」嗰刻就解鎖。 */
function pomoUnlockAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!POMO_CTX) POMO_CTX=new AC();
    if(POMO_CTX.state==='suspended' && POMO_CTX.resume) POMO_CTX.resume();
  }catch(e){}
}
function pomoBeep(up){
  try{
    if(!POMO_CTX) return;
    if(POMO_CTX.state==='suspended' && POMO_CTX.resume) POMO_CTX.resume();
    var t=POMO_CTX.currentTime;
    var notes = up ? [660,880] : [880,660,880];
    notes.forEach(function(f,i){
      var o=POMO_CTX.createOscillator(), g=POMO_CTX.createGain();
      o.type='sine'; o.frequency.value=f;
      var a=t+i*0.20;
      g.gain.setValueAtTime(0.0001,a);
      g.gain.exponentialRampToValueAtTime(0.20,a+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,a+0.17);
      o.connect(g); g.connect(POMO_CTX.destination);
      o.start(a); o.stop(a+0.19);
    });
  }catch(e){}
}
/* 每次 tick 檢查有冇過階段；過咗就推進（可能一次過補幾段） */
function pomoTick(){
  if(!pomoOn() || !timerRunning()) return false;
  var p=S.pomo, el=timerElapsed(), changed=false, guard=0;
  while(el-p.base>=p.ms && guard<600){
    p.base+=p.ms;
    pomoAdvance();
    changed=true; guard++;
  }
  /* 離開得太久（guard 用盡）就唔再補，直接對齊，免得數字亂跳 */
  if(el-p.base>=p.ms) p.base=el;
  if(changed){
    var toBreak=(p.phase!=='work');
    pomoFlash(toBreak
      ? ('第 '+p.round+' 輪完成，休息 '+pomoLen(p,p.phase)+' 分鐘'+
         (p.phase==='long'?'（長休）':''))
      : '休息完，開始第 '+(p.round+1)+' 輪專注');
    pomoBeep(toBreak);
    save();
    pomoRedraw();
  }
  return changed;
}
var POMO_SIG=null;
function pomoRedraw(){
  var el=document.getElementById('tmPomo');
  if(!el){ POMO_SIG=null; return; }          /* 面板閂咗：下次開返要重畫 */
  if(!pomoOn()){ el.hidden=true; POMO_SIG=null; return; }
  el.hidden=false;
  var p=S.pomo, run=timerRunning();
  /* 每秒 tick 都會行到呢度，所以簽名一樣就唔好再寫 DOM */
  var sig=p.phase+'|'+p.round+'|'+(run?1:0)+'|'+(POMO_FLASH||'')+'|'+
          Math.ceil((run?pomoLeft():p.ms)/1000)+'|'+pomoTodayDone()+'|'+p.every;
  if(sig===POMO_SIG) return;
  POMO_SIG=sig;
  var ph=document.getElementById('pomoPh');
  if(ph){
    ph.textContent=pomoPhaseName();
    ph.className='pomo-ph '+(p.phase==='work'?'work':'rest');
  }
  var lf=document.getElementById('pomoLeft');
  if(lf) lf.textContent = run ? fmtMS(pomoLeft()) : fmtMS(p.ms);
  var dots=document.getElementById('pomoDots');
  if(dots){
    var n=p.every, done=p.round % n;
    if(done===0 && p.round>0 && p.phase!=='work') done=n;   /* 啱啱完成一輪循環 */
    var h='';
    for(var i=0;i<n;i++) h+='<i class="'+(i<done?'on':'')+'"></i>';
    dots.innerHTML=h;
  }
  var sub=document.getElementById('pomoSub');
  if(sub){
    if(POMO_FLASH) sub.innerHTML='<b>'+esc(POMO_FLASH)+'</b>';
    else if(!run) sub.textContent='撳「開始」就入第 1 輪專注　·　'+p.work+'／'+p.brk+' 分鐘'+
      '，每 '+p.every+' 輪長休 '+p.long+' 分鐘';
    else sub.innerHTML='第 <b>'+(p.round+1)+'</b> 輪　·　今日完成 <b>'+pomoTodayDone()+'</b> 輪'+
      (pomoTodayDone()>0?('　·　'+hTxt(pomoTodayDone()*p.work)+' 小時專注'):'');
  }
}
function fmtMS(ms){
  var s=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(s/60)+':'+p2(s%60);
}
function setPomoOn(on){
  S.pomo.on=!!on;
  if(S.pomo.on){
    pomoReset();
    pomoUnlockAudio();
  }
  TM_MSG=null; TM_LAST=null;
  save(); tmBody(); pomoRedraw();
}
function setPomoOpt(k,v){
  var lim={work:[1,180],brk:[1,60],long:[1,120],every:[2,12]}[k];
  if(!lim) return;
  var n=Math.round(+v);
  if(!isFinite(n)) return;
  S.pomo[k]=Math.max(lim[0],Math.min(lim[1],n));
  S.pomo=normPomo(S.pomo);
  if(!timerRunning()){ S.pomo.ms=pomoLen(S.pomo,S.pomo.phase)*60000; }
  save(); pomoRedraw();
}

/* ---------- 溫書計時器 ---------- */
var TIMER_TICK=null, TM_LAST=null, TM_MSG=null;
function timerRunning(){ return typeof S.timerStart==='number' && S.timerStart>0; }
function timerElapsed(){
  var ms=(typeof S.timerAcc==='number'&&S.timerAcc>0)?S.timerAcc:0;
  if(timerRunning()) ms += (Date.now()-S.timerStart);
  return ms>0 ? ms : 0;
}
function timerState(){
  if(timerRunning()) return 'run';
  return timerElapsed()>0 ? 'pause' : 'idle';
}
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  return Math.floor(s/3600)+':'+p2(Math.floor((s%3600)/60))+':'+p2(s%60);
}
function fmtDurCn(ms){
  var m=Math.round(ms/60000);
  if(m<1) return '少於 1 分鐘';
  var h=Math.floor(m/60), r=m%60;
  if(h && r) return h+' 小時 '+r+' 分鐘';
  return h ? h+' 小時' : r+' 分鐘';
}
function tickTimer(on){
  if(TIMER_TICK){ clearInterval(TIMER_TICK); TIMER_TICK=null; }
  if(on) TIMER_TICK=setInterval(renderTimer,1000);
}
function startTimer(){
  TM_MSG=null;
  S.timerAcc=0; S.timerStart=Date.now(); S.timerFrom=S.timerStart; S.timerDay=todayStr();
  if(pomoOn()){ pomoReset(); pomoUnlockAudio(); }   /* 新一節 = 由第 1 輪專注重新開始 */
  save(); tickTimer(true); tmBody();
}
function pauseTimer(){
  if(!timerRunning()) return;
  S.timerAcc=timerElapsed(); S.timerStart=null;
  save(); tickTimer(false); tmBody();
}
function resumeTimer(){
  if(timerRunning()) return;
  S.timerStart=Date.now();
  save(); tickTimer(true); tmBody();
}
/* record=false 就係「丟棄」，唔入數 */
function stopTimer(record){
  var ms=timerElapsed(), day=S.timerDay||todayStr(), mins=Math.round(ms/60000);
  var from=(typeof S.timerFrom==='number'&&S.timerFrom>0) ? S.timerFrom : (Date.now()-ms);
  var ok=false, sess=null;
  /* 計時器離開 App 都照跑（用時間戳），所以好易唔覺意跑咗好耐。
     超過 16 個鐘就先問清楚，免得污染統計。 */
  if(record && mins>=1 && ms > 16*3600*1000){
    if(!confirm('⚠️ 今次計時已經跑咗 '+fmtDurCn(ms)+'（由 '+ds2cn(day)+' 開始）。\n\n'+
                '撳「確定」＝ 照樣記錄落 '+ds2cn(day)+'\n'+
                '撳「取消」＝ 丟棄今次，唔入數')) record=false;
  }
  if(record && mins>=1){
    if(!S.studyLog) S.studyLog={};
    S.studyLog[day]=logMin(day)+mins;          /* 加落嗰日嘅溫書時數 */
    if(!Array.isArray(S.studySessions)) S.studySessions=[];
    sess=makeSession(from,Date.now(),day,mins);
    /* 分科：session 記住科目（週視圖／之後改科都用得返），
       同時寫入 studySubj 拆帳。冇揀科就入「未指定」。 */
    sess.subj=normSubj(S.timerSubj)||SUBJ_NONE;
    subjAdd(day,sess.subj,mins);
    S.studySessions.push(sess);                /* 同時記低實際時段，週視圖會畫返出嚟 */
    ok=true;
  }
  S.timerStart=null; S.timerAcc=0; S.timerDay=null; S.timerFrom=null;
  tickTimer(false);
  TM_MSG = record
    ? (ok ? '已記錄 <b>'+fmtDurCn(ms)+'</b><br>'+
            '<span class="tmsub">'+sess.s+'–'+sess.e+
            (sess.subj && sess.subj!==SUBJ_NONE ? '　·　'+esc(sess.subj) : '')+
            '　週視圖已加咗一段溫書 block<br>'+
            ds2cn(day)+' 而家合計 '+hTxt(logMin(day))+' 小時</span>'
          : '今次唔夠 1 分鐘，冇記錄。')
    : '已丟棄，冇記錄。';
  save(); refreshAll(); tmBody();
}
/* 科目下拉：未指定 + 成績頁科目 + 課堂代號 + 用過嘅科目名 */
function subjOptHtml(){
  var cur=normSubj(S.timerSubj), opts=subjOptions();
  if(cur && cur!==SUBJ_NONE && opts.indexOf(cur)<0) opts.push(cur);
  opts.sort(function(a,b){ return a<b?-1:(a>b?1:0); });
  var h='<option value=""'+(cur?'':' selected')+'>未指定</option>';
  opts.forEach(function(s){
    h+='<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  return h;
}

function tmButtons(){
  var box=document.getElementById('tmBtns'); if(!box) return;
  var st=timerState(), h='';
  if(TM_MSG){
    h='<button class="btn pri" id="tmStart">再開始</button>';
  } else if(st==='idle'){
    h='<button class="btn pri" id="tmStart">開始</button>';
  } else if(st==='run'){
    h='<button class="btn" id="tmPause">暫停</button>'+
      '<button class="btn pri" id="tmStop">結束並記錄</button>';
  } else {
    h='<button class="btn pri" id="tmResume">繼續</button>'+
      '<button class="btn" id="tmStop">結束並記錄</button>'+
      '<button class="btn" id="tmDrop">丟棄</button>';
  }
  box.innerHTML=h;
  function on(id,fn){ var e=document.getElementById(id); if(e) e.addEventListener('click',fn); }
  on('tmStart',function(){ TM_MSG=null; startTimer(); });
  on('tmPause',pauseTimer);
  on('tmResume',resumeTimer);
  on('tmStop',function(){ stopTimer(true); });
  on('tmDrop',function(){ if(confirm('丟棄今次計時？唔會記錄。')) stopTimer(false); });
}
function renderTimer(){
  pomoTick();                       /* 先檢查階段有冇過，可能已經推進／發通知 */
  var st=timerState(), ms=timerElapsed();
  var b=document.getElementById('btnTimer');
  if(b){
    /* 取至最近分鐘（唔跳秒），一眼睇到跑咗幾耐；
       番茄模式就改為顯示「階段 + 剩餘」，因為倒數才係重點。 */
    if(st==='run'){
      b.textContent = pomoOn() ? (pomoPhaseName()+' '+fmtMS(pomoLeft())) : ('⏱ '+fmtMin(ms));
      b.classList.add('rec');
    }
    else { b.textContent='溫書計時'; b.classList.remove('rec'); }
  }
  var c=document.getElementById('tmClock');
  syncTitle(); syncBadge();   /* 面板閂咗都要更新：每秒 tick 都會行到呢度 */
  pomoRedraw();
  if(!c){ TM_LAST=null; return; }
  c.textContent=fmtClock(ms);
  c.className='tmclock '+(st==='run'?'run':st==='pause'?'pause':'');
  var s=document.getElementById('tmState');
  if(s) s.textContent = st==='run' ? '計時中…' : (st==='pause' ? '已暫停' : '未開始');
  var sc=document.getElementById('tmSince');
  if(sc){
    if(st==='run'){
      var t0=new Date((typeof S.timerFrom==='number'&&S.timerFrom>0)?S.timerFrom:S.timerStart);
      sc.innerHTML='由 <b>'+p2(t0.getHours())+':'+p2(t0.getMinutes())+'</b> 開始　·　'+
        '本節 <b>'+fmtMinCn(ms)+'</b>　·　今日已溫 <b>'+hTxt(todayStudyMin())+' 小時</b>'+
        (pomoOn() ? '<br>番茄：<b>'+pomoPhaseName()+'</b> 仲有 <b>'+fmtMS(pomoLeft())+
                    '</b>（第 '+(S.pomo.round+1)+' 輪）' : '')+
        '<br>離開 App、鎖屏、熄咗瀏覽器都照計';
    } else if(st==='pause'){
      sc.textContent='已暫停，撳「繼續」再計';
    } else {
      sc.textContent='';
    }
  }
  if(TM_LAST!==st){ TM_LAST=st; tmButtons(); }
}
/* ---------- 「通知面」：App 圖示角標 + 分頁標題 ----------
   網頁 App 冇得放常駐通知落系統通知欄（嗰個要原生 foreground service /
   Live Activity）。最接近嘅係：(1) App 圖示角標（iOS/iPadOS 16.4+ 主畫面
   Web App、Android Chrome、桌面 Chrome/Edge 都支援）；(2) 分頁標題。
   兩個都一律「取至最近分鐘」。 */
var BADGE_LAST=null, TITLE_LAST=null;
function toMin(ms){ return Math.max(0,Math.round((ms||0)/60000)); }   /* 取至最近分鐘 */
/* 45000 → '0:45'、2 小時 15 分 → '2:15' */
function fmtMin(ms){
  var m=toMin(ms);
  return Math.floor(m/60)+':'+p2(m%60);
}
/* 分鐘 → '1 小時 30 分' / '45 分鐘' / '2 小時' */
function minCn(min){
  var m=Math.max(0,Math.round(min||0));
  if(m<1) return '少於 1 分鐘';
  var h=Math.floor(m/60), r=m%60;
  if(h && r) return h+' 小時 '+r+' 分';
  return h ? h+' 小時' : r+' 分鐘';
}
function fmtMinCn(ms){ return minCn(toMin(ms)); }
/* 今日溫書分鐘（含正在跑嘅本節；跨日就唔計入今日） */
function todayStudyMin(){
  var t=logMin(todayStr());
  if(timerRunning() && (S.timerDay||todayStr())===todayStr())
    t += Math.round(timerElapsed()/60000);
  return t;
}
function normBadge(m){ return (m==='off'||m==='day') ? m : 'sess'; }
function badgeMode(){ return normBadge(S.badgeMode); }
function badgeMins(){
  var m=badgeMode();
  if(m==='off') return 0;
  if(m==='day') return todayStudyMin();
  return timerRunning() ? toMin(timerElapsed()) : 0;
}
function syncBadge(){
  var n=badgeMins();
  if(n===BADGE_LAST) return;
  BADGE_LAST=n;
  try{
    if(n>0){ if(navigator.setAppBadge) navigator.setAppBadge(n); }
    else if(navigator.clearAppBadge) navigator.clearAppBadge();
  }catch(e){}
}
function syncTitle(){
  var base=S.title+' · '+termName();
  if(timerRunning()){
    base=(pomoOn()
      ? (pomoPhaseName()+' '+fmtMS(pomoLeft()))
      : ('⏱ '+fmtMin(timerElapsed())))
      +'　今日 '+hTxt(todayStudyMin())+' 小時　·　'+base;
  }
  if(base!==TITLE_LAST){ TITLE_LAST=base; document.title=base; }
}
function setBadgeMode(m){
  S.badgeMode=normBadge(m);
  BADGE_LAST=null;
  syncBadge(); save();
}

/* ================= 週視圖 ================= */
var wkhead=document.getElementById('wkhead'), timesEl=document.getElementById('times'),
    colsEl=document.getElementById('cols'), wlbl=document.getElementById('wlbl');

function drawWeek(){
  PXH = pxh();
  var R = dayRange();
  DAY_FROM = R.from; DAY_TO = R.to;
  var mon0=curMon();
  wlbl.innerHTML='第 '+(S.weekIdx+1)+' 週<small>'+md(mon0)+' – '+md(addD(mon0,6))+'</small>';

  var h='<div class="gut"></div>';
  for(var i=0;i<7;i++){
    var d=addD(mon0,i);
    var cls=(i>=5?'wk ':'')+(isToday(d)?'today':'');
    var ntd=todosOn(ymd(d)).length;
    h+='<div class="dh '+cls+'"><b>'+DOW[i]+'</b><span>'+md(d)+'</span>'+
       (ntd?'<span class="dh-todo">'+ntd+' 待辦</span>':'')+'</div>';
  }
  wkhead.innerHTML=h;
  drawStudy(mon0);
  drawActs(mon0);
  drawWeekTodos(mon0);

  var total=(DAY_TO-DAY_FROM)*PXH, t='';
  for(var m=DAY_FROM*60;m<=DAY_TO*60;m+=60){
    var tf=(m===DAY_FROM*60)?'translateY(0)':(m===DAY_TO*60)?'translateY(-100%)':'translateY(-50%)';
    t+='<div class="t" style="top:'+((m-DAY_FROM*60)/60*PXH)+'px;transform:'+tf+'">'+m2s(m)+'</div>';
  }
  timesEl.style.height=total+'px'; timesEl.innerHTML=t;

  colsEl.innerHTML=''; colsEl.style.height=total+'px';
  var nBlocks=0;
  for(var c=0;c<7;c++){
    var day=addD(mon0,c);
    var col=document.createElement('div');
    col.className='col '+(c>=5?'wk ':'')+(isToday(day)?'today':'');
    col.dataset.date=ymd(day);   /* 全域搜尋跳過嚟嘅時候，要用嚟 flash 嗰一日 */

    var hr='';
    for(var m2=DAY_FROM*60;m2<=DAY_TO*60;m2+=30){
      hr+='<div class="hr'+(m2%60?' half':'')+'" style="top:'+((m2-DAY_FROM*60)/60*PXH)+'px"></div>';
    }
    col.innerHTML=hr;

    layout(evOn(day)).forEach(function(it){
      var e=it.e, p=PAL[evColor(e)]||PAL.gray;
      var top=(s2m(e.start)-DAY_FROM*60)/60*PXH;
      var hgt=Math.max((s2m(e.end)-s2m(e.start))/60*PXH,24);
      var w=100/it.lanes, left=it.lane*w;
      var cls='blk';
      if(e.tag==='exam') cls+=' exam';
      else if(e.tag==='study') cls+=' study';
      else if(e.tag==='sess') cls+=' sess';
      else if(e.tag==='act') cls+=' act';
      else if(e.kind==='oneoff') cls+=' oneoff';
      var b=document.createElement('div');
      b.className=cls;
      b.style.cssText='top:'+top+'px;height:'+hgt+'px;width:calc('+w+'% - 6px);'+
        'left:calc('+left+'% + 3px);background:'+p.bg+';border-color:'+p.bd+';color:'+p.tx;
      b.innerHTML='<b>'+iconHtml(e.code)+esc(e.code)+'</b>'+(e.sec?'<i>'+esc(e.sec)+'</i>':'')+
        '<em>'+e.start+'–'+e.end+
        (e.kind==='session'||e.kind==='act'
          ? ' · '+hTxt(e.src&&e.src.m)+' 小時'
          : (e.room?' · '+esc(e.room):''))+
        '</em>';
      b.dataset.id=e.id; b.dataset.kind=e.kind; b.dataset.date=e.date;
      b.addEventListener('click',function(){ openEvent(this.dataset); });
      col.appendChild(b); nBlocks++;
    });

    if(isToday(day)){
      var n=new Date(), nm=n.getHours()*60+n.getMinutes();
      if(nm>=DAY_FROM*60&&nm<=DAY_TO*60){
        var nl=document.createElement('div'); nl.className='nowline';
        nl.style.top=((nm-DAY_FROM*60)/60*PXH)+'px'; col.appendChild(nl);
      }
    }
    colsEl.appendChild(col);
  }
  document.getElementById('emptyMsg').hidden = nBlocks>0;
}

/* 本週待辦條：列出本週（週一至週日）所有未完成待辦，連倒數天數 */
function drawWeekTodos(mon0){
  var box=document.getElementById('wkTodo');
  if(!box) return;
  var items=[];
  for(var i=0;i<7;i++){
    var ds=ymd(addD(mon0,i));
    todosOn(ds).forEach(function(t){ items.push({t:t, ds:ds, i:i}); });
  }
  if(!items.length){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  var h='<span class="wkt-h">本週待辦</span><span class="wkt-n">'+items.length+'</span><div class="wkt-list">';
  items.forEach(function(x){
    var n=cdDayDiff(x.ds);
    var lbl=(n<0?'已過 '+Math.abs(n)+' 天':(n===0?'今天':n+' 天'));
    var cls=(n<0?'late':(n===0?'today':(n<=3?'soon':'')));
    h+='<button class="wkt-chip '+cls+'" data-id="'+x.t.id+'" title="'+esc(x.t.text)+'">'+
         '<b>'+DOW[x.i]+'</b><span class="wkt-t">'+esc(x.t.text)+'</span>'+
         '<i class="tdcd '+cls+'">'+lbl+'</i></button>';
  });
  box.innerHTML=h+'</div>';
}
/* 點「本週待辦」標籤 → 跳去待辦頁並高亮該項 */
document.getElementById('wkTodo').addEventListener('click',function(e){
  var b=e.target.closest('.wkt-chip'); if(!b) return;
  setView('todo');

  row.classList.add('flash');
  if(row.scrollIntoView) row.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(function(){ row.classList.remove('flash'); },1800);
});

function layout(evs){
  evs.sort(function(a,b){ return s2m(a.start)-s2m(b.start)||s2m(a.end)-s2m(b.end); });
  var out=[], group=[], gEnd=-1;
  function flush(){
    if(!group.length) return;
    var start=out.length, laneEnd=[];
    group.forEach(function(e){
      var s=s2m(e.start), en=s2m(e.end), L=-1;
      for(var i=0;i<laneEnd.length;i++){ if(laneEnd[i]<=s){ L=i; break; } }
      if(L<0) L=laneEnd.length;
      laneEnd[L]=en; out.push({e:e,lane:L,lanes:0});
    });
    var n=laneEnd.length;
    for(var i=start;i<out.length;i++) out[i].lanes=n;
    group=[];
  }
  evs.forEach(function(e){
    var s=s2m(e.start);
    if(group.length&&s>=gEnd){ flush(); gEnd=-1; }
    group.push(e); gEnd=Math.max(gEnd,s2m(e.end));
  });
  flush();
  return out;
}

/* ================= 待辦清單 ================= */
function dueClass(t){
  if(!t.due||t.done) return '';
  var d=t.due, td=todayStr();
  if(d<td) return 'due-late';
  if(d===td) return 'due-soon';
  var diff=(new Date(d+'T00:00:00')-new Date(td+'T00:00:00'))/864e5;
  return diff<=3 ? 'due-soon' : '';
}
/* ---------- 待辦優先次序 ----------
   排序分數越細越先做。唔止按日期，仲會考慮：
   · 已經逾期 → 一定要浮上面（而且逾期越耐越前）
   · 今日到期 → 其次
   · 未來 7 天 → 按日子排
   · 冇截止日 → 沉底（但喺組內按「幾時加」排，舊嘅先）
   另加一個「急」旗標：逾期／今日到期自動當急，用戶亦可以自己釘住。 */
function todoUrgent(t){
  if(t.done) return false;
  if(t.pin) return true;
  if(!t.due) return false;
  return t.due<=todayStr();      /* 逾期或者今日到期 */
}
/* 分數：細 = 先做。加減都用整數，避免浮點比較嘅不確定。 */
function todoScore(t){
  var td=todayStr();
  if(t.done) return 900000;                      /* 已完成永遠沉底 */
  if(!t.due) return 800000 + (+t.added||0)/1e6;   /* 冇截止日：按加入次序 */
  var diff=cdDayDiff(t.due);                      /* 負 = 已過 */
  if(diff<0)  return 1000 + diff;                 /* 越逾得耐越細 → 越前 */
  if(diff===0) return 2000;
  if(diff<=3)  return 3000 + diff;
  if(diff<=7)  return 4000 + diff;
  return 5000 + diff;                             /* 之後：按日子 */
}
function todoSortList(arr){
  return arr.slice().sort(function(a,b){
    var d=todoScore(a)-todoScore(b);
    if(d) return d;
    return String(a.text||'').localeCompare(String(b.text||''));
  });
}
/* 一鍵延期：+1 日／+1 週。
   兩個唔同情況要分清楚：
   · 本來有截止日（而且未過）→ 由原本嗰日再推後，唔會縮短。
   · 本來冇截止日或者已經過期 → 由「今日」起算。
   · days === 0 特別處理：直接設做今日（無日期項目嗰粒「今日」掣就用呢個）。 */
function todoSnooze(t, days){
  if(days===0){ t.due=todayStr(); return; }
  var base=(t.due && t.due>=todayStr()) ? t.due : todayStr();
  var d=addD(new Date(base+'T00:00:00'), days);
  t.due=ymd(d);
}
/* 待辦剩餘天數標籤（倒數） */
function todoCd(t){
  if(!t.due||t.done) return '';
  var n=cdDayDiff(t.due);
  var num,cls;
  if(n<0){ num='已過 '+Math.abs(n)+' 天'; cls='late'; }
  else if(n===0){ num='今天'; cls='today'; }
  else { num=n+' 天'; cls=n<=3?'soon':''; }
  return '<span class="tdcd '+cls+'">'+num+'</span>';
}
function drawTodo(){
  var box=document.getElementById('todoBody');
  var td=todayStr();
  var weekEnd=ymd(addD(new Date(td+'T00:00:00'),6));
  var open=S.todos.filter(function(t){ return !t.done; });
  var done=S.todos.filter(function(t){ return t.done; });

  /* 統計 */
  var late=open.filter(function(t){ return t.due && t.due<td; }).length;
  var dueToday=open.filter(function(t){ return t.due===td; }).length;
  var st=document.getElementById('todoStat');
  if(!S.todos.length) st.textContent='還沒有待辦事項';
  else st.textContent=open.length+' 項未完成'+
    (late?'　·　'+late+' 項已逾期':'')+(dueToday?'　·　'+dueToday+' 項今日到期':'')+
    '　·　已完成 '+done.length+' / '+S.todos.length;

  var bar=document.getElementById('tdBar');
  bar.style.width = S.todos.length ? Math.round(done.length/S.todos.length*100)+'%' : '0%';

  /* 徽章 */
  var badge=document.getElementById('todoBadge');
  var urgent=open.filter(function(t){ return t.due && t.due<=weekEnd; }).length;
  badge.hidden = open.length===0;
  badge.textContent = urgent>0 ? urgent : open.length;

  if(!S.todos.length){
    box.innerHTML='<div class="tdempty"><b>還沒有待辦事項</b>'+
      '在上面的欄位輸入內容，可選擇截止日，按 Enter 或「新增」<br>'+
      '有截止日的項目，會自動在時間表的日期上顯示紅色標記</div>';
    return;
  }

  /* 分組：唔再淨係按日期硬切，而係跟 todoScore 排好之後再分組，
     咁「急」嘅嘢（逾期 + 今日到期 + 自己釘住）先至真正浮到最上。 */
  var openSorted=todoSortList(open);
  var gUrg=openSorted.filter(function(t){ return todoUrgent(t); });
  var gRest=openSorted.filter(function(t){ return !todoUrgent(t); });

  function row(t){
    var dc=dueClass(t);
    var urgent=todoUrgent(t);
    var snooze = t.due
      ? '<button class="snz" data-act="snooze" data-d="1" title="延後 1 日">+1日</button>'+
        '<button class="snz" data-act="snooze" data-d="7" title="延後 1 週">+1週</button>'
      : '<button class="snz" data-act="snooze" data-d="0" title="設做今日">今日</button>';
    return '<div class="tdrow'+(t.done?' done':'')+(urgent?' urg':'')+'" data-id="'+t.id+'">'+
      '<input type="checkbox" data-act="toggle"'+(t.done?' checked':'')+'>'+
      '<span class="txt" contenteditable="true" spellcheck="false" data-act="text">'+esc(t.text)+'</span>'+
      '<input type="date" class="'+dc+'" value="'+(t.due||'')+'" data-act="due">'+
      todoCd(t)+
      snooze+
      '<button class="pin'+(t.pin?' on':'')+'" data-act="pin" title="'+
        (t.pin?'取消釘住':'釘住（當佢最緊要）')+'">'+(t.pin?'★':'☆')+'</button>'+
      '<button class="del" data-act="del" title="刪除">✕</button></div>';
  }
  function sec(title,arr,cls){
    if(!arr.length) return '';
    return '<div class="tsec '+(cls||'')+'">'+title+'<span class="n">'+arr.length+'</span></div>'+
           arr.map(row).join('');
  }
  /* 已完成：按「幾時完成／加入」倒序，最近完成嘅最上 */
  var doneSorted=done.slice().sort(function(a,b){
    var x=(+b.doneAt)||(+b.added)||0, y=(+a.doneAt)||(+a.added)||0;
    return x-y;
  });
  box.innerHTML =
    sec('要即刻做', gUrg, 'late') +
    sec('跟住做', gRest) +
    sec('已完成', doneSorted);
}

/* ================= 截止倒數 ================= */
var DLTAGS = { assignment:'作業', project:'報告／專題', exam:'考試', quiz:'小測', todo:'待辦', other:'其他' };

/* 距離今天幾個曆日（負數＝已過） */
function cdDayDiff(dateStr){
  var t=new Date(); t.setHours(0,0,0,0);
  var d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return 0;
  return Math.round((d-t)/864e5);
}
/* 截止時刻的時間戳；冇填時間就當日 23:59 */
function cdTargetTs(dateStr,timeStr){
  var d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return NaN;
  var a=String(timeStr||'').split(':');
  var h=parseInt(a[0],10), m=parseInt(a[1],10);
  if(isNaN(h)||isNaN(m)){ h=23; m=59; }
  d.setHours(h,m,0,0);
  return d.getTime();
}
function fmtDur(ms){
  var s=Math.floor(ms/1000);
  var d=Math.floor(s/86400); s-=d*86400;
  var h=Math.floor(s/3600);  s-=h*3600;
  var m=Math.floor(s/60);    s-=m*60;
  return (d>0?d+' 天 ':'')+p2(h)+':'+p2(m)+':'+p2(s);
}
function cdDateLbl(s){
  var d=new Date(s+'T00:00:00');
  return isNaN(d.getTime())?ds2cn(s):(DOW[dow1(d)-1]+' '+ds2cn(s));
}
/* 匯集所有截止來源：自訂截止日 + 考試（單次活動）＋ 有截止日的待辦 */
function allDeadlines(){
  var out=[];
  S.deadlines.forEach(function(d){
    out.push({ id:d.id, kind:'dl', name:d.name||'(未命名)', date:d.date, time:d.time||'',
               note:d.note||'', tag:d.tag||'other', ref:d });
  });
  S.oneOff.forEach(function(o){
    if((o.tag||'')!=='exam') return;
    out.push({ id:o.id, kind:'exam', name:o.code+(o.sec?' '+o.sec:''), date:o.date,
               time:o.start||'', note:o.room||'', tag:'exam', ref:o });
  });
  S.todos.forEach(function(t){
    if(!t.due||t.done) return;
    out.push({ id:t.id, kind:'todo', name:t.text, date:t.due, time:'',
               note:'', tag:'todo', ref:t });
  });
  return out;
}
function cdUrg(n){
  if(n<0) return 'past';
  if(n===0) return 'today';
  if(n<=3) return 'soon';
  if(n<=7) return 'week';
  return 'later';
}

function drawCountdown(){
  var hero=document.getElementById('cdHero');
  var box=document.getElementById('cdList');
  if(!box) return;

  var items=allDeadlines().map(function(x){
    return { d:x, ts:cdTargetTs(x.date,x.time), n:cdDayDiff(x.date) };
  });
  items.sort(function(a,b){ return a.ts-b.ts; });

  var late=items.filter(function(x){ return x.n<0; }).length;
  var future=items.length-late;
  var n7=items.filter(function(x){ return x.n>=0 && x.n<=7; }).length;

  var st=document.getElementById('cdStat');
  if(!items.length) st.textContent='還沒有截止日';
  else{
    var next=items.filter(function(x){ return x.n>=0; })[0];
    st.textContent=future+' 個即將到來'+(late?'　·　'+late+' 個已逾期':'')+
      (next?'　·　最近：'+(next.n===0?'今天':next.n+' 天後'):'');
  }

  var badge=document.getElementById('cdBadge');
  if(badge){ badge.hidden=n7===0; badge.textContent=n7; }

  if(!items.length){
    hero.hidden=true; hero.innerHTML='';
    box.innerHTML='<div class="cdempty"><b>還沒有截止日</b>'+
      '按「＋ 新增截止日」加入作業、報告、考試等<br>'+
      '待辦事項若有填截止日，亦會自動顯示在這裡</div>';
    return;
  }

  /* 主視覺：最近一個未過期；若全部已過，顯示最接近現在的一個 */
  var up=items.filter(function(x){ return x.n>=0; });
  var hi=up.length?up[0]:items[items.length-1];
  hero.hidden=false;
  hero.className='cdhero '+(hi.n<0?'past':(hi.n===0?'today':''));
  hero.dataset.ts=hi.ts; hero.dataset.date=hi.d.date;
  hero.innerHTML=
    '<div class="cdh-left">'+
      '<span class="cdh-tag">'+(DLTAGS[hi.d.tag]||DLTAGS.other)+'</span>'+
      '<b class="cdh-name">'+esc(hi.d.name)+'</b>'+
      '<span class="cdh-date">'+cdDateLbl(hi.d.date)+(hi.d.time?' · '+hi.d.time:'')+
        (hi.d.note?'　'+esc(hi.d.note):'')+'</span>'+
    '</div>'+
    '<div class="cdh-right">'+
      '<span class="cdh-lead" id="cdLead"></span>'+
      '<span class="cdh-num" id="cdNum"></span><span class="cdh-unit" id="cdUnit">天</span>'+
      '<span class="cdh-live" id="cdLive"></span>'+
    '</div>';
  tickHero();

  function row(x){
    var u=cdUrg(x.n);
    var num,unit;
    if(x.n>0){ num=x.n; unit='天'; }
    else if(x.n===0){ num='今天'; unit=''; }
    else { num=Math.abs(x.n); unit='天'; }
    var acts;
    if(x.d.kind==='dl'){
      acts='<button data-act="edl" data-id="'+x.d.id+'">編輯</button>'+
           '<button class="del" data-act="ddl" data-id="'+x.d.id+'">刪除</button>';
    }else if(x.d.kind==='exam'){ acts='<span class="cdsrc">來自考試</span>'; }
    else{ acts='<span class="cdsrc">來自待辦</span>'; }
    return '<div class="cdrow '+u+'" data-kind="'+x.d.kind+'" data-id="'+x.d.id+'">'+
      '<div class="cdbox"><b>'+num+'</b>'+(unit?'<span>'+unit+'</span>':'')+'</div>'+
      '<div class="cdinfo"><b>'+esc(x.d.name)+'</b>'+
        '<span>'+cdDateLbl(x.d.date)+(x.d.time?' · '+x.d.time:'')+
        (x.d.note?' · '+esc(x.d.note):'')+'</span></div>'+
      '<span class="cdtag t-'+x.d.tag+'">'+(DLTAGS[x.d.tag]||DLTAGS.other)+'</span>'+
      '<div class="cdacts">'+acts+'</div></div>';
  }
  function sec(title,arr,cls){
    if(!arr.length) return '';
    return '<div class="cdsec '+(cls||'')+'">'+title+'<span class="n">'+arr.length+'</span></div>'+
           arr.map(row).join('');
  }
  box.innerHTML =
    sec('已逾期', items.filter(function(x){return x.n<0;}), 'late') +
    sec('今天',   items.filter(function(x){return x.n===0;})) +
    sec('未來 7 天', items.filter(function(x){return x.n>0&&x.n<=7;})) +
    sec('之後',   items.filter(function(x){return x.n>7;}));
}

/* 每秒更新主視覺倒數（只有倒數頁顯示時） */
function tickHero(){
  var hero=document.getElementById('cdHero');
  if(!hero||hero.hidden) return;
  var ts=+hero.dataset.ts; if(!ts||isNaN(ts)) return;
  var numEl=document.getElementById('cdNum'), unitEl=document.getElementById('cdUnit'),
      leadEl=document.getElementById('cdLead'), liveEl=document.getElementById('cdLive');
  if(!numEl) return;
  var n=cdDayDiff(hero.dataset.date);
  if(n>0){ leadEl.hidden=false; leadEl.textContent='還有'; numEl.textContent=n; unitEl.hidden=false; }
  else if(n===0){ leadEl.hidden=true; leadEl.textContent=''; numEl.textContent='今天'; unitEl.hidden=true; }
  else { leadEl.hidden=false; leadEl.textContent='已過'; numEl.textContent=Math.abs(n); unitEl.hidden=false; }
  var diff=ts-Date.now();
  if(Math.abs(diff)<=2*864e5){
    liveEl.hidden=false;
    liveEl.textContent=(diff>=0?'剩 ':'已過 ')+fmtDur(Math.abs(diff));
  }else{ liveEl.hidden=true; liveEl.textContent=''; }
}

document.getElementById('cdList').addEventListener('click',function(e){

/* ================= GPA 計算機 ================= */
/* Grade point 制：A+ = 4.3 … F = 0（對應 GRADES 次序） */
var DEF_GPA = [4.3, 4.0, 3.7, 3.3, 3.0, 2.7, 2.3, 2.0, 1.7, 1.0, 0];
var GPA_EXTRA = ['P','PP'];   /* 及格等級，唔計入 GPA */

function gpaScale(){
  return (Array.isArray(S.gpaScale) && S.gpaScale.length===GRADES.length) ? S.gpaScale : DEF_GPA;
}
function gpOf(g){
  var i = GRADES.indexOf(g);
  return i<0 ? null : gpaScale()[i];
}
function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '0';
  var r = Math.round(n*100)/100;
  return String(r);
}
/* GPA = Σ(點數 × 學分) ÷ Σ學分；未評分／P／PP 唔計入 */
function gpaCalc(){
  var credits=0, points=0, graded=0, excluded=0, rows=S.gpa||[];
  rows.forEach(function(r){
    var cr = parseFloat(r.credits);
    if(isNaN(cr)||cr<0) cr=0;
    var gp = gpOf(r.grade);          /* 只有 A+ … F 先有分；P／PP／未評分 → null */
    if(gp===null){ excluded++; return; }
    credits += cr; points += gp*cr; graded++;
  });
  return { gpa:(credits>0?points/credits:null), credits:credits, graded:graded,
           excluded:excluded, total:rows.length };
}
function gpaSumHtml(c){
  return '<div class="gpa-big'+(c.gpa===null?' none':'')+'">'+
      '<b>'+(c.gpa===null?'—':c.gpa.toFixed(2))+'</b><small>GPA</small></div>'+
    '<div class="gpa-meta">'+
      '<span><b>'+fmtNum(c.credits)+'</b>計入學分</span>'+
      '<span><b>'+c.graded+'</b>已評分</span>'+
      '<span><b>'+c.excluded+'</b>未評分／不計</span>'+
    '</div>';
}
function gpaStatText(c){
  if(!S.gpa.length) return '還沒有課程';
  return c.graded+' 科已評分'+(c.excluded?'　·　'+c.excluded+' 科未評分／不計':'')+
         '　·　計入 '+fmtNum(c.credits)+' 學分';
}
function updateGpaSummary(){
  var sum=document.getElementById('gpaSum');
  var c=gpaCalc();
  if(sum) sum.innerHTML=gpaSumHtml(c);
  var st=document.getElementById('gpaStat');
  if(st) st.textContent=gpaStatText(c);
}
function gpaRowHtml(r,i){
  var gp = r.grade ? gpOf(r.grade) : null;

    '<input class="gr-code" value="'+esc(r.code)+'" placeholder="課程代號 / 名稱">'+

    '<select class="gr-grade">'+

      GRADES.map(function(g){ return '<option value="'+g+'"'+(r.grade===g?' selected':'')+'>'+g+'</option>'; }).join('')+
      GPA_EXTRA.map(function(g){ return '<option value="'+g+'"'+(r.grade===g?' selected':'')+'>'+g+'（不計）</option>'; }).join('')+
    '</select>'+

var IDB_NAME='timetable-diary-v1', IDB_STORE='photos', idb=null, idbReady=false;
function idbOpen(){
  try{
    if(!window.indexedDB) return;
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'});
    };
    req.onsuccess=function(e){ idb=e.target.result; idbReady=true; drawDiary(); };
    req.onerror=function(){};
  }catch(e){}
}
function idbPut(rec,cb){
  if(!idbReady){ if(cb) cb(false); return; }
  try{
    var tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(rec);
    tx.oncomplete=function(){ if(cb) cb(true); };
    tx.onerror=function(){ if(cb) cb(false); };
    tx.onabort=function(){ if(cb) cb(false); };
  }catch(e){ if(cb) cb(false); }
}
function idbGet(id,cb){
  if(!idbReady){ cb(null); return; }
  try{
    var r=idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(id);
    r.onsuccess=function(){ cb(r.result||null); };
    r.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbDel(id){
  if(!idbReady) return;
  try{ idb.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(id); }catch(e){}
}
function idbClear(cb){
  if(!idbReady){ if(cb) cb(false); return; }
  try{
    var tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete=function(){ if(cb) cb(true); };
    tx.onerror=function(){ if(cb) cb(false); };
    tx.onabort=function(){ if(cb) cb(false); };
  }catch(e){ if(cb) cb(false); }
}
