/* ================= GPA 計算機 ================= */
/* Grade point 制：A+ = 4.3 … F = 0（對應 GRADES 次序） */
var DEF_GPA = [4.3, 4.0, 3.7, 3.3, 3.0, 2.7, 2.3, 2.0, 1.7, 1.0, 0];
var GPA_EXTRA = ['P','PP'];   /* 及格等級，唔計入 GPA */

function gpaScale(){
  return (Array.isArray(S.gpaScale) && S.gpaScale.length===GRADES.length) ? S.gpaScale : DEF_GPA;
}
function gpOf(g){
  var i = GRADES.indexOf(g);
  return i<0 ? null : gpaScale()[i];
}
function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '0';
  var r = Math.round(n*100)/100;
  return String(r);
}
/* GPA = Σ(點數 × 學分) ÷ Σ學分；未評分／P／PP 唔計入 */
function gpaCalc(){
  var credits=0, points=0, graded=0, excluded=0, rows=S.gpa||[];
  rows.forEach(function(r){
    var cr = parseFloat(r.credits);
    if(isNaN(cr)||cr<0) cr=0;
    var gp = gpOf(r.grade);          /* 只有 A+ … F 先有分；P／PP／未評分 → null */
    if(gp===null){ excluded++; return; }
    credits += cr; points += gp*cr; graded++;
  });
  return { gpa:(credits>0?points/credits:null), credits:credits, graded:graded,
           excluded:excluded, total:rows.length };
}
function gpaSumHtml(c){
  return '<div class="gpa-big'+(c.gpa===null?' none':'')+'">'+
      '<b>'+(c.gpa===null?'—':c.gpa.toFixed(2))+'</b><small>GPA</small></div>'+
    '<div class="gpa-meta">'+
      '<span><b>'+fmtNum(c.credits)+'</b>計入學分</span>'+
      '<span><b>'+c.graded+'</b>已評分</span>'+
      '<span><b>'+c.excluded+'</b>未評分／不計</span>'+
    '</div>';
}
function gpaStatText(c){
  if(!S.gpa.length) return '還沒有課程';
  return c.graded+' 科已評分'+(c.excluded?'　·　'+c.excluded+' 科未評分／不計':'')+
         '　·　計入 '+fmtNum(c.credits)+' 學分';
}
function updateGpaSummary(){
  var sum=document.getElementById('gpaSum');
  var c=gpaCalc();
  if(sum) sum.innerHTML=gpaSumHtml(c);
  var st=document.getElementById('gpaStat');
  if(st) st.textContent=gpaStatText(c);
}
function gpaRowHtml(r,i){
  var gp = r.grade ? gpOf(r.grade) : null;
  return '<div class="gpa-row" data-i="'+i+'">'+
    '<input class="gr-code" value="'+esc(r.code)+'" placeholder="課程代號 / 名稱">'+
    '<input class="gr-cr" type="number" min="0" step="0.5" value="'+esc(r.credits)+'" placeholder="學分">'+
    '<select class="gr-grade">'+
      '<option value=""'+(!r.grade?' selected':'')+'>未評分</option>'+
      GRADES.map(function(g){ return '<option value="'+g+'"'+(r.grade===g?' selected':'')+'>'+g+'</option>'; }).join('')+
      GPA_EXTRA.map(function(g){ return '<option value="'+g+'"'+(r.grade===g?' selected':'')+'>'+g+'（不計）</option>'; }).join('')+
    '</select>'+
    '<span class="gp">'+(gp===null?'':gp.toFixed(1))+'</span>'+
    '<button class="x" data-act="del" title="刪除">✕</button>'+
  '</div>';
}
function drawGpa(){
  var body=document.getElementById('gpaBody'); if(!body) return;
  updateGpaSummary();
  if(!S.gpa.length){
    body.innerHTML='<div class="gempty"><b>還沒有課程</b>'+
      '按「＋ 新增課程」加入你讀過嘅科，填學分同等級，就會自動計 GPA<br>'+
      'Grade point 制：A+ = 4.3 … F = 0；未評分嘅科唔會計入</div>';
    return;
  }
  var h='<div class="gpa-row head"><span>課程</span>'+
        '<span style="text-align:center">學分</span><span style="text-align:center">等級</span>'+
        '<span class="gp" style="text-align:center">點數</span><span class="gpa-x"></span></div>';
  S.gpa.forEach(function(r,i){ h+=gpaRowHtml(r,i); });
  h+='<div class="gpa-foot">'+
     '<button class="btn" data-act="add">＋ 新增課程</button>'+
     '<button class="btn" data-act="import">從課表匯入</button>'+
     '<button class="btn danger" data-act="clear">清空全部</button></div>';
  body.innerHTML=h;
  if(!body.dataset.bound){
    body.dataset.bound='1';
    body.addEventListener('input', onGpaInput);
    body.addEventListener('change', onGpaChange);
    body.addEventListener('click', onGpaClick);
  }
}
function onGpaInput(e){
  var el=e.target; if(!el||!el.classList) return;
  var row=el.closest('.gpa-row'); if(!row||row.classList.contains('head')) return;
  var i=+row.dataset.i; if(!S.gpa[i]) return;
  if(el.classList.contains('gr-code')) S.gpa[i].code=el.value;
  else if(el.classList.contains('gr-cr')) S.gpa[i].credits=el.value;
  else return;
  save();
  /* 只更新點數同統計，唔重建 DOM，保留游標 */
  var gpEl=row.querySelector('.gp');
  if(gpEl){ var gp=S.gpa[i].grade?gpOf(S.gpa[i].grade):null;
            gpEl.textContent=(gp===null?'':gp.toFixed(1)); }
  updateGpaSummary();
}
function onGpaChange(e){
  var el=e.target;
  if(!el||!el.classList||!el.classList.contains('gr-grade')) return;
  var row=el.closest('.gpa-row'); if(!row) return;
  var i=+row.dataset.i; if(!S.gpa[i]) return;
  S.gpa[i].grade=el.value; save();
  var gpEl=row.querySelector('.gp');
  if(gpEl){ var gp=el.value?gpOf(el.value):null; gpEl.textContent=(gp===null?'':gp.toFixed(1)); }
  updateGpaSummary();
}
function onGpaClick(e){
  if(!e.target||!e.target.closest) return;
  var btn=e.target.closest('[data-act]'); if(!btn) return;
  var act=btn.dataset.act;
  if(act==='add'){
    S.gpa.push({id:uid(),code:'',credits:3,grade:''}); save(); drawGpa();
    var ins=document.querySelectorAll('#gpaBody .gr-code');
    if(ins.length) ins[ins.length-1].focus();
  } else if(act==='import'){
    var seen={}, codes=[];
    S.gpa.forEach(function(r){ if(r.code) seen[String(r.code).trim()]=1; });
    S.courses.forEach(function(c){
      if((c.tag||'class')!=='class') return;
      var k=String(c.code||'').trim();
      if(!k||seen[k]) return; seen[k]=1; codes.push(k);
    });
    if(!codes.length){ alert('課表嘅科目都已經喺清單入面。'); return; }
    codes.forEach(function(k){ S.gpa.push({id:uid(),code:k,credits:3,grade:''}); });
    save(); drawGpa();
  } else if(act==='clear'){
    if(!confirm('清空全部課程？')) return;
    S.gpa=[]; save(); drawGpa();
  } else if(act==='del'){
    var row=btn.closest('.gpa-row'); if(!row) return;
    S.gpa.splice(+row.dataset.i,1); save(); drawGpa();
  }
}
function gpaScaleForm(){

var IDB_NAME='timetable-diary-v1', IDB_STORE='photos', idb=null, idbReady=false;
function idbOpen(){
  try{
    if(!window.indexedDB) return;
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'});
    };
    req.onsuccess=function(e){ idb=e.target.result; idbReady=true; drawDiary(); };
    req.onerror=function(){};
  }catch(e){}
}
function idbPut(rec,cb){
  if(!idbReady){ if(cb) cb(false); return; }
  try{
    var tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(rec);
    tx.oncomplete=function(){ if(cb) cb(true); };
    tx.onerror=function(){ if(cb) cb(false); };
    tx.onabort=function(){ if(cb) cb(false); };
  }catch(e){ if(cb) cb(false); }
}
function idbGet(id,cb){
  if(!idbReady){ cb(null); return; }
  try{
    var r=idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(id);
    r.onsuccess=function(){ cb(r.result||null); };
    r.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbDel(id){
  if(!idbReady) return;
  try{ idb.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(id); }catch(e){}
}
function idbClear(cb){
  if(!idbReady){ if(cb) cb(false); return; }
  try{
    var tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete=function(){ if(cb) cb(true); };
    tx.onerror=function(){ if(cb) cb(false); };
    tx.onabort=function(){ if(cb) cb(false); };
  }catch(e){ if(cb) cb(false); }
}

/* 讀圖 → 縮圖 → JPEG dataURL（唔想原相逼爆儲存） */
function shrinkImage(file, cb){
  if(!/^image\//.test(file.type||'')){ cb(null); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var raw=fr.result, img=new Image();
    img.onload=function(){
      try{
        var max=1280, w=img.width, h=img.height;
        if(w>max||h>max){ var s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var ctx=c.getContext('2d');
        if(!ctx){ cb({src:raw}); return; }
        ctx.drawImage(img,0,0,w,h);
        cb({src:c.toDataURL('image/jpeg',0.72)});
      }catch(e){ cb({src:raw}); }
    };
    img.onerror=function(){ cb(null); };
    img.src=raw;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

/* ---- Spotify 每日一歌（用官方 embed，唔需要登入） ---- */
var SPOT_KINDS=['track','album','playlist','artist','episode','show'];
function parseSpotify(input){
  var s=String(input||'').trim(); if(!s) return null;
  var m=s.match(/^spotify:([a-z]+):([A-Za-z0-9]+)$/);
  if(m && SPOT_KINDS.indexOf(m[1])>=0) return {type:m[1], id:m[2]};
  m=s.match(/open\.spotify\.com\/(?:embed\/)?(?:intl-[a-z-]+\/)?([a-z]+)\/([A-Za-z0-9]+)/i);
  if(m && SPOT_KINDS.indexOf(m[1].toLowerCase())>=0) return {type:m[1].toLowerCase(), id:m[2]};
  return null;
}
function spotifyOpenUrl(s){ return 'https://open.spotify.com/'+s.type+'/'+s.id; }
function spotifyLabel(t){
  return {track:'歌曲', album:'專輯', playlist:'播放清單', artist:'歌手', episode:'單集', show:'節目'}[t]||'音樂';
}
/* 用官方 oEmbed 拎封面 + 曲名（唔需要登入；已支援 CORS） */
var songMetaCache={};
function fetchSongMeta(song, cb){
  if(!song||!song.id){ cb(null); return; }
  var key=song.type+':'+song.id;
  if(songMetaCache[key]){ cb(songMetaCache[key]); return; }
  try{
    var x=new XMLHttpRequest();
    x.open('GET','https://open.spotify.com/oembed?url='+encodeURIComponent(spotifyOpenUrl(song)),true);
    x.timeout=9000;
    x.onload=function(){
      var meta=null;
      if(x.status>=200&&x.status<300){
        try{
          var j=JSON.parse(x.responseText);
          meta={ title:j.title||'', cover:j.thumbnail_url||'' };
        }catch(e){ meta=null; }
      }
      if(meta) songMetaCache[key]=meta;
      cb(meta);
    };
    x.onerror=function(){ cb(null); };
    x.ontimeout=function(){ cb(null); };
    x.send();
  }catch(e){ cb(null); }
}
/* 30 秒試聽：iTunes Search API（免 key、CORS *），用歌名／備註搜尋 */
var previewCache={};
function fetchSongPreview(song, cb){
  var q=String((song && (song.label || (song.meta && song.meta.title))) || '').trim();
  if(!q){ cb(null); return; }
  if(previewCache[q]!==undefined){ cb(previewCache[q]); return; }
  try{
    var x=new XMLHttpRequest();
    x.open('GET','https://itunes.apple.com/search?entity=song&limit=1&term='+encodeURIComponent(q),true);
    x.timeout=9000;
    x.onload=function(){
      var out=null;
      if(x.status>=200&&x.status<300){
        try{
          var j=JSON.parse(x.responseText), r=(j.results||[])[0];
          if(r && r.previewUrl) out={ url:r.previewUrl, track:r.trackName||'', artist:r.artistName||'' };
        }catch(e){ out=null; }
      }
      previewCache[q]=out;
      cb(out);
    };
    x.onerror=function(){ cb(null); };
    x.ontimeout=function(){ cb(null); };
    x.send();
  }catch(e){ cb(null); }
}

/* ================= 每月總結（自動生成） ================= */
var MSEL=null;                                  /* 睇緊邊個月：'YYYY-MM' */
function mkOf(ds){ return String(ds||'').slice(0,7); }

function mkLabel(mk){

function mkDays(mk){

/* 有資料嘅月份（日記／非溫書記錄／溫書時數） */
function diaryMonths(){

  function add(k){ if(k && /^\d{4}-\d{2}$/.test(k) && !set[k]){ set[k]=1; out.push(k); } }

function mkBounds(){

  return { lo:ms[0], hi:ms[ms.length-1] };
}
function mkDefault(){
  var ms=diaryMonths(), now=mkNow();
  if(ms.indexOf(now)>=0) return now;
  var prev=null;
  ms.forEach(function(k){ if(k<now) prev=k; });
  return prev || (ms.length ? ms[ms.length-1] : now);
}
/* 心情 1–5 嘅顏色（低 → 高） */
var MOOD_BAR=['#e5484d','#e08a3c','#c9a227','#5aa06a','#1d9e75'];
/* 常見虛詞，唔想當成關鍵字 */
var KW_STOP={'今日':1,'昨天':1,'明天':1,'我哋':1,'佢哋':1,'自己':1,'之後':1,'而家':1,
  '因為':1,'所以':1,'但是':1,'不過':1,'然後':1,'一樣':1,'一個':1,'一下':1,'咁樣':1,
  '好似':1,'唔知':1,'唔係':1,'唔好':1,'覺得':1,'時間':1,'可以':1,'已經':1,'仲有':1,
  '都係':1,'好多':1,'終於':1,'其實':1,'或者':1,'如果':1,'呢個':1,'嗰個':1,'就是':1,
  'the':1,'and':1,'for':1,'with':1,'that':1,'this':1,'you':1,'was':1,'are':1,'had':1};
/* 由日記文字抽出成日提到嘅詞（中文用 2 字組合、英文用原字，至少出現 2 次） */
function topKeywords(text, n){
  var cnt={}, order=[];
  function bump(k){
    if(KW_STOP[k] || k.length<2) return;
    if(!cnt[k]){ cnt[k]=0; order.push(k); }
    cnt[k]++;
  }
  (String(text).match(/[\u4e00-\u9fff]+/g)||[]).forEach(function(r){
    for(var i=0;i+2<=r.length;i++) bump(r.substr(i,2));
  });
  (String(text).toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(bump);
  return order.map(function(k){ return {k:k, n:cnt[k]}; })
    .filter(function(x){ return x.n>=2; })
    .sort(function(a,b){ return b.n-a.n || (a.k<b.k?-1:1); })
    .slice(0,n);
}
/* 統計一個月：日記 + 心情 + 相片 + 歌 + 溫書 + 非溫書 */
function summarizeMonth(mk){
  var days=mkDays(mk), i, ds, d, j;
  var z={ mk:mk, total:days.length, days:0, noteDays:0, ph:0, songs:0, words:0,
          moods:0, moodAvg:null, dist:[0,0,0,0,0], best:null, worst:null,
          stMin:0, stDays:0, actM:0, actN:0, kws:[] };
  var textAll='', moodList=[];
  for(i=0;i<days.length;i++){
    ds=days[i];
    d=null;
    for(j=0;j<(S.diary||[]).length;j++) if(S.diary[j].date===ds){ d=S.diary[j]; break; }
    if(d){
      z.days++;
      z.ph += (d.photos||[]).length;
      if(d.song && d.song.id) z.songs++;
      var note=String(d.note||'').trim();
      if(note){ z.noteDays++; z.words += note.replace(/\s+/g,'').length; textAll += note+' '; }
      if(d.mood>=1 && d.mood<=5){
        z.moods++; z.dist[d.mood-1]++;
        moodList.push({ds:ds, v:d.mood});
        if(!z.best || d.mood>z.best.v) z.best={ds:ds, v:d.mood};
        if(!z.worst || d.mood<z.worst.v) z.worst={ds:ds, v:d.mood};
      }
    }
    var sm=logMin(ds);
    if(sm>0){ z.stMin+=sm; z.stDays++; }
    var am=actMin(ds);
    if(am>0){ z.actM+=am; }
    z.actN += actsOn(ds).length;
  }
  if(z.moods){
    var sum=0; moodList.forEach(function(x){ sum+=x.v; });
    z.moodAvg=sum/z.moods;
  }
  z.moodList=moodList;
  z.kws=topKeywords(textAll, 6);
  return z;
}
/* 一句自動生成嘅總結文字 */
function summarySentence(z){
  if(!z.days && !z.stMin && !z.actM) return '';
  var m=parseInt(z.mk.slice(5,7),10), s=[];

  else if(z.songs) s.push('揀咗 '+z.songs+' 首歌。');
  if(z.noteDays) s.push('有 '+z.noteDays+' 日寫咗字，加埋 '+z.words+' 個字。');
  if(z.stMin) s.push('今個月溫書 '+hTxt(z.stMin)+' 小時'+
    (z.actM?('，另外 '+hTxt(z.actM)+' 小時做咗其他嘢'):'')+'。');
  else if(z.actM) s.push('今個月有 '+hTxt(z.actM)+' 小時記錄咗做其他嘢。');
  if(z.kws.length) s.push('成日提到「'+
    z.kws.slice(0,3).map(function(k){ return k.k; }).join('」「')+'」。');
  if(z.best && z.worst && z.best.v!==z.worst.v)

  else if(z.best) s.push('心情最好係 '+md(new Date(z.best.ds+'T00:00:00'))+'。');
  return s.join('');
}
/* 心情走勢：每日一條柱，高 = 心情好 */
function moodSpark(mk, moodList){
  var all=mkDays(mk), map={};
  moodList.forEach(function(x){ map[x.ds]=x.v; });
  var n=all.length, W=320, H=46, gap=2;
  var bw=Math.max(2,(W-(n-1)*gap)/n), bars='';
  for(var i=0;i<n;i++){
    var v=map[all[i]]; if(!v) continue;
    var h=(v/5)*(H-8), x=i*(bw+gap);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(H-h-2).toFixed(1)+'" width="'+bw.toFixed(1)+
          '" height="'+h.toFixed(1)+'" rx="1.5" fill="'+MOOD_BAR[v-1]+'"/>';
  }
  if(!bars) return '';
  return '<svg class="ms-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
         'aria-hidden="true"><line x1="0" y1="'+(H-2)+'" x2="'+W+'" y2="'+(H-2)+
         '" stroke="#e3e8f1" stroke-width="1"/>'+bars+'</svg>';
}
/* 純文字版總結（複製用） */
function summaryText(mk){
  var z=summarizeMonth(mk), L=[];
  L.push('【'+mkLabel(mk)+'】日記總結');
  L.push(summarySentence(z));
  if(z.moodAvg!==null){
    L.push('心情分佈：'+MOOD_LBL.map(function(l,i){
      return l+' '+z.dist[i];
    }).join('　'));
  }
  if(z.kws.length) L.push('成日提到：'+
    z.kws.map(function(k){ return k.k+'×'+k.n; }).join('、'));
  if(z.stMin) L.push('溫書：'+hTxt(z.stMin)+' 小時（'+z.stDays+' 日）');
  if(z.actM) L.push('非溫書：'+hTxt(z.actM)+' 小時（'+z.actN+' 段）');
  return L.filter(function(x){ return x; }).join('\n');
}
function msumCard(k, v, sub){
  return '<div class="ms-card"><span class="ms-k">'+k+'</span>'+
    '<b class="ms-v">'+v+'</b>'+(sub?'<i class="ms-s">'+sub+'</i>':'')+'</div>';
}
function drawMsum(){
  var el=document.getElementById('msum'); if(!el) return;
  if(!MSEL) MSEL=mkDefault();
  var b=mkBounds();
  if(MSEL<b.lo) MSEL=b.lo;
  if(MSEL>b.hi) MSEL=b.hi;
  var mk=MSEL, z=summarizeMonth(mk);
  /* 完全冇任何資料（全新用家）就唔顯示，免得同下面嘅空狀態重複 */
  if(!z.days && !z.stMin && !z.actM && !diaryMonths().length){
    el.hidden=true; el.innerHTML=''; return;
  }
  el.hidden=false;

  var h='<div class="ms-head"><span class="ms-lbl">每月總結</span>'+
    '<span class="ms-nav">'+
      '<button class="ms-ar" id="msPrev" aria-label="上個月"'+(mk<=b.lo?' disabled':'')+'>‹</button>'+
      '<b class="ms-mk">'+mkLabel(mk)+'</b>'+
      '<button class="ms-ar" id="msNext" aria-label="下個月"'+(mk>=b.hi?' disabled':'')+'>›</button>'+
    '</span>'+
    '<button class="btn ms-copy" id="msCopy">複製總結</button>'+
    '<span class="ms-toast" id="msToast" hidden></span></div>';

  if(!z.days && !z.stMin && !z.actM){
    el.innerHTML=h+'<div class="ms-empty">'+mkLabel(mk)+
      '未有記錄。寫咗日記、或者用過「溫書計時」／「記錄做過咩」，呢度就會自動有總結。</div>';
    bindMsum();
    return;
  }

  h+='<div class="ms-sum">'+esc(summarySentence(z))+'</div>';

  var moodV = z.moodAvg!==null
    ? (MOODS[Math.min(4,Math.max(0,Math.round(z.moodAvg)-1))]+' '+z.moodAvg.toFixed(1))
    : '—';
  h+='<div class="ms-grid">'+
    msumCard('記錄', z.days+' 日', '共 '+z.total+' 日'+(z.noteDays?(' · 寫字 '+z.noteDays+' 日'):''))+
    msumCard('心情', moodV, z.moods?('有評 '+z.moods+' 日'):'未評過')+
    msumCard('相片', z.ph+' 張', z.songs?('每日一歌 '+z.songs+' 首'):'')+
    msumCard('溫書', hTxt(z.stMin)+' 小時', z.actM?('非溫書 '+hTxt(z.actM)+' 小時'):(z.stDays?('有溫 '+z.stDays+' 日'):''))+
    '</div>';

  var sp=moodSpark(mk, z.moodList);
  if(sp) h+='<div class="ms-sparkwrap">'+sp+'<span class="ms-sparkcap">心情走勢（每日一條，越高越好）</span></div>';

  if(z.kws.length){
    h+='<div class="ms-kw"><span class="ms-kwl">成日提到</span>'+
      z.kws.map(function(k){ return '<span class="ms-chip">'+esc(k.k)+'<i>'+k.n+'</i></span>'; }).join('')+
      '</div>';
  }
  if(z.best && z.worst && z.best.v!==z.worst.v){
    h+='<div class="ms-hi">心情最好 <b>'+md(new Date(z.best.ds+'T00:00:00'))+' '+MOODS[z.best.v-1]+
       '</b>　·　最低 <b>'+md(new Date(z.worst.ds+'T00:00:00'))+' '+MOODS[z.worst.v-1]+'</b></div>';
  }
  el.innerHTML=h;
  bindMsum();
}
function bindMsum(){
  var p=document.getElementById('msPrev'), n=document.getElementById('msNext');
  if(p) p.addEventListener('click',function(){ MSEL=mkAdd(MSEL,-1); drawMsum(); });
  if(n) n.addEventListener('click',function(){ MSEL=mkAdd(MSEL,1); drawMsum(); });
  var c=document.getElementById('msCopy');
  if(c) c.addEventListener('click',function(){
    copyText(summaryText(MSEL), function(ok){
      var t=document.getElementById('msToast'); if(!t) return;
      t.hidden=false; t.textContent=ok?'已複製總結':'複製唔到，請長按選取';
      t.className='ms-toast'+(ok?' ok':' bad');
      setTimeout(function(){ t.hidden=true; },2200);
    });
  });
}
function copyText(t, cb){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ cb(true); },
        function(){ cb(fallbackCopy(t)); });
      return;
    }
  }catch(e){}
  cb(fallbackCopy(t));
}
function fallbackCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    if(ta.setSelectionRange) ta.setSelectionRange(0,t.length);
    var ok=false;
    try{
      if(typeof document.execCommand==='function') ok=document.execCommand('copy');
    }catch(e2){ ok=false; }
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
function drawDiary(){
  var body=document.getElementById('diaryBody'); if(!body) return;
  if(!Array.isArray(S.diary)) S.diary=[];
  diarySort();
  var st=document.getElementById('diaryStat');
  var days=S.diary.length, ph=diaryPhotoCount();
  if(st) st.textContent = days ? (days+' 日記錄　·　'+ph+' 張相片') : '還沒有記錄';
  drawMsum();
  if(!days){
    body.innerHTML='<div class="dempty"><b>還沒有每日記錄</b>'+
      '按「＋ 新增一日」，就可以擺嗰日嘅相、打少少 caption<br>'+
      '相片只存喺你自己部機（瀏覽器），唔會上傳</div>';
    return;
  }
  body.innerHTML = S.diary.map(dayHtml).join('');
  bindDiaryPhotos(body);
  bindDiarySongs(body);
  if(!diarySel || !findDay(diarySel)) diarySel=S.diary[0].id;
  syncDiarySel();
}
/* 貼上／拖入相片嘅目標日：預設第一個（最近），可撳日卡轉換 */
var diarySel=null;
function syncDiarySel(){
  var days=document.querySelectorAll('#diaryBody .dday');
  Array.prototype.forEach.call(days,function(el){
    el.classList.toggle('sel', el.dataset.id===diarySel);
  });
}
function diaryTargetId(){
  if(diarySel && findDay(diarySel)) return diarySel;
  if(S.diary && S.diary.length) return S.diary[0].id;
  return null;
}
/* 冇任何記錄時，貼相片會自動開今日 */
function ensureDiaryTarget(cb){
  var id=diaryTargetId();
  if(id){ cb(id); return; }
  var t=todayStr(), d={id:uid(), date:t, note:'', photos:[], song:null, mood:null};
  S.diary.push(d); diarySel=d.id; save(); drawDiary();
  cb(d.id);
}
/* 由 File 陣列加入相片（file input / 貼上 / 拖入共用） */
function addPhotosToDay(id, files){
  var d=findDay(id); if(!d) return;
  if(!d.photos) d.photos=[];
  var arr=Array.prototype.slice.call(files), i=0;
  (function next(){
    if(i>=arr.length){ save(); drawDiary(); return; }
    shrinkImage(arr[i++], function(res){
      if(!res){ next(); return; }
      var pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      if(idbReady){
        idbPut({id:pid, src:res.src}, function(ok){
          /* 寫入成功 → 只記 id；失敗 → 退回內嵌（容量有限但唔會唔見） */
          if(ok) d.photos.push({id:pid}); else d.photos.push({id:pid, src:res.src});
          next();
        });
      } else { d.photos.push({id:pid, src:res.src}); next(); }
    });
  })();
}
/* 剪貼簿／拖放抽出圖片檔 */
function imageFilesFromDataTransfer(dt){
  var out=[];
  if(!dt) return out;
  if(dt.items && dt.items.length){
    for(var i=0;i<dt.items.length;i++){
      var it=dt.items[i];
      if(it.kind==='file' && /^image\//.test(it.type||'')){
        var f=it.getAsFile && it.getAsFile();
        if(f) out.push(f);
      }
    }
  }
  if(!out.length && dt.files && dt.files.length){
    for(var j=0;j<dt.files.length;j++){
      if(/^image\//.test(dt.files[j].type||'')) out.push(dt.files[j]);
    }
  }
  return out;
}
function focusDay(id){
  var el=document.querySelector('#diaryBody .dday[data-id="'+id+'"] .dday-note');
  if(el) el.focus();
}
function addDiaryDay(){
  var t=todayStr(), ex=null;
  S.diary.forEach(function(d){ if(d.date===t) ex=d; });
  if(ex){ drawDiary(); focusDay(ex.id); return; }
  var d={id:uid(), date:t, note:'', photos:[], song:null, mood:null};
  S.diary.push(d); save(); drawDiary(); focusDay(d.id);
}

var pendingDay=null, diaryFile=document.getElementById('diaryFile');
function pickPhotos(id){ pendingDay=id; if(diaryFile){ diaryFile.value=''; diaryFile.click(); } }
if(diaryFile) diaryFile.addEventListener('change',function(){
  var files=this.files; if(!files||!files.length||!pendingDay) return;
  addPhotosToDay(pendingDay, files);
});

/* 貼上相片（Ctrl/⌘+V）→ 加入選中嘅日；冇記錄就自動開今日 */
document.addEventListener('paste',function(e){
  if(S.view!=='diary') return;
  var files=imageFilesFromDataTransfer(e.clipboardData);
  if(!files.length) return;
  e.preventDefault();
  ensureDiaryTarget(function(id){
    flashDay(id);
    addPhotosToDay(id, files);
  });
});
/* 拖放相片入日記 */
document.getElementById('diaryCard').addEventListener('dragover',function(e){
  if(S.view!=='diary') return;
  if(imageFilesFromDataTransfer(e.dataTransfer).length){
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    var day=e.target.closest && e.target.closest('.dday');
    if(day){ diarySel=day.dataset.id; syncDiarySel(); }
    this.classList.add('dragging');
  }
});
document.getElementById('diaryCard').addEventListener('dragleave',function(e){
  if(e.target===this) this.classList.remove('dragging');
});
document.getElementById('diaryCard').addEventListener('drop',function(e){
  if(S.view!=='diary') return;
  this.classList.remove('dragging');
  var files=imageFilesFromDataTransfer(e.dataTransfer);
  if(!files.length) return;
  e.preventDefault();
  ensureDiaryTarget(function(id){
    flashDay(id);
    addPhotosToDay(id, files);
  });
});
/* 短暫綠框提示「加咗落呢日」 */
function flashDay(id){
  var el=document.querySelector('#diaryBody .dday[data-id="'+id+'"]');
  if(!el) return;
  el.classList.add('pasting');
  setTimeout(function(){ el.classList.remove('pasting'); },900);
}

document.getElementById('diaryBody').addEventListener('input',function(e){
  var el=e.target; if(!el||!el.classList||!el.classList.contains('dday-note')) return;
  var day=el.closest('.dday'); var d=findDay(day.dataset.id); if(!d) return;
  d.note=el.value; save();
});
document.getElementById('diaryBody').addEventListener('change',function(e){
  var el=e.target;
  if(!el||!el.classList||!el.classList.contains('dday-pick')) return;
  var day=el.closest('.dday'); var d=findDay(day.dataset.id); if(!d) return;
  if(el.value){ d.date=el.value; save(); drawDiary(); }
});
document.getElementById('diaryBody').addEventListener('click',function(e){
  if(!e.target||!e.target.closest) return;
  var day=e.target.closest('.dday'); if(!day) return;
  var d=findDay(day.dataset.id); if(!d) return;
  /* 撳任何位置都令呢日變成貼上相片嘅目標 */
  if(diarySel!==d.id){ diarySel=d.id; syncDiarySel(); }
  var btn=e.target.closest('[data-act]');
  if(btn){
    var act=btn.dataset.act;
    if(act==='addphoto'){ pickPhotos(d.id); }
    else if(act==='mood'){
      var v=parseInt(btn.dataset.v,10);
      d.mood = (d.mood===v) ? null : v;   /* 再撳同一個 → 取消 */
      save(); drawDiary();
    }
    else if(act==='song'){ songForm(d.id); }
    else if(act==='delsong'){ d.song=null; save(); drawDiary(); }
    else if(act==='delday'){
      if(!confirm('刪除呢日嘅記錄同相片？')) return;
      (d.photos||[]).forEach(function(p){ idbDel(p.id); });
      S.diary=S.diary.filter(function(x){ return x.id!==d.id; });
      if(diarySel===d.id) diarySel=null;
      save(); drawDiary();
    } else if(act==='delphoto'){
      var fig=btn.closest('.dphoto'); if(!fig) return;
      idbDel(fig.dataset.pid);
      d.photos=(d.photos||[]).filter(function(x){ return x.id!==fig.dataset.pid; });
      save(); drawDiary();
    }
    return;
  }
  if(e.target.tagName==='IMG' && e.target.src){ openPhoto(e.target.src); }
});

/* 每日一歌：貼 Spotify 連結（用官方 embed，唔需要登入） */
function songForm(dayId){
  var d=findDay(dayId); if(!d) return;
  var cur=d.song||{};
  var curUrl = cur.id ? spotifyOpenUrl(cur) : '';
  dlg.innerHTML='<h3>每日一歌</h3><div class="bd">'+
    '<div class="fld"><label>Spotify 連結</label>'+
      '<input id="sgUrl" value="'+esc(curUrl)+
      '" placeholder="https://open.spotify.com/track/…　或　spotify:track:…"></div>'+
    '<div class="fld"><label>歌名／備註（選填）</label>'+
      '<input id="sgLabel" value="'+esc(cur.label||'')+'" placeholder="例：Taylor Swift – Anti-Hero"></div>'+
    '<div class="songerr" id="sgErr"></div>'+
    '<p class="dhint">喺 Spotify 撳「分享 → 複製歌曲連結」，貼上面就得；支援歌曲／專輯／播放清單／單集。'+
    '<br>會自動用「歌名／備註」搵 30 秒試聽（建議填「歌手 歌名」會準啲）。'+
    (cur.id?'<br>現時：'+spotifyLabel(cur.type):'')+'</p>'+
    '</div><div class="ft">'+
    (cur.id?'<button class="btn danger" id="sgDel">移除</button>':'')+
    '<button class="btn" id="sgCancel">取消</button>'+
    '<button class="btn pri" id="sgOk">儲存</button></div>';
  modal.hidden=false;
  document.getElementById('sgCancel').addEventListener('click',closeModal);
  var del=document.getElementById('sgDel');
  if(del) del.addEventListener('click',function(){ d.song=null; closeModal(); save(); drawDiary(); });
  document.getElementById('sgOk').addEventListener('click',function(){
    var raw=document.getElementById('sgUrl').value.trim();
    var err=document.getElementById('sgErr');
    var p=parseSpotify(raw);
    if(!p){
      err.textContent='認唔到呢個 Spotify 連結，請貼歌曲／專輯／播放清單連結。';
      document.getElementById('sgUrl').focus(); return;
    }
    d.song={ type:p.type, id:p.id, label:document.getElementById('sgLabel').value.trim() };
    closeModal(); save(); drawDiary();
  });
  var u=document.getElementById('sgUrl'); if(u) u.focus();
}

/* ================= 項目清單 ================= */
function drawList(){
  var box=document.getElementById('courseList');
  var h='';
  ['class','study','exam'].forEach(function(tag){
    var arr=S.courses.filter(function(c){ return (c.tag||'class')===tag; })
      .sort(function(a,b){ return a.day-b.day||s2m(a.start)-s2m(b.start); });
    if(!arr.length) return;
    h+='<div class="gsec">'+TAGS[tag]+'　<span style="color:#c3cad7;font-weight:400">'+arr.length+'</span></div>';
    arr.forEach(function(c){
      var p=PAL[c.color]||PAL.gray;
      h+='<div class="crow"><span class="dot" style="background:'+p.bd+'"></span>'+
         '<span class="inf"><b>'+esc(c.code)+(c.sec?' '+esc(c.sec):'')+'</b>'+
         '<span>'+DOW[c.day-1]+' '+c.start+'–'+c.end+(c.room?' · '+esc(c.room):'')+
         ' · '+ds2cn(c.from)+' 至 '+ds2cn(c.until)+'</span></span>'+
         '<span class="acts"><button data-act="edit" data-id="'+c.id+'">編輯</button>'+
         '<button class="del" data-act="del" data-id="'+c.id+'">刪除</button></span></div>';
    });
  });
  if(S.oneOff.length){
    h+='<div class="gsec">單次活動　<span style="color:#c3cad7;font-weight:400">'+S.oneOff.length+'</span></div>';
    S.oneOff.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(o){
      var p=PAL[o.color]||PAL.gray;
      h+='<div class="crow"><span class="dot" style="background:'+p.bd+'"></span>'+
         '<span class="inf"><b>'+esc(o.code)+(o.sec?' '+esc(o.sec):'')+'</b>'+
         '<span>'+ds2cn(o.date)+' '+o.start+'–'+o.end+
         (o.tag&&o.tag!=='class'?' · '+TAGS[o.tag]:'')+
         (o.room?' · '+esc(o.room):'')+'</span></span>'+
         '<span class="acts"><button data-act="edit1" data-id="'+o.id+'">編輯</button>'+
         '<button class="del" data-act="del1" data-id="'+o.id+'">刪除</button></span></div>';
    });
  }
  if(!h) h='<p style="color:#7b8699;text-align:center;padding:34px 0">還沒有任何項目</p>';
  box.innerHTML=h;
}

document.getElementById('courseList').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]'); if(!b) return;
  var id=b.dataset.id, act=b.dataset.act;
  if(act==='edit'){ var c=S.courses.filter(function(x){return x.id===id;})[0]; if(c) courseForm(c); }
  else if(act==='del'){

  }
  else if(act==='edit1'){ var o=S.oneOff.filter(function(x){return x.id===id;})[0]; if(o) oneForm(o); }
  else if(act==='del1'){ S.oneOff=S.oneOff.filter(function(x){return x.id!==id;}); refreshAll(); }
});

document.getElementById('btnExtend').addEventListener('click',function(){

  var tid=activeTermId();

});

/* ================= 彈窗 ================= */
var modal=document.getElementById('modal'), dlg=document.getElementById('dlg');
function closeModal(){ modal.hidden=true; modal.removeAttribute('data-mode'); }
modal.addEventListener('click',function(e){ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeModal(); document.getElementById('mask').hidden=true; return; }
  var typing=/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'')||
             (document.activeElement||{}).isContentEditable;
  if(modal.hidden&&document.getElementById('mask').hidden&&!typing){
    if(e.key==='ArrowLeft'){ document.getElementById('prev').click(); }
    if(e.key==='ArrowRight'){ document.getElementById('next').click(); }
    if(e.key==='t'||e.key==='T'){ document.getElementById('today').click(); }
  }
});

function openEvent(ds){
  var date=ds.date;
  var e=evOn(new Date(date+'T00:00:00')).filter(function(x){return x.id===ds.id;})[0];
  if(!e) return;
  /* 計時器自動記錄嘅時段：唔可以「編輯」，但可以整段刪走 */
  if(e.kind==='session'){
    var sm=(e.src&&e.src.m>0)?e.src.m:0;
    var sdt=new Date(date+'T00:00:00');
    dlg.innerHTML='<h3>溫書計時記錄　<span style="font-size:12px;color:#0f766e">自動</span></h3>'+
      '<div class="bd"><div class="meta"><b>'+DOW[dow1(sdt)-1]+'</b>　'+ds2cn(date)+'<br>'+
      '<b>'+e.start+' – '+e.end+'</b>　·　'+hTxt(sm)+' 小時<br>'+
      '呢段係用「溫書計時」開始／結束時自動記低嘅。</div>'+
      '<div class="choice"><button id="mDelSess"><b>刪除此記錄</b>'+
      '<span>同時由嗰日嘅溫書時數扣返 '+hTxt(sm)+' 小時</span></button></div></div>'+
      '<div class="ft"><button class="btn" id="mClose">關閉</button></div>';
    modal.hidden=false;

function swatchHtml(sel){
  var h='<div class="sws">';
  Object.keys(PAL).forEach(function(k){
    h+='<button type="button" data-c="'+k+'" class="'+(k===sel?'on':'')+
       '" style="background:'+PAL[k].bg+';border-color:'+PAL[k].bd+'" title="'+PAL[k].name+'"></button>';
  });
  return h+'</div>';
}
function bindSwatch(root,initial){
  var cur=initial, bs=root.querySelectorAll('.sws button');
  function paint(){
    for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].dataset.c===cur);
  }
  for(var i=0;i<bs.length;i++){ (function(b){
    b.addEventListener('click',function(){ cur=b.dataset.c; paint(); });
  })(bs[i]); }
  paint();
  return { get:function(){ return cur; }, set:function(c){ cur=c; paint(); } };
}

/* 滑入動畫：dir>0 = 睇下一個（由右邊入），dir<0 = 睇上一個（由左邊入） */
function swipeAnim(cardId,dir){
  var el=document.getElementById(cardId); if(!el) return;
  el.classList.remove('swin-next','swin-prev');
  void el.offsetWidth;                 /* 強制 reflow，令同一組 class 可以連續觸發 */
  el.classList.add(dir>0?'swin-next':'swin-prev');
  clearTimeout(el.__swT);
  el.__swT=setTimeout(function(){ el.classList.remove('swin-next','swin-prev'); },600);
}

function setView(v,dir){
  S.view=v;
  VIEW_ORDER.forEach(function(k){
    var c=document.getElementById(VIEW_CARD[k]); if(c) c.hidden=(k!==v);
    var b=document.getElementById(VIEW_BTN[k]); if(b) b.classList.toggle('on',k===v);
  });
  if(v==='week') drawWeek();
  else if(v==='month') drawMonths();
  else if(v==='todo') drawTodo();
  else if(v==='countdown') drawCountdown();
  else if(v==='gpa') drawGpa();
  else if(v==='diary') drawDiary();
  else drawGrades();
  if(dir) swipeAnim(VIEW_CARD[v],dir);
  save();
}

/* ================= 左右滑動切換檢視 ================= */
var SW={ on:false, x:0, y:0, t:0, axis:0 };
var SW_MIN=60;     /* 橫向要滑夠 60px 才當一次切換 */
var SW_YMAX=55;    /* 終點縱向偏移大過呢個數就當捲動，唔切換 */
var SW_TMAX=700;   /* 慢過 0.7 秒唔算（多數係拖曳選字） */
var SW_RATIO=1.6;  /* 橫向位移要係縱向嘅 1.6 倍以上 */
var SW_EDGE=26;    /* 貼住螢幕邊 26px 唔掂，讓返 Safari 嘅上一頁手勢 */

function swipeOn(){ return S.swipe!==false; }

/* 呢啲位唔應該觸發切換 */
function swipeBlocked(target){
  if(!target || target.nodeType!==1) return true;
  /* 有浮層開住（抽屜／對話框／相片燈箱）就完全唔理 */
  if(document.querySelector('.mask:not([hidden]),.modal:not([hidden])')) return true;
  var el=target, n=0;
  while(el && el.nodeType===1 && el!==document.body && n++<12){
    var tag=(el.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return true;
    if(el.isContentEditable) return true;
    var cls=el.classList;
    if(cls && (cls.contains('bar')||cls.contains('seg')||cls.contains('drawer'))) return true;
    if(el.scrollWidth-el.clientWidth>4){
      var st=window.getComputedStyle?window.getComputedStyle(el):null;
      if(st && (st.overflowX==='auto'||st.overflowX==='scroll')) return true;
    }
    el=el.parentElement;
  }
  return false;
}

/* step=+1 睇下一個，-1 睇上一個；到頭就唔動 */
function swipeStep(step){
  var i=VIEW_ORDER.indexOf(S.view); if(i<0) i=0;
  var n=i+step;
  if(n<0||n>=VIEW_ORDER.length) return false;
  setView(VIEW_ORDER[n],step);
  return true;
}

document.addEventListener('touchstart',function(e){
  SW.on=false; SW.axis=0;
  if(!swipeOn() || e.touches.length!==1) return;
  var t=e.touches[0];
  if(t.clientX<SW_EDGE || t.clientX>window.innerWidth-SW_EDGE) return;
  if(swipeBlocked(e.target)) return;
  SW.on=true; SW.x=t.clientX; SW.y=t.clientY; SW.t=Date.now();
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(!SW.on || e.touches.length!==1) return;
  var t=e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(!SW.axis){
    if(Math.abs(dx)<12 && Math.abs(dy)<12) return;      /* 未夠明顯，再等 */
    SW.axis = Math.abs(dx) > Math.abs(dy)*SW_RATIO ? 1 : -1;
  }
  /* 確定係橫向之後，食住呢個 touchmove，唔畀瀏覽器當成橫向拖動 */
  if(SW.axis===1 && e.cancelable) e.preventDefault();
},{passive:false});

document.addEventListener('touchend',function(e){
  if(!SW.on) return;
  SW.on=false;
  if(SW.axis!==1) return;
  var t=e.changedTouches && e.changedTouches[0]; if(!t) return;
  var dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(Date.now()-SW.t>SW_TMAX) return;
  if(Math.abs(dy)>SW_YMAX) return;
  if(Math.abs(dx)<SW_MIN) return;
  if(Math.abs(dx) < Math.abs(dy)*SW_RATIO) return;
  swipeStep(dx<0?1:-1);        /* 手指向左 = 睇右邊嗰個（下一個） */
},{passive:true});

document.addEventListener('touchcancel',function(){ SW.on=false; SW.axis=0; },{passive:true});

/* ---------- 學期選擇器 ---------- */
function buildTermSel(){
  var sel=document.getElementById('termSel'); if(!sel) return;
  var h='';
  (S.terms||[]).forEach(function(t,i){
    h+='<option value="'+i+'">'+esc(t.name)+'</option>';
  });
  h+='<option value="__manage">＋ 管理學期…</option>';
  sel.innerHTML=h;
  sel.value=String(S.termIdx);
  if(!sel.dataset.bound){
    sel.dataset.bound='1';
    sel.addEventListener('change',function(){
      var v=this.value;
      if(v==='__manage'){ this.value=String(S.termIdx); termForm(); return; }
      switchTerm(+v);
    });
  }
}
function drawSubttl(){
  var el=document.getElementById('subttl'); if(!el) return;
  var R=termRange();
  syncTitle();          /* 分頁標題（計時中會帶埋 ⏱）由 syncTitle 統一處理 */
  if(!R){ el.textContent='未設定學期'; return; }
  el.textContent=termName()+' · '+ds2cn(R.from)+' – '+ds2cn(R.until)+
    ' · 共 '+R.weeks+' 週 · 點擊任何課堂即可編輯';
}
/* 切換學期：校正 TERM／WEEKS，重建週次選單，再決定停喺第幾週 */
function switchTerm(i){
  if(!S.terms || i<0 || i>=S.terms.length) return;
  S.termIdx=i;
  syncTerm();
  buildJump();
  var t=todayStr();
  if(t>=ymd(TERM) && t<=ymd(addD(TERM,WEEKS*7-1))){
    S.weekIdx=Math.max(0,Math.min(WEEKS-1,Math.round((mon(new Date())-TERM)/(7*864e5))));
  } else {
    S.weekIdx=0;
  }
  save(); refreshAll();
}

function tmOverlap(from,until,skipIdx){
  for(var i=0;i<(S.terms||[]).length;i++){
    if(i===skipIdx) continue;
    var R=termRange(S.terms[i]);
    if(R && from<=R.until && until>=R.from) return S.terms[i].name;
  }
  return null;
}
function tmPreview(i){
  var p=$id('tmPv'); if(!p) return;
  var raw=$id('tmStart').value;
  var st=normTermStart(raw);
  var w=Math.max(1,Math.min(30,Math.round(+$id('tmWeeks').value||14)));
  var s=new Date(st+'T00:00:00');
  if(!raw||isNaN(s.getTime())){ p.className='tmpv bad'; p.textContent='請揀開始日期'; return; }
  var e=addD(s,w*7-1);
  var adj=(raw!==st);
  var ov=tmOverlap(st,ymd(e),(i==null)?null:i);
  p.className='tmpv';
  p.innerHTML='第 1 週：'+ds2cn(st)+' – '+ds2cn(ymd(addD(s,6)))+
    '<br>第 '+w+' 週（最後）：'+ds2cn(ymd(addD(s,(w-1)*7)))+' – '+ds2cn(ymd(e))+
    (adj?'<br><span class="tmpv-warn">開始日期會自動對齊到嗰個星期嘅星期一</span>':'')+
    (ov?'<br><span class="tmpv-warn">注意：同「'+esc(ov)+'」嘅日期重疊</span>':'');
}
function tmSave(i){
  var name=($id('tmName').value||'').trim();
  if(!name){ alert('請輸入學期名稱，例如「2027 春季」。'); $id('tmName').focus(); return; }
  var st=normTermStart($id('tmStart').value);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st)){ alert('請揀開始日期。'); return; }
  var w=Math.max(1,Math.min(30,Math.round(+$id('tmWeeks').value||14)));
  var t;
  if(i==null){ t=newTerm(name,st,w); S.terms.push(t); }
  else { t=S.terms[i]; t.name=name; t.start=st; t.weeks=w; }
  S.terms.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  S.termIdx=Math.max(0,S.terms.indexOf(t));
  syncTerm(); buildJump(); buildTermSel(); refreshAll();
  tmListHtml(); tmFormHtml(null);
  if(i==null) alert('已新增「'+name+'」，而家已切換到呢個學期。\n'+
    '撳「＋ 新增」就可以加入呢個學期嘅課堂。');
}
function buildJump(){
  var sel=document.getElementById('jump'), h='';
  for(var i=0;i<WEEKS;i++){
    var s=addD(TERM,i*7), e=addD(s,6);
    h+='<option value="'+i+'">第 '+(i+1)+' 週（'+md(s)+'–'+md(e)+'）</option>';
  }
  sel.innerHTML=h; sel.value=S.weekIdx;
  if(!sel.dataset.bound){
    sel.dataset.bound='1';
    sel.addEventListener('change',function(){ S.weekIdx=+this.value; refreshAll(); });
  }
}

/* ================= 目標成績 ================= */
var GRADES = ['A+','A','A-','B+','B','B-','C+','C','C-','D','F'];

function subjColor(code){
  for(var i=0;i<S.courses.length;i++) if(S.courses[i].code===code) return S.courses[i].color;
  return 'gray';
}
function allSubjects(){
  var out=[], seen={};
  S.courses.forEach(function(c){ if(c.code && !seen[c.code]){ seen[c.code]=1; out.push(c.code); } });
  Object.keys(S.grades).forEach(function(k){ if(!seen[k]){ seen[k]=1; out.push(k); } });
  return out;
}
function gradeRec(code){
  var g = S.grades[code];
  if(!g || typeof g!=='object'){ g = {target:''}; S.grades[code]=g; }
  if(typeof g.target!=='string') g.target = '';
  return g;
}
/* 學分：優先喺 GPA 清單配對（忽略空格／大小寫），配唔到當 3 學分 */
var DEF_CREDITS = 3;
function normCode(c){ return String(c==null?'':c).replace(/\s+/g,'').toUpperCase(); }
function creditOf(code){
  var k = normCode(code), rows = S.gpa || [];
  for(var i=0;i<rows.length;i++){
    if(normCode(rows[i].code)!==k) continue;
    var cr = parseFloat(rows[i].credits);
    if(!isNaN(cr) && cr>0) return cr;
  }
  return null;
}
/* 預計 GPA（本學期）+ 預計總 GPA（連以往已評分課程）
   本學期 = 只計已設目標嘅科；以往 = GPA 清單入面有 A+…F 嘅行（P／PP／未評分唔計） */
function gradeTotals(){
  var rows = S.gpa || [], gradedSet = {};
  var pc=0, pp=0, pastN=0;
  rows.forEach(function(r){
    var gp = gpOf(r.grade);              /* 未評分 / P / PP → null */
    if(gp===null) return;
    var cr = parseFloat(r.credits); if(isNaN(cr)||cr<0) cr=0;
    pc += cr; pp += gp*cr; pastN++;
    gradedSet[normCode(r.code)] = 1;     /* 記住邊啲科已經有真實成績 */
  });
  var tc=0, tp=0, targetN=0, skipped=[], noCredit=[];
  allSubjects().forEach(function(code){
    var t = gradeRec(code).target;
    if(!t) return;
    if(gradedSet[normCode(code)]){ skipped.push(code); return; }   /* 唔重複計 */
    var gp = gpOf(t); if(gp===null) return;
    var cr = creditOf(code); if(cr===null){ cr = DEF_CREDITS; noCredit.push(code); }
    tc += cr; tp += gp*cr; targetN++;
  });
  return {
    sem:{ gpa:(tc>0 ? tp/tc : null), credits:tc, counted:targetN, noCredit:noCredit },
    total:{ gpa:((pc+tc)>0 ? (pp+tp)/(pc+tc) : null), credits:pc+tc,
            pastN:pastN, pastCredits:pc, targetN:targetN, skipped:skipped }
  };
}
function gradeProjHtml(t){
  var sem = t.sem, tot = t.total;
  if(!sem.counted){
    return '<div class="gpcell"><div class="gpa-big none"><b>未設定目標</b></div>'+
      '<div class="gp-hint">喺下面揀每科嘅目標等級，就會即時估算本學期同埋總 GPA。</div></div>';
  }
  var h = '<div class="gpcell"><div class="gpa-big"><b>'+sem.gpa.toFixed(2)+'</b>'+
    '<small>預計 GPA</small></div>'+
    '<div class="gpa-meta">'+
      '<span><b>'+sem.counted+'</b>科已設目標</span>'+
      '<span><b>'+fmtNum(sem.credits)+'</b>計入學分</span>'+
    '</div></div>';
  if(tot.pastN > 0){
    h += '<div class="gpcell"><div class="gpa-big"><b>'+tot.gpa.toFixed(2)+'</b>'+
      '<small>預計總 GPA</small></div>'+
      '<div class="gpa-meta">'+
        '<span><b>'+fmtNum(tot.credits)+'</b>總學分</span>'+
        '<span><b>'+tot.pastN+'</b>以往已評分</span>'+
        '<span><b>'+tot.targetN+'</b>目標科</span>'+
      '</div></div>';
  }
  var notes = [];
  if(sem.noCredit.length){
    notes.push(sem.noCredit.length+' 科未配對到學分（'+sem.noCredit.map(esc).join('、')+
               '），暫以 '+DEF_CREDITS+' 學分計');
  }
  if(tot.skipped.length){
    notes.push('已有實際成績，唔重複計入目標：'+tot.skipped.map(esc).join('、'));
  }
  if(notes.length) h += '<div class="gp-note">'+notes.join('　·　')+'</div>';
  return h;
}
function drawGradeProj(){
  var el = document.getElementById('gradeProj'); if(!el) return;
  el.innerHTML = gradeProjHtml(gradeTotals());
}
/* 排序用：已設目標嘅按等級高低排前面，未設目標嘅排最後 */
function gradeRank(code){
  var i = GRADES.indexOf(gradeRec(code).target);
  return i<0 ? GRADES.length : i;
}
function gradeCardHtml(code){
  var g = gradeRec(code);
  var col = PAL[subjColor(code)] || PAL.gray;
  var cr = creditOf(code);
  var h = '<div class="gcard" data-code="'+esc(code)+'">';
  h += '<header><span class="dot" style="background:'+col.bd+'"></span>'+
       '<b>'+esc(code)+'</b>'+
       (g.target ? '<span class="gpill">目標 '+g.target+'</span>'
                 : '<span class="gpill none">未設目標</span>')+
       (cr===null
         ? '<span class="gcred warn" title="GPA 清單未有呢科嘅學分，暫以 '+DEF_CREDITS+' 學分計">學分未定</span>'
         : '<span class="gcred" title="學分（來自 GPA 清單）">'+fmtNum(cr)+' 學分</span>')+
       '<span class="gtgt"><select class="g-target" aria-label="目標等級">'+
       '<option value=""'+(g.target===''?' selected':'')+'>未設定</option>'+
       GRADES.map(function(x){
         return '<option value="'+x+'"'+(g.target===x?' selected':'')+'>'+x+'</option>';
       }).join('')+
       '</select></span></header>';

function gradeStatText(){

function buildPackObj(photos, includePhotos){

/* 核心：驗證 → 確認 → 套用。檔案匯入同貼上匯入共用。 */
function applyPack(pack){
  if(!pack || pack.app!==BK_APP || !pack.state || typeof pack.state!=='object'){
    alert('呢份內容唔似係本 App 嘅備份。'); return false;
  }
  var st=pack.state, photos=pack.photos||[], noPho=!!pack.noPhotos;
  var msg='確定要匯入呢份備份？\n\n'+
    '備份時間：'+(pack.exportedAt ? String(pack.exportedAt).slice(0,16).replace('T',' ') : '未知')+'\n'+
    '課堂 '+((st.courses||[]).length)+' 項 · 待辦 '+((st.todos||[]).length)+' 項 · '+
    '日記 '+((st.diary||[]).length)+' 日 · 相片 '+photos.length+' 張\n\n'+
    (noPho ? '※ 呢份備份冇包含相片，目標裝置現有嘅日記相片會保留。\n\n' : '')+
    '⚠️ 其餘現有資料會被完全覆蓋，無法復原。';
  if(!confirm(msg)) return false;
  try{ localStorage.setItem(KEY,JSON.stringify(st)); }
  catch(e){ alert('寫入失敗：瀏覽器儲存空間可能唔夠。'); return false; }
  if(!idbReady || noPho){ afterImport(); return true; }
  /* 先清空相片倉，避免舊相片變孤兒（還原就係要完全一致） */
  idbClear(function(){
    var i=0;
    (function next(){
      if(i>=photos.length){ afterImport(); return; }
      var rec=photos[i++];
      if(!rec || !rec.id){ next(); return; }
      idbPut({id:rec.id, src:rec.src}, function(){ next(); });
    })();
  });
  return true;
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    var pack;
    try{ pack=JSON.parse(String(fr.result)); }
    catch(e){ alert('呢個檔案唔係有效嘅備份（JSON 解析失敗）。'); return; }
    applyPack(pack);
  };
  fr.onerror=function(){ alert('讀取檔案失敗，請再試一次。'); };
  fr.readAsText(file);
}
/* 貼上文字匯入 */
function doImportText(txt){

  if(!txt){ alert('請先貼上備份文字。'); return; }

  try{ pack=JSON.parse(txt); }

  applyPack(pack);
}
/* ================= 雲端同步（GitHub Gist） =================
   只用 GitHub Gist 當一個「雲端檔案櫃」：上傳＝POST/PATCH 一個私密 gist，
   下載＝GET 返嚟再套用。冇後端、冇帳號系統，全靠一個 gist scope 嘅 token。

   Token 同 gistId 存在**獨立嘅 localStorage key**（唔喺 S 入面），所以：
   - 匯出備份檔唔會夾帶 token
   - 「複製備份文字」亦唔會漏出去
   - 換機還原之後，另一部機要各自貼自己嗰個 token */
var CLOUD_KEY = 'timetable-cloud-v1';
var GH_API = 'https://api.github.com';
var GH_FILE = 'timetable.json';
var CLOUD_MAX = 900 * 1024;      /* 留 124 KB 緩衝；Gist API 每檔 1 MB 就會截斷 */
var CLOUD = { token:'', gistId:'', inc:false, lastUp:'', lastDown:'' };
var CLOUD_MSG = null, CLOUD_BUSY = false;

function cloudLoad(){
  try{
    var raw = canStore ? localStorage.getItem(CLOUD_KEY) : null;
    if(!raw) return;
    var d = JSON.parse(raw);
    if(!d || typeof d!=='object') return;
    if(typeof d.token==='string') CLOUD.token=d.token;
    if(typeof d.gistId==='string') CLOUD.gistId=d.gistId;
    if(typeof d.inc==='boolean') CLOUD.inc=d.inc;
    if(typeof d.lastUp==='string') CLOUD.lastUp=d.lastUp;
    if(typeof d.lastDown==='string') CLOUD.lastDown=d.lastDown;
  }catch(e){}
}
function cloudSave(){
  try{ if(canStore) localStorage.setItem(CLOUD_KEY, JSON.stringify(CLOUD)); }catch(e){}
}
function fmtStamp(iso){
  if(!iso) return '—';
  var d=new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+
         p2(d.getHours())+':'+p2(d.getMinutes());
}
function cloudStatText(){
  var s='上次上傳 <b>'+fmtStamp(CLOUD.lastUp)+'</b>　·　上次下載 <b>'+fmtStamp(CLOUD.lastDown)+'</b>';
  if(CLOUD.gistId) s+='<br>Gist：<b>'+esc(CLOUD.gistId)+'</b>';
  return s;
}
/* 更新狀態行（唔重畫成個設定頁） */
function cloudMsg(txt, kind){
  CLOUD_MSG = txt ? { t:txt, k:(kind==='err'?'bad':kind==='ok'?'ok':'') } : null;
  var el=document.getElementById('clStat');
  if(!el) return;
  el.innerHTML = CLOUD_MSG ? CLOUD_MSG.t : cloudStatText();
  el.className = 'clstat'+(CLOUD_MSG&&CLOUD_MSG.k ? ' '+CLOUD_MSG.k : '');
}
function cloudBusy(txt){
  CLOUD_BUSY = !!txt;
  if(txt) cloudMsg(txt);
}
/* 容許直接貼成條 gist 網址（gist.github.com/xxx/ID），或者淨係 ID */
function ghGistId(v){
  v = String(v==null?'':v).trim();
  if(!v) return '';
  var m = v.match(/gist\.github(?:usercontent)?\.com\/(?:[^\/\s]+\/)?([0-9a-f]{5,})/i);
  if(m) return m[1];
  m = v.match(/([0-9a-f]{5,})\s*$/i);
  return m ? m[1] : v;
}
/* 貼之前先驗個樣：classic token 係 ghp_ + 36 字（共 40），
   fine-grained 係 github_pat_ + 82 字。最常見嘅錯係複製唔齊。 */
function ghTokenWarn(t){
  if(!t) return null;
  if(/^ghp_/.test(t)){
    return t.length===40 ? null
      : '⚠️ Classic token 應該係「ghp_」加 36 個字（總共 40 個字），'+
        '你嗰個係 '+t.length+' 個字，似係複製唔齊。\n\n'+
        '建議返去 GitHub，用綠色框右邊嗰個複製掣重新複製一次（唔好手動選）。\n\n仍然要試嗎？';
  }
  if(/^github_pat_/.test(t)){
    return t.length>=60 ? null
      : '⚠️ Fine-grained token 好似唔完整（只有 '+t.length+' 個字）。\n\n'+
        '建議返去 GitHub 用複製掣重新複製。\n\n仍然要試嗎？';
  }
  if(/^(gho_|ghu_|ghs_|ghr_)/.test(t)){
    return '⚠️ 呢個唔係 Personal access token（gho_／ghu_／ghs_ 係其他種類，'+
           '唔可以用嚟讀寫 gist）。\n\n請去 Settings → Developer settings → '+
           'Personal access tokens → Tokens (classic) 重新產生一個 ghp_ 開頭嘅。\n\n仍然要試嗎？';
  }
  return '⚠️ 呢串嘢唔似 GitHub token（正常會以「ghp_」或「github_pat_」開頭）。\n\n'+
         '如果你貼錯咗（例如貼咗密碼），請改用 token。\n\n仍然要試嗎？';
}
/* 讀返畫面上嘅輸入框（用戶可能未離開欄位就撳掣） */
function cloudSyncInputs(){
  var t=document.getElementById('clToken'); if(t) CLOUD.token=t.value.trim();
  var g=document.getElementById('clGist');  if(g) CLOUD.gistId=ghGistId(g.value);
  var i=document.getElementById('clInc');   if(i) CLOUD.inc=!!i.checked;
  cloudSave();
}
/* 一個薄薄嘅 GitHub API 包裝：永遠 callback(err, json, status)，唔會 throw */
function ghFetch(path, opt, cb){
  if(typeof fetch!=='function'){ cb('呢個瀏覽器唔支援 fetch，連唔到雲端。', null, 0); return; }
  var o = { method:(opt&&opt.method)||'GET', headers:{
    'Authorization':'Bearer '+CLOUD.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }};
  if(opt && opt.body){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opt.body); }
  var p;
  try{ p = fetch(GH_API+path, o); }
  catch(e){ cb('發送請求失敗：'+(e&&e.message?e.message:e), null, 0); return; }
  p.then(function(res){
    return res.text().then(function(txt){
      var json=null;
      try{ json = txt ? JSON.parse(txt) : null; }catch(e){}
      if(res.ok){ cb(null, json, res.status); return; }
      var m = (json && json.message) ? json.message : ('HTTP '+res.status);
      var hint = res.status===401 ? 'Token 唔啱或者過咗期。'
               : res.status===403 ? 'Token 冇 gist 權限（要勾 gist scope），或者觸發咗速率限制。'
               : res.status===404 ? '搵唔到呢個 gist（可能填錯 id，或者 token 冇權限睇）。'
               : res.status===422 ? 'GitHub 拒收呢個請求（多數係 gist id 格式唔啱）。'
               : '';
      cb(hint ? hint+'（'+m+'）' : m, json, res.status);
    });
  }).catch(function(e){
    cb('連唔到 GitHub：'+(e&&e.message?e.message:'網絡錯誤')+
       '。檢查上網，同埋有冇被防火牆／廣告攔截器擋咗。', null, 0);
  });
}
function cloudUpload(){
  if(CLOUD_BUSY){ cloudMsg('仲喺處理緊，請等等…'); return; }
  cloudSyncInputs();
  if(!CLOUD.token){
    alert('請先填 GitHub Token。\n\n未開過嘅話，撳下面「點樣攞 Token（3 步）」。');
    return;
  }
  var tw = ghTokenWarn(CLOUD.token);
  if(tw && !confirm(tw)){ cloudMsg('已取消上傳。'); return; }
  cloudBusy('打包中…');
  idbAll(function(photos){
    var txt = JSON.stringify(buildPackObj(photos, CLOUD.inc));
    if(txt.length > CLOUD_MAX){
      if(!confirm('⚠️ 份資料約 '+fmtSize(txt.length)+'，超過 Gist API 每個檔案 1 MB 嘅讀取上限，'+
                  '將來下載會被截斷。\n\n建議閂掉「包含日記相片」再上傳。\n\n仍然要上傳嗎？')){
        CLOUD_BUSY=false; cloudMsg('已取消上傳。'); return;
      }
    }
    var body = { description:'時間表備份（自動同步用）', files:{} };
    body.files[GH_FILE] = { content: txt };
    if(!CLOUD.gistId){ cloudCreate(body, txt.length); return; }
    /* 已經有 gist：先讀一次雲端時間，睇下係唔係另一部機改過而本機未下載 */
    cloudBusy('檢查雲端版本…');
    ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), null, function(err, json){
      if(err){ CLOUD_BUSY=false; cloudMsg('❌ '+esc(err),'err'); alert('讀取雲端失敗：\n'+err); return; }
      var up = (json && json.updated_at) ? json.updated_at : '';
      if(up && CLOUD.lastDown && up > CLOUD.lastDown){
        if(!confirm('⚠️ 雲端版本比呢部機上次下載更新。\n\n'+
                    '雲端：'+fmtStamp(up)+'\n本機上次下載：'+fmtStamp(CLOUD.lastDown)+'\n\n'+
                    '可能係另一部機改過。照樣用呢部機嘅版本覆蓋雲端？')){
          CLOUD_BUSY=false; cloudMsg('已取消上傳。'); return;
        }
      }
      cloudBusy('上傳中…');
      cloudPatch(body, txt.length);
    });
  });
}
function cloudCreate(body, size){
  ghFetch('/gists', { method:'POST', body:body }, function(err, json){
    CLOUD_BUSY=false;
    if(err){ cloudMsg('❌ '+esc(err),'err'); alert('建立 gist 失敗：\n'+err); return; }
    CLOUD.gistId = (json && json.id) ? json.id : '';
    CLOUD.lastUp = new Date().toISOString();
    var url = (json && json.html_url) ? json.html_url : '';
    cloudSave(); drawSettings();
    cloudMsg('✅ 已上傳（開咗個新嘅私密 gist），'+fmtSize(size)+
             (url ? '<br>'+esc(url)+'　→ 另一部機貼呢條 link 就得' : ''),'ok');
  });
}
function cloudPatch(body, size){
  ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), { method:'PATCH', body:body },
  function(err, json){
    CLOUD_BUSY=false;
    if(err){ cloudMsg('❌ '+esc(err),'err'); alert('上傳失敗：\n'+err); return; }
    CLOUD.lastUp = new Date().toISOString();
    cloudSave(); drawSettings();
    cloudMsg('✅ 已上傳，'+fmtSize(size)+'。','ok');
  });
}
function cloudDownload(){
  if(CLOUD_BUSY){ cloudMsg('仲喺處理緊，請等等…'); return; }
  cloudSyncInputs();
  if(!CLOUD.token){ alert('請先填 GitHub Token。'); return; }
  if(!CLOUD.gistId){
    alert('請先填 Gist ID。\n\n未開過嘅話，先撳一次「上傳到雲端」，會自動幫你開一個。');
    return;
  }
  var tw2 = ghTokenWarn(CLOUD.token);
  if(tw2 && !confirm(tw2)){ cloudMsg('已取消下載。'); return; }
  cloudBusy('讀取雲端…');
  ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), null, function(err, json){
    CLOUD_BUSY=false;
    if(err){ cloudMsg('❌ '+esc(err),'err'); alert('讀取雲端失敗：\n'+err); return; }
    var f = (json && json.files) ? json.files[GH_FILE] : null;
    if(!f || typeof f.content!=='string'){
      cloudMsg('❌ 雲端 gist 入面搵唔到 '+GH_FILE,'err');
      alert('呢個 gist 入面冇「'+GH_FILE+'」。\n可能係填錯咗 gist id，或者嗰個 gist 唔係本 App 開嘅。');
      return;
    }
    if(f.truncated){
      cloudMsg('❌ 雲端檔案太大，API 截斷咗','err');
      alert('雲端檔案超過 1 MB，GitHub API 只回傳部分內容，唔敢用。\n\n'+
            '請去另一部機閂掉「包含日記相片」，重新上傳一次。');
      return;
    }
    var pack;
    try{ pack = JSON.parse(f.content); }
    catch(e){ cloudMsg('❌ 雲端內容唔係有效嘅 JSON','err'); alert('雲端內容解析失敗，可能上傳途中出錯。'); return; }
    /* applyPack 會列出內容再確認，然後套用；成功就記低今次下載時間 */
    if(applyPack(pack)===true){
      CLOUD.lastDown = new Date().toISOString();
      cloudSave();
    } else {
      cloudMsg('已取消下載。');
    }
  });
}

/* ================= 啟動 ================= */
function defaultState(){
  return {
    title:'時間表', courses:null, oneOff:[], todos:[],
    exceptions:{}, weekIdx:null, view:'week',
    grades:{}, deadlines:[], gpa:[], gpaScale:null, diary:[], theme:'auto',
    studyMin:0, studyLog:{},
    timerStart:null, timerAcc:0, timerDay:null, timerFrom:null,
    studySessions:[], acts:[],
    terms:null, termIdx:0,
    badgeMode:'sess',  /* App 圖示角標：'sess' 本節計時 / 'day' 今日溫書時數 / 'off' 唔用 */
    seedDone:false
  };
}
function boot(){
  var keep = S.theme || 'auto';
  S = defaultState();
  S.theme = keep;
  load();
  cloudLoad();          /* 雲端同步嘅 token／gistId 存在獨立 key，唔喺 S 入面 */
  if(!S.grades||typeof S.grades!=='object') S.grades={};
  if(!S.deadlines||!Array.isArray(S.deadlines)) S.deadlines=[];
  if(!S.diary||!Array.isArray(S.diary)) S.diary=[];
  if(!S.todos||!Array.isArray(S.todos)) S.todos=[];
  if(!S.oneOff||!Array.isArray(S.oneOff)) S.oneOff=[];
  if(!S.gpa||!Array.isArray(S.gpa)) S.gpa=[];
  /* 學期：舊資料冇 terms 就用預設（2026 秋季）補一個，令舊課堂照樣見到 */
  if(!Array.isArray(S.terms)||!S.terms.length) S.terms=[newTerm(DEF_TERM.name,DEF_TERM.start,DEF_TERM.weeks)];
  S.terms=S.terms.filter(function(t){
    return t && typeof t==='object' && typeof t.start==='string' && t.start;
  }).map(function(t){
    return { id:t.id||uid(), name:String(t.name||'學期'),
             start:normTermStart(t.start), weeks:Math.max(1,Math.min(30,+t.weeks||14)) };
  });
  if(!S.terms.length) S.terms=[newTerm(DEF_TERM.name,DEF_TERM.start,DEF_TERM.weeks)];
  if(typeof S.termIdx!=='number'||!isFinite(S.termIdx)||S.termIdx<0||S.termIdx>=S.terms.length) S.termIdx=0;
  if(S.badgeMode!=='sess'&&S.badgeMode!=='day'&&S.badgeMode!=='off') S.badgeMode='sess';
  syncTerm();
  if(typeof S.studyMin!=='number'||!isFinite(S.studyMin)||S.studyMin<0) S.studyMin=0;
  if(!S.studyLog||typeof S.studyLog!=='object') S.studyLog={};
  if(typeof S.timerAcc!=='number'||!isFinite(S.timerAcc)||S.timerAcc<0) S.timerAcc=0;
  if(typeof S.timerStart!=='number'||!isFinite(S.timerStart)||S.timerStart<=0) S.timerStart=null;
  if(typeof S.timerDay!=='string'||!S.timerDay) S.timerDay=null;
  if(typeof S.timerFrom!=='number'||!isFinite(S.timerFrom)||S.timerFrom<=0) S.timerFrom=null;
  if(!Array.isArray(S.studySessions)) S.studySessions=[];
  S.studySessions=S.studySessions.filter(function(x){
    return x&&typeof x==='object'&&typeof x.d==='string'&&
           typeof x.s==='string'&&typeof x.e==='string';
  });
  if(!Array.isArray(S.acts)) S.acts=[];
  S.acts=S.acts.filter(function(x){
    return x&&typeof x==='object'&&typeof x.d==='string'&&
           typeof x.s==='string'&&typeof x.e==='string'&&
           typeof x.label==='string'&&x.label;
  });
  /* 預設資料只落一次（S.seedDone）：之後用家刪咗就唔會自動彈返出嚟，
     還原備份時亦唔會被塞返一堆預設項目。 */
  if(!S.seedDone){
    if(!S.gpa.length) S.gpa=seedGpa();
    if(!S.oneOff.length) S.oneOff=seedOneOff();
    seedTodos().forEach(function(t){
      var dup=false;
      for(var i=0;i<S.todos.length;i++) if(S.todos[i].text===t.text){ dup=true; break; }
      if(!dup) S.todos.push(t);
    });
    S.seedDone=true;
  }
  if(!Array.isArray(S.courses)||!S.courses.length) S.courses=seed();
  /* 課堂一定要有學期：舊資料（或者啱啱 seed 出嚟嘅）一律歸入第一個學期 */
  var _t0=S.terms[0].id;
  S.courses.forEach(function(c){ if(!c.term) c.term=_t0; });
  if(typeof S.weekIdx!=='number'||isNaN(S.weekIdx)||S.weekIdx<0||S.weekIdx>=WEEKS){
    var auto=Math.round((mon(new Date())-TERM)/(7*864e5));
    S.weekIdx=Math.max(0,Math.min(WEEKS-1,auto));
  }
  applyTheme();
  ttl.textContent=S.title;
  buildTermSel();
  document.title=S.title+' · '+termName();
  buildJump();
  setView(S.view||'week');
  refreshAll();
  tickTimer(timerRunning());   /* 重新開 app 時如果計時器仲開住，繼續跳 */
  renderTimer();
}
boot();

document.getElementById('btnSet').addEventListener('click',settingsForm);

window.addEventListener('resize',function(){ if(S.view==='week') drawWeek(); });
window.addEventListener('beforeprint',function(){
  paintTheme(false);              /* 列印一律用淺色，唔會印到深底 */
  var hrs = dayRange().to - dayRange().from;
  PRINT_H = Math.max(26, Math.min(44, Math.floor(650/Math.max(1,hrs))));
  refreshAll();
});
window.addEventListener('afterprint',function(){
  PRINT_H=null; applyTheme(); refreshAll();
});

/* 關閉或切走頁面時立即存檔，避免 debounce 未完成而遺失最後一次編輯 */
function flushSave(){
  clearTimeout(saveT);
  if(!canStore) return;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){ flushSave(); return; }
  /* 返返嚟：背景時 setInterval 會被 throttle 甚至暫停，
     所以即刻校正返個顯示（計時本身係用時間戳，唔會少咗）。 */
  tickTimer(timerRunning());
  renderTimer();
});
window.addEventListener('focus',function(){
  if(document.visibilityState==='hidden') return;
  tickTimer(timerRunning());
  renderTimer();
});
})();
</script>
<!-- ===== 加入主畫面提示 ===== -->
<div class="inst" id="inst" hidden>
  <img src="icon-192.png" alt="時間表">
  <div class="tx">
    <b id="instTitle">加到主畫面</b>
    <span id="instHint">像 App 一樣全螢幕開啟，離線都用得</span>
  </div>
  <button class="btn pri" id="instGo">安裝</button>
  <button class="x" id="instNo" aria-label="關閉" title="關閉">&times;</button>
</div>

<script>
/* ============================================================
   PWA：離線快取 + 加入主畫面 + 捷徑
   ============================================================ */
(function(){
  'use strict';

  var isFile = location.protocol === 'file:';
  /* 呢個常數要同 sw.js 嘅 VERSION 一致；設定頁靠對比兩者判斷有冇新版 */
  var APP_VER = 'v35';
  var ua = navigator.userAgent || '';
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                   || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(ua)
              || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = isIOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);

  var bar   = document.getElementById('inst');
  var elT   = document.getElementById('instTitle');
  var elH   = document.getElementById('instHint');
  var btnGo = document.getElementById('instGo');
  var btnX  = document.getElementById('instNo');
  var KEY   = 'timetable-install-dismissed-v1';
  var deferred = null;

  /* ---- 更新狀態 ---- */
  var swReg = null;           /* Service Worker registration（有咗先檢查得到更新） */
  var updBarShowing = false;  /* 而家個橫幅係唔係「有新版本」 */
  var updApplying = false;    /* 用戶撳咗「更新」，等 controllerchange */
  var reloading = false;
  var UPD = { msg: '', kind: '' };

  function seen(){ try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; } }
  function hide(){ if(bar) bar.hidden = true; }
  function mark(){ try{ localStorage.setItem(KEY, '1'); }catch(e) {} }

  function show(title, hint, actionText, onClick){
    if(!bar) return;
    elT.textContent = title;
    elH.textContent = hint;
    if(actionText){
      btnGo.hidden = false;
      btnGo.textContent = actionText;
      btnGo.onclick = onClick;
    } else {
      btnGo.hidden = true;
    }
    bar.hidden = false;
  }

  if(btnX) btnX.addEventListener('click', function(){
    hide();
    /* 「有新版本」只係關今次；「加到主畫面」先會永久記住，
       唔然用戶關咗更新提示，就連安裝提示都永遠唔會再出。 */
    if(updBarShowing){ updBarShowing = false; return; }
    mark();
  });

  /* ---- 1. Service Worker：離線可用 + 更新 ---- */

  function updMsg(t, k){ UPD.msg = t || ''; UPD.kind = k || ''; paintUpd(); }
  function paintUpd(){
    var el = document.getElementById('upStat');
    if(!el) return;
    el.className = 'clstat' + (UPD.kind ? ' ' + UPD.kind : '');
    el.textContent = UPD.msg || ('目前版本 ' + APP_VER + '，' +
      (swReg ? '離線快取已啟用' : (isFile ? '用 file:// 開啟，冇離線快取' : '離線快取未啟用')));
  }

  function doReload(){
    if(reloading) return;
    reloading = true;
    location.reload();
  }

  function applyUpdate(){
    updApplying = true;
    var sw = swReg && (swReg.waiting || swReg.active);
    try{ if(sw) sw.postMessage('skip-waiting'); }catch(e){}
    updMsg('更新緊，畫面會自動重新載入…', 'ok');
    /* controllerchange 冇 fire 都照 reload（導航係 network-first，一定拿到新 HTML） */
    setTimeout(doReload, 900);
  }

  function showUpdateBar(){
    if(updBarShowing) return;
    updBarShowing = true;
    show('有新版本', '撳「更新」即刻載入最新內容', '更新', applyUpdate);
    updMsg('有新版本可以更新。', 'ok');
  }

  /* 對比「線上 sw.js 嘅 VERSION」同「本頁 APP_VER」——唔靠 reg.waiting，
     因為 sw.js 安裝時會 skipWaiting，等到嘅時候 waiting 已經係 null。 */
  function checkUpdate(manual){
    if(manual) updMsg('檢查緊…');
    if(swReg){ try{ swReg.update(); }catch(e){} }
    if(isFile){
      if(manual) updMsg('用 file:// 開啟，唔支援自動更新。', 'bad');
      return;
    }
    fetch('sw.js', { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
      var m = /VERSION\s*=\s*['"]([^'"]+)['"]/.exec(t);
      if(m && m[1] !== APP_VER){ showUpdateBar(); return; }
      if(manual) updMsg('已經係最新版本（' + APP_VER + '）。', 'ok');
    }).catch(function(){
      if(manual) updMsg('檢查唔到，可能冇網絡。', 'bad');
    });
  }

  if('serviceWorker' in navigator && !isFile){
    /* 新 SW 接手之後才 reload，避免拿到新舊夾雜嘅畫面 */
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(updApplying) doReload();
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(reg){
        swReg = reg;
        paintUpd();
        /* 已經等緊嘅新版本（例如上次閂咗提示） */
        if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
          });
        });
        /* 開 App 之後自動檢查一次 */
        setTimeout(function(){ checkUpdate(false); }, 2500);
      }).catch(function(err){
        console.warn('[PWA] Service Worker 註冊失敗：', err);
        updMsg('呢個瀏覽器／環境唔支援離線快取。', 'bad');
      });
    });
    /* 由背景返返嚟就順手檢查（最多 5 分鐘一次） */
    var lastCheck = Date.now();
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - lastCheck < 5 * 60 * 1000) return;
      lastCheck = Date.now();
      checkUpdate(false);
    });
  } else if(isFile){
    updMsg('用 file:// 開啟，唔支援自動更新。');
  }

  /* ---- 2. 加入主畫面 ---- */
  // Android / 桌面 Chrome：有原生安裝提示
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if(standalone || seen()) return;
    show('加到主畫面', '一撳即開，唔使再搵網址', '安裝', function(){
      if(!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function(r){
        deferred = null;
        hide();
        if(r && r.outcome === 'accepted') mark();
      });
    });
  });

  window.addEventListener('appinstalled', function(){ hide(); mark(); });

  // iOS Safari 冇自動安裝 API，改用圖文指引
  window.addEventListener('load', function(){
    if(standalone || seen()) return;
    if(isFile){
      show('想放上桌面？', '要先用網址開啟，先可以加入主畫面', null, null);
      return;
    }
    if(isSafari && !deferred && bar && bar.hidden){
      show('加到主畫面', '撳底部「分享」掣 →「加入主畫面」', null, null);
    }
  });

  // Android／其他流動瀏覽器：若冇收到原生安裝提示，用選單指引兜底
  var isMobileUA = /Android|iPhone|iPad|iPod|Mobile/.test(ua);
  if(isMobileUA && !isIOS && !standalone){
    setTimeout(function(){
      if(standalone || seen() || deferred || (bar && !bar.hidden)) return;
      show('加到主畫面', '撳瀏覽器選單「安裝應用程式」或「加到主畫面」', null, null);
    }, 3500);
  }

  /* ---- 3. 桌面捷徑 ?view=week|month|todo|countdown|grade|gpa|diary ---- */
  var m = /[?&]view=(week|month|todo|countdown|grade|gpa|diary)/.exec(location.search);
  if(m){
    var vmap = { week:'vWeek', month:'vMonth', todo:'vTodo', countdown:'vCd',
                 grade:'vGrade', gpa:'vGpa', diary:'vDiary' };
    var el = document.getElementById(vmap[m[1]]);
    if(el) el.click();
  }

  /* ---- 4. 設定頁嘅「App 更新」欄位 ----
     設定頁（主 IIFE）同呢一段係兩個 scope，所以經 window.__upd 交介面過去。
     drawSettings() 係用戶撳掣先叫，嗰陣呢度一定已經定義好。 */
  window.__upd = {
    version: APP_VER,
    field: function(){
      return '<div class="fld"><label>App 更新</label>'+
        '<div class="bkinfo" style="margin-top:2px">而家係 <b>'+APP_VER+'</b>。'+
        'App 一開、同由背景返返嚟，都會自動檢查有冇新版；'+
        '搵到就會喺畫面下面彈提示，撳一下即刻換新版，'+
        '<b>資料完全唔會受影響</b>。</div>'+
        '<div class="clstat" id="upStat"></div>'+
        '<div class="cprow" style="margin-top:9px">'+
          '<button class="btn pri" id="upCheck">檢查更新</button>'+
        '</div></div>';
    },
    bind: function(){
      var ub = document.getElementById('upCheck');
      if(ub) ub.addEventListener('click', function(){ checkUpdate(true); });
      paintUpd();
    }
  };
})();
</script>
