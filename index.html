/* 容許直接貼成條 gist 網址（gist.github.com/xxx/ID），或者淨係 ID */
function ghGistId(v){
  v = String(v==null?'':v).trim();
  if(!v) return '';
  var m = v.match(/gist\.github(?:usercontent)?\.com\/(?:[^\/\s]+\/)?([0-9a-f]{5,})/i);
  if(m) return m[1];
  m = v.match(/([0-9a-f]{5,})\s*$/i);
  return m ? m[1] : v;
}
/* 貼之前先驗個樣：classic token 係 ghp_ + 36 字（共 40），
   fine-grained 係 github_pat_ + 82 字。最常見嘅錯係複製唔齊。 */
function ghTokenWarn(t){
  if(!t) return null;
  if(/^ghp_/.test(t)){
    return t.length===40 ? null
      : '⚠️ Classic token 應該係「ghp_」加 36 個字（總共 40 個字），'+
        '你嗰個係 '+t.length+' 個字，似係複製唔齊。\n\n'+
        '建議返去 GitHub，用綠色框右邊嗰個複製掣重新複製一次（唔好手動選）。\n\n仍然要試嗎？';
  }
  if(/^github_pat_/.test(t)){
    return t.length>=60 ? null
      : '⚠️ Fine-grained token 好似唔完整（只有 '+t.length+' 個字）。\n\n'+
        '建議返去 GitHub 用複製掣重新複製。\n\n仍然要試嗎？';
  }
  if(/^(gho_|ghu_|ghs_|ghr_)/.test(t)){
    return '⚠️ 呢個唔係 Personal access token（gho_／ghu_／ghs_ 係其他種類，'+
           '唔可以用嚟讀寫 gist）。\n\n請去 Settings → Developer settings → '+
           'Personal access tokens → Tokens (classic) 重新產生一個 ghp_ 開頭嘅。\n\n仍然要試嗎？';
  }
  return '⚠️ 呢串嘢唔似 GitHub token（正常會以「ghp_」或「github_pat_」開頭）。\n\n'+
         '如果你貼錯咗（例如貼咗密碼），請改用 token。\n\n仍然要試嗎？';
}
/* 讀返畫面上嘅輸入框（用戶可能未離開欄位就撳掣） */
function cloudSyncInputs(){
  var t=document.getElementById('clToken'); if(t) CLOUD.token=t.value.trim();
  var g=document.getElementById('clGist');  if(g) CLOUD.gistId=ghGistId(g.value);
  var i=document.getElementById('clInc');   if(i) CLOUD.inc=!!i.checked;
  cloudSave();
}
/* 一個薄薄嘅 GitHub API 包裝：永遠 callback(err, json, status)，唔會 throw */
function ghFetch(path, opt, cb){
  if(typeof fetch!=='function'){ cb('呢個瀏覽器唔支援 fetch，連唔到雲端。', null, 0); return; }
  var o = { method:(opt&&opt.method)||'GET', headers:{
    'Authorization':'Bearer '+CLOUD.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }};
  if(opt && opt.body){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opt.body); }
  var p;
  try{ p = fetch(GH_API+path, o); }
  catch(e){ cb('發送請求失敗：'+(e&&e.message?e.message:e), null, 0); return; }
  p.then(function(res){
    return res.text().then(function(txt){
      var json=null;
      try{ json = txt ? JSON.parse(txt) : null; }catch(e){}
      if(res.ok){ cb(null, json, res.status); return; }
      var m = (json && json.message) ? json.message : ('HTTP '+res.status);
      var hint = res.status===401 ? 'Token 唔啱或者過咗期。'
               : res.status===403 ? 'Token 冇 gist 權限（要勾 gist scope），或者觸發咗速率限制。'
               : res.status===404 ? '搵唔到呢個 gist（可能填錯 id，或者 token 冇權限睇）。'
               : res.status===422 ? 'GitHub 拒收呢個請求（多數係 gist id 格式唔啱）。'
               : '';
      cb(hint ? hint+'（'+m+'）' : m, json, res.status);
    });
  }).catch(function(e){
    cb('連唔到 GitHub：'+(e&&e.message?e.message:'網絡錯誤')+
       '。檢查上網，同埋有冇被防火牆／廣告攔截器擋咗。', null, 0);
  });
}
function cloudUpload(){
  if(CLOUD_BUSY){ cloudMsg('仲喺處理緊，請等等…'); return; }
  cloudSyncInputs();
  if(!CLOUD.token){
    alert('請先填 GitHub Token。\n\n未開過嘅話，撳下面「點樣攞 Token（3 步）」。');
    return;
  }
  var tw = ghTokenWarn(CLOUD.token);
  if(tw && !confirm(tw)){ cloudMsg('已取消上傳。'); return; }
  cloudBusy('打包中…');
  idbAll(function(photos){
    uploadWith(photos, CLOUD.inc, false);
  });
}
/* 真正嘅上傳流程。
   v44 起相片改為「一張一個檔案」放喺同一個 gist：
   - timetable.json 只放純文字（永遠細，走 API 冇問題）
   - photo-<id>.jpg 每張相獨立一個檔（gist 單檔可到 100 MB）
   v46 起加差量上傳：只傳「雲端未有」或「內容變咗」嘅相。
   CLOUD.photos = { 檔名: 內容指紋 }，記住上次成功同步咗嘅狀態，
   唔改嘅相就唔重傳 —— 免得改一個待辦都要重推幾十 MB。 */
function uploadWith(photos, inc, alreadyRetried){
  /* 文字部分永遠唔包相片 base64（相片改為獨立檔案） */
  var txt = JSON.stringify(buildPackObj([], false));
  var rawLen = txt.length;
  cloudBusy(gzSupported() ? '壓縮中…' : '準備中…');
  gzPack(txt, function(gerr, payload){
    var len = payload.length;
    if(len > CLOUD_MAX){
      if(!confirm('⚠️ 文字資料壓縮後仍然有 '+fmtSize(len)+
                  '，超過 Gist API 每個檔案 1 MB 嘅**讀取**上限，將來下載會被截斷。\n\n'+
                  '建議：先「匯出備份」存一份落機，再考慮清理舊日記文字。\n\n'+
                  '仍然要上傳嗎？')){
        CLOUD_BUSY=false; cloudMsg('已取消上傳。'); return;
      }
    }
    var body = { description:'時間表備份（自動同步用）', files:{} };
    body.files[GH_FILE] = { content: payload };
    /* 相片：只在用戶勾咗「包含日記相片」時才上傳。
       ⚠️ Gist 有個獨立限制：每個 gist 最多 300 個檔案（唔係 300 MB，係 300 個）。
          所以相片數要封頂，唔係 PATCH 會直接失敗。
          文字檔佔 1 個，所以相片最多 299 張。 */
    var PH_MAX = 299;
    var phCount = 0, phSkipped = 0, phSame = 0, phBytes = 0;
    var sentNow = {};   /* 今次實際有傳（或確認雲端已有）嘅相 → 新嘅 CLOUD.photos */
    if(inc){
      var prev = CLOUD.photos || {};
      var usable = (photos||[]).filter(function(rec){ return rec && rec.id && rec.src; });
      phSkipped = Math.max(0, usable.length - PH_MAX);
      usable.slice(0, PH_MAX).forEach(function(rec){
        var name = phFileOf(rec.id);
        var b64 = phPayload(rec.src);
        /* 指紋：長度 + 頭尾各 48 字。同一張相唔會變，改過就一定唔同。
           唔用整份內容做鍵，係因為幾百 KB 字串做 object key 會好食記憶體。 */
        var fp = b64.length + ':' + b64.slice(0,48) + ':' + b64.slice(-48);
        sentNow[name] = fp;
        if(prev[name] === fp){ phSame++; return; }   /* 冇變 → 唔重傳 */
        body.files[name] = { content:b64 };
        phCount++; phBytes += b64.length;
      });
      if(phSkipped && !alreadyRetried){
        /* 唔靜靜哋略過：講清楚，等用戶知點解有啲相冇上到 */
        cloudMsg('⚠️ 相片有 '+usable.length+' 張，超過 gist 上限 299 張，'+
                 '今次只同步頭 '+PH_MAX+' 張。');
      }

    }
    var info = { raw:rawLen, sent:len, inc:inc, gz:(payload!==txt),
                 photos:phCount, skipped:phSkipped, same:phSame,
                 phBytes:phBytes, sentNow:sentNow };
    var go = function(){
      if(!phCount && phSame) cloudBusy('上傳中…（相片全部已同步，唔使重傳）');
      else if(phCount) cloudBusy('上傳中…（'+phCount+' 張相片'+
             (phSame ? '，'+phSame+' 張已同步' : '')+'）');
      else cloudBusy('上傳中…');
    };
    if(!CLOUD.gistId){ go(); cloudCreate(body, info); return; }
    /* 已經有 gist：先讀一次雲端時間，睇下係唔係另一部機改過而本機未下載 */
    cloudBusy('檢查雲端版本…');
    ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), null, function(err, json){
      if(err){ CLOUD_BUSY=false; cloudMsg('❌ '+esc(err),'err'); alert('讀取雲端失敗：\n'+err); return; }
      var up = (json && json.updated_at) ? json.updated_at : '';
      if(up && CLOUD.lastDown && up > CLOUD.lastDown){
        if(!confirm('⚠️ 雲端版本比呢部機上次下載更新。\n\n'+
                    '雲端：'+fmtStamp(up)+'\n本機上次下載：'+fmtStamp(CLOUD.lastDown)+'\n\n'+
                    '可能係另一部機改過。照樣用呢部機嘅版本覆蓋雲端？')){
          CLOUD_BUSY=false; cloudMsg('已取消上傳。'); return;
        }
      }
      /* 孤兒清理：雲端有、但本機冇咗嘅相片檔，用 null 刪走。
         ⚠️⚠️ 極重要安全檢查：gist 大嘅時候，API 回傳嘅 files 會**唔完整**
             （實測：958 KB 嘅 gist，8 個檔只回傳到 6 個，其餘 content 變空）。
             如果照住呢份「唔完整」嘅清單去做孤兒清理，就會誤刪雲端上面
             真實存在嘅相片 —— 直接掉資料，救唔返。
             所以：只有確認回傳冇被截斷（gist 層級 truncated 為 false）
             才做清理；有截斷就一律唔刪，寧願留低孤兒都唔好掉相。 */
      var filesTruncated = !!(json && json.truncated);
      if(inc && !filesTruncated){
        var cloudPh = phListFromFiles(json && json.files);
        var keep = {};
        (photos||[]).forEach(function(rec){ if(rec && rec.id) keep[phFileOf(rec.id)] = 1; });
        cloudPh.forEach(function(p){
          if(!keep[p.name]) body.files[p.name] = null;   /* null = 刪除該檔 */
        });
      } else if(inc && filesTruncated){
        console.warn('[雲端] 雲端檔案清單被截斷，今次跳過孤兒相片清理，避免誤刪');
      }
      go(); cloudPatch(body, info);
    });
  });
}
/* 上傳成功之後嘅一句總結：講清楚有冇壓縮、有幾多張相、實際幾大、有幾多唔使重傳 */
function upMsg(info, extra){
  var s = '✅ 已上傳，文字 '+fmtSize(info.sent);
  if(info.gz) s += '（壓縮前 '+fmtSize(info.raw)+'）';
  if(info.inc && info.photos)
    s += '　·　相片 '+info.photos+' 張（'+fmtSize(info.phBytes)+'）';
  else if(info.inc && info.same)
    s += '　·　相片 '+info.same+' 張全部已同步，唔使重傳';
  else if(!info.inc) s += '　·　唔包含日記相片';
  if(info.inc && info.photos && info.same)
    s += '，另有 '+info.same+' 張已同步';
  if(info.skipped) s += '（另有 '+info.skipped+' 張因超過 gist 檔數上限冇同步）';
  return s + (extra||'');
}
/* 上傳成功：記住今次同步咗嘅相片指紋，下次先判斷得出邊張要重傳。
   只喺真正成功（POST/PATCH 冇 err）之後才寫，失敗就唔好污染記錄。 */
function rememberPhotos(info){
  if(!info || !info.inc) return;
  CLOUD.photos = info.sentNow || {};
}
function cloudCreate(body, info){
  ghFetch('/gists', { method:'POST', body:body }, function(err, json){
    CLOUD_BUSY=false;
    if(err){ cloudMsg('❌ '+esc(err),'err'); alert('建立 gist 失敗：\n'+err); return; }
    CLOUD.gistId = (json && json.id) ? json.id : '';
    CLOUD.lastUp = new Date().toISOString();
    rememberPhotos(info);
    var url = (json && json.html_url) ? json.html_url : '';
    cloudSave(); drawSettings();
    cloudMsg(upMsg(info, '（開咗個新嘅私密 gist）')+
             (url ? '<br>'+esc(url)+'　→ 另一部機貼呢條 link 就得' : ''),'ok');
  });
}
function cloudPatch(body, info){
  ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), { method:'PATCH', body:body },
  function(err, json){
    CLOUD_BUSY=false;
    if(err){ cloudMsg('❌ '+esc(err),'err'); alert('上傳失敗：\n'+err); return; }
    CLOUD.lastUp = new Date().toISOString();
    rememberPhotos(info);
    cloudSave(); drawSettings();
    cloudMsg(upMsg(info)+'。','ok');
  });
}
function cloudDownload(){
  if(CLOUD_BUSY){ cloudMsg('仲喺處理緊，請等等…'); return; }
  cloudSyncInputs();
  if(!CLOUD.token){ alert('請先填 GitHub Token。'); return; }
  if(!CLOUD.gistId){
    alert('請先填 Gist ID。\n\n未開過嘅話，先撳一次「上傳到雲端」，會自動幫你開一個。');
    return;
  }
  var tw2 = ghTokenWarn(CLOUD.token);
  if(tw2 && !confirm(tw2)){ cloudMsg('已取消下載。'); return; }
  cloudBusy('讀取雲端…');
  ghFetch('/gists/'+encodeURIComponent(CLOUD.gistId), null, function(err, json){
    if(err){ CLOUD_BUSY=false; cloudMsg('❌ '+esc(err),'err'); alert('讀取雲端失敗：\n'+err); return; }
    var f = (json && json.files) ? json.files[GH_FILE] : null;
    if(!f){
      CLOUD_BUSY=false;
      cloudMsg('❌ 雲端 gist 入面搵唔到 '+GH_FILE,'err');
      alert('呢個 gist 入面冇「'+GH_FILE+'」。\n可能係填錯咗 gist id，或者嗰個 gist 唔係本 App 開嘅。');
      return;
    }
    /* ⚠️ 關於 truncated —— 呢度係最容易估錯嘅一環，記住實測結果：
       GitHub 唔係「單檔超過 1 MB 才截斷」，而係**當成個 gist 嘅總量大**（大約
       接近 1 MB）就會連細檔都一齊截斷，而且可以截到 content 變**空字串**。
       實例：一個 gist 有 7 張相（約 985 KB）+ timetable.json 只得 3.8 KB，
       但 API 回傳 files['timetable.json'] = { size:3921, truncated:true, content:"" }。
       所以唔可以靠 f.content 判斷，亦唔應該一見 truncated 就放棄。
       正確做法：只要 f.raw_url 存在，就改為經 raw_url 拎完整內容
       —— raw_url 唔受呢個總量限制（官方講 10 MB 以下都拎得晒）。 */
    if(f.truncated || typeof f.content!=='string' || !f.content){
      if(f.raw_url){
        cloudBusy('雲端檔案較大，改用完整下載…');
        console.warn('[雲端] timetable.json 被 API 截斷，改用 raw_url 取回完整內容');
        fetchRawText(f.raw_url, function(rerr, raw){
          if(rerr || typeof raw!=='string' || !raw){
            CLOUD_BUSY=false;
            cloudMsg('❌ 完整下載都失敗','err');
            alert('雲端嘅 '+GH_FILE+' 被 GitHub API 截斷，改用完整下載又拎唔到。\n\n'+
                  (rerr ? '原因：'+rerr+'\n\n' : '')+
                  '可能係網絡問題，或者呢個 gist 太大（超過 10 MB）。\n'+
                  '請檢查網絡之後再試一次。');
            return;
          }
          takeCloudText(raw, json);
        });
        return;
      }
      /* 冇 raw_url 就真係冇計 */
      CLOUD_BUSY=false;
      cloudMsg('❌ 雲端檔案拎唔到完整內容','err');
      alert('雲端嘅 '+GH_FILE+' 被 GitHub 截斷，而且冇提供完整下載連結。\n\n'+
            '請去 gist 網頁（gist.github.com）睇下個檔案係唔係完整，\n'+
            '或者喺有嗰份資料嘅部機重新上傳一次。');
      return;
    }
    takeCloudText(f.content, json);
  });
}
/* 經 raw_url 拎純文字內容（唔加 Authorization，raw 主機唔需要亦唔應該帶 token）。
   同 fetchPhotos 一樣加 timeout，唔好一直吊住。 */
function fetchRawText(url, cb){
  var done=false;
  var fin=function(e, t){ if(done) return; done=true; cb(e, t); };
  var to=setTimeout(function(){ fin('下載逾時（20 秒）'); }, 20000);
  try{
    fetch(url, { cache:'no-store' }).then(function(res){
      if(!res.ok){ clearTimeout(to); fin('HTTP '+res.status); return; }
      return res.text();
    }).then(function(txt){
      clearTimeout(to); fin(null, txt);
    }).catch(function(e){
      clearTimeout(to); fin(e && e.message ? e.message : '網絡錯誤');
    });
  }catch(e){ clearTimeout(to); fin(e && e.message ? e.message : 'fetch 失敗'); }
}
/* 攞到雲端文字之後嘅共同流程：解壓 → 拎相片 → 匯入 */
function takeCloudText(content, json){
    /* 新版本係 gzip 壓縮過嘅；舊版本係純 JSON。gzUnpack 兩者都食。 */
    cloudBusy('解壓中…');
    gzUnpack(content).then(function(raw){
      var pack;
      try{ pack = JSON.parse(raw); }
      catch(e){
        CLOUD_BUSY=false;
        cloudMsg('❌ 雲端內容唔係有效嘅 JSON','err');
        alert('雲端內容解析失敗，可能上傳途中出錯。'); return;
      }
      /* 相片喺同一個 gist 入面，係獨立檔案（photo-xxx.jpg）。
         佢哋唔會跟 API 一齊回傳完整內容，要逐張經 raw_url 拎
         —— raw_url 嘅截斷問題唔適用。 */
      var phs = phListFromFiles(json && json.files);
      if(!phs.length){ finishDownload(pack); return; }
      cloudBusy('下載相片…（0/'+phs.length+'）');
      fetchPhotos(phs, function(list, failN){
        pack.photos = list;
        pack.noPhotos = false;
        if(!list.length) pack.noPhotos = true;
        finishDownload(pack, failN);
      });
    }).catch(function(e){
      CLOUD_BUSY=false;
      var m = (typeof e==='string') ? e : ('解壓失敗：'+(e&&e.message?e.message:e));
      cloudMsg('❌ '+esc(m),'err');
      alert(m);
    });
}
/* 逐張經 raw_url 拎相片。用 sha 版本嘅 URL（raw_url 本身已經帶 sha），
   咁 GitHub CDN 就唔會回舊快取。一張失敗唔會拖垮全部，最後統計有幾多張失敗。 */
function fetchPhotos(list, cb){
  var out=[], i=0, failN=0, total=list.length;
  (function next(){
    if(i>=total){ cb(out, failN); return; }
    var p=list[i++];
    cloudBusy('下載相片…（'+i+'/'+total+'）');
    if(!p.url){ failN++; next(); return; }
    var done=false;
    var fin=function(){ if(done) return; done=true; next(); };
    /* 加 15 秒 timeout：有啲網絡環境會一直吊住唔返 */
    var to=setTimeout(function(){ failN++; fin(); }, 15000);
    try{
      fetch(p.url, { cache:'no-store' }).then(function(res){
        if(!res.ok){ clearTimeout(to); failN++; fin(); return; }
        return res.text();
      }).then(function(txt){
        clearTimeout(to);
        if(typeof txt==='string' && txt){
          /* 存返做 dataURL，同 IndexedDB／備份檔格式一致 */
          out.push({ id:p.id, src:'data:image/jpeg;base64,'+txt.replace(/\s+/g,'') });
        } else failN++;
        fin();
      }).catch(function(){ clearTimeout(to); failN++; fin(); });
    }catch(e){ clearTimeout(to); failN++; fin(); }
  })();
}
/* 下載最後一步：套用 + 記錄時間 */
function finishDownload(pack, failN){
  CLOUD_BUSY=false;
  if(failN){
    cloudMsg('⚠️ 有 '+failN+' 張相片下載唔到（可能網絡中斷），其餘已收到。','err');
    if(!confirm('有 '+failN+' 張日記相片下載唔到（網絡問題）。\n\n'+
                '其餘資料同相片照樣會匯入。\n'+
                '建議之後再撳一次「從雲端下載」補返。\n\n繼續匯入嗎？')) return;
  }
  if(applyPack(pack, { partial:!!failN })===true){
    CLOUD.lastDown = new Date().toISOString();
    /* 本機而家同雲端一致，指紋要重算 —— 否則下次上傳會以為「同上次一樣」
       而唔傳，但其實本機內容已經換咗（例如換咗部機／還原過）。
       留空 {} 係最安全：下次上傳會重新確認一次全部相。 */
    CLOUD.photos = {};
    cloudSave();
  } else {
    cloudMsg('已取消下載。');
  }
}
function cloudForget(){
  if(!confirm('清除呢部機記住嘅 Token 同 Gist ID？\n\n'+
              '雲端上嘅資料唔會被刪，只係呢部機唔再記得。')) return;
  CLOUD = { token:'', gistId:'', inc:false, lastUp:'', lastDown:'', photos:{} };
  CLOUD_MSG = null;
  try{ if(canStore) localStorage.removeItem(CLOUD_KEY); }catch(e){}
  drawSettings();
}

/* 設定頁一開就估一次大小，等用戶未撳之前就知大概幾大。
   v44 起文字同相片分開計：文字走 timetable.json（要受 1 MB 讀取上限），
   相片每張獨立成檔（冇上限），所以相片幾多都唔會影響文字大小。 */
function cloudSizeHint(){
  var el=document.getElementById('clSize'); if(!el) return;
  function paint(rawLen, realComp, phN, phBytes){
    var head = '☁️ 文字大概 <b>'+fmtSize(rawLen)+'</b>';
    if(realComp) head += '，壓縮後約 <b>'+fmtSize(realComp)+'</b>';
    if(phN) head += '<br>相片 <b>'+phN+' 張</b>，共約 <b>'+fmtSize(phBytes)+'</b>'+
                    '（每張獨立存放，唔佔文字額度；<b>改過嘅先會重傳</b>）';
    else if(CLOUD.inc) head += '<br>暫時未有日記相片';
    var known = CLOUD.photos ? Object.keys(CLOUD.photos).length : 0;
    if(CLOUD.inc && known) head += '<br>上次同步咗 <b>'+known+'</b> 張，'+
                                   '再上傳通常只傳新加嗰幾張。';
    el.innerHTML = head +
      (rawLen>CLOUD_MAX ? '<br>⚠️ 文字壓縮後仍然接近或超過 1 MB，'+
                          '建議先匯出備份。' : '');
  }
  /* 底數：先計文字部分（唔使等 IndexedDB） */
  var base = JSON.stringify(buildPackObj([], false)).length;
  gzPack(JSON.stringify(buildPackObj([], false)), function(e, pl){
    paint(base, (pl && pl!==JSON.stringify(buildPackObj([], false))) ? pl.length : 0, 0, 0);
  });
  idbAll(function(photos){
    var n = (photos||[]).filter(function(p){ return p && p.id && p.src; }).length;
    var bytes = 0;
    (photos||[]).forEach(function(p){ if(p && p.src) bytes += String(p.src).length; });
    paint(base, 0, CLOUD.inc ? n : 0, bytes);
  });
}

        : '　撳「全選並複製」，去另一部機「貼上匯入」。');

function copyPanelSelect(){
  var ta=document.getElementById('cpText'), st=document.getElementById('cpStat');
  if(!ta) return;
  ta.focus(); ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){}
  }
  if(st){
    st.className='cpstat '+(ok?'ok':'bad');
    st.textContent = ok
      ? '已複製 ✓　去另一部機開 app → 設定 →「貼上匯入…」→ 貼上。'
      : '自動複製唔成功 — 文字已經全選，請按 Ctrl / ⌘ + C 自己複製。';
  }
  try{ if(ok && canStore) localStorage.setItem(BK_KEY,new Date().toISOString()); }catch(e){}
}

          Object.keys(PAL).map(function(k){
            return '<button type="button" data-c="'+k+'" class="'+((cur.color===k)?'on':'')+'" '+
              'style="background:'+PAL[k].bg+';border-color:'+PAL[k].bd+'" title="'+PAL[k].name+'"></button>';
          }).join('')+
        '</div></div>'+
      '<div class="fld"><label>圖示</label>'+
        '<div class="spicons" id="spIc">'+
          ICON_CHOICES.map(function(ic){

          'placeholder="例：📐" value="'+esc(cur.icon||'')+'"></div></div>'+

    setSubjectPref(code, {color:chosen.color, icon:chosen.icon});
    save();
  }
  var sw=document.getElementById('spSw');
  sw.addEventListener('click',function(e){
    var b=e.target.closest('button[data-c]'); if(!b) return;
    chosen.color=b.dataset.c;

      x.classList.toggle('on', x.dataset.c===chosen.color);
    });
    commit();
  });
  var ic=document.getElementById('spIc');
  ic.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    chosen.icon=b.dataset.i;

    Array.prototype.forEach.call(ic.querySelectorAll('button'),function(x){
      x.classList.toggle('on', x.dataset.i===chosen.icon);
    });
    commit();
  });
  var cu=document.getElementById('spIcCustom');
  if(cu) cu.addEventListener('input',function(){
    chosen.icon=this.value.trim().slice(0,4);
    Array.prototype.forEach.call(ic.querySelectorAll('button'),function(x){
      x.classList.toggle('on', x.dataset.i===chosen.icon);
    });
    commit();
  });
  document.getElementById('spClear').addEventListener('click',function(){
    setSubjectPref(code,{color:'',icon:''}); save();
    backToSettings();
  });
  document.getElementById('spDone').addEventListener('click',function(){
    backToSettings();
  });
}

  if(clTk) clTk.addEventListener('change',function(){ CLOUD.token=this.value.trim(); cloudSave(); });
  var clGi=document.getElementById('clGist');
  if(clGi) clGi.addEventListener('change',function(){
    CLOUD.gistId=ghGistId(this.value); this.value=CLOUD.gistId; cloudSave();
  });
  var clIc=document.getElementById('clInc');
  if(clIc) clIc.addEventListener('change',function(){ CLOUD.inc=!!this.checked; cloudSave(); cloudSizeHint(); });
  cloudSizeHint();
  /* App 更新（由 PWA 段落提供，設定頁只負責擺位） */
  if(window.__upd) window.__upd.bind();
  /* 每星期溫書下限（小時 → 分鐘）。打字即刻更新，離開欄位才正規化顯示。 */
  var sm=document.getElementById('setMin');
  if(sm){
    sm.addEventListener('input',function(){
      var v=parseFloat(this.value);
      S.studyMin=(isFinite(v)&&v>0)?Math.max(30,Math.round(v*60)):0;
      save(); drawStudy(curMon());
    });
    sm.addEventListener('change',function(){
      this.value = S.studyMin>0 ? hTxt(S.studyMin) : '';
    });
  }
  var ex=document.getElementById('bkExport'); if(ex) ex.addEventListener('click',doExport);
  var im=document.getElementById('bkImport');
  var fi=document.getElementById('bkFile');
  if(im&&fi) im.addEventListener('click',function(){ fi.value=''; fi.click(); });
  if(fi) fi.addEventListener('change',function(){
    if(this.files && this.files[0]) doImport(this.files[0]);
  });
  /* 複製／貼上備份 */
  var bc=document.getElementById('bkCopy');
  if(bc) bc.addEventListener('click',function(){
    SET_PANEL='copy'; CP_PHOTOS=null; CP_INC=true; drawSettings(); loadCopyPanel();
  });
  var bp=document.getElementById('bkPaste');
  if(bp) bp.addEventListener('click',function(){
    SET_PANEL='paste'; drawSettings();
    var ta=document.getElementById('cpText'); if(ta) ta.focus();
  });
  var cc=document.getElementById('cpClose');
  if(cc) cc.addEventListener('click',function(){ SET_PANEL=null; CP_PHOTOS=null; drawSettings(); });
  var ci=document.getElementById('cpInc');
  if(ci) ci.addEventListener('change',function(){ CP_INC=!!this.checked; fillCopyPanel(); });
  var cpc=document.getElementById('cpCopy');
  if(cpc) cpc.addEventListener('click',copyPanelSelect);
  var cpg=document.getElementById('cpGo');
  if(cpg) cpg.addEventListener('click',function(){
    var ta=document.getElementById('cpText');
    doImportText(ta ? ta.value : '');
  });
}

/* ================= 啟動 ================= */
function defaultState(){
  return {
    title:'時間表', courses:null, oneOff:[], todos:[],
    exceptions:{}, weekIdx:null, view:'week',
    grades:{}, deadlines:[], gpa:[], gpaScale:null, diary:[], theme:'auto',
    studyMin:0, studyLog:{},
    timerStart:null, timerAcc:0, timerDay:null, timerFrom:null,
    studySessions:[], studySubj:{}, timerSubj:'',
    pomo:{on:false,work:25,brk:5,long:15,every:4,round:0,phase:'work',base:0,ms:0},
    pomoDone:{},
    acts:[],
    terms:null, termIdx:0,
    subjectPref:{},
    badgeMode:'sess',  /* App 圖示角標：'sess' 本節計時 / 'day' 今日溫書時數 / 'off' 唔用 */
    seedDone:false
  };
}
function boot(){
  var keep = S.theme || 'auto';
  S = defaultState();
  S.theme = keep;
  load();
  cloudLoad();          /* 雲端同步嘅 token／gistId 存在獨立 key，唔喺 S 入面 */
  if(!S.grades||typeof S.grades!=='object') S.grades={};
  if(!S.deadlines||!Array.isArray(S.deadlines)) S.deadlines=[];
  if(!S.diary||!Array.isArray(S.diary)) S.diary=[];
  if(!S.todos||!Array.isArray(S.todos)) S.todos=[];
  /* 待辦：補返 added（排序用）同清理型別。舊資料冇 added，
     用陣列次序做一個穩定嘅假時間戳，令「未設截止日」嗰組唔會亂跳。 */
  (function(){
    var n=S.todos.length;
    S.todos.forEach(function(t,i){
      if(!t||typeof t!=='object') return;
      if(typeof t.text!=='string') t.text=String(t.text==null?'':t.text);
      if(t.due!=null && typeof t.due!=='string') t.due='';
      if(typeof t.added!=='number'||!isFinite(t.added)||t.added<=0)
        t.added = 1e12 + i;                 /* 保持原本先後次序 */
      if(t.doneAt!=null && (typeof t.doneAt!=='number'||!isFinite(t.doneAt))) t.doneAt=null;
      if(t.pin!=null && !t.pin) delete t.pin;
    });
  })();
  if(!S.oneOff||!Array.isArray(S.oneOff)) S.oneOff=[];
  if(!S.gpa||!Array.isArray(S.gpa)) S.gpa=[];
  /* 學期：舊資料冇 terms 就用預設（2026 秋季）補一個，令舊課堂照樣見到 */
  if(!Array.isArray(S.terms)||!S.terms.length) S.terms=[newTerm(DEF_TERM.name,DEF_TERM.start,DEF_TERM.weeks)];
  S.terms=S.terms.filter(function(t){
    return t && typeof t==='object' && typeof t.start==='string' && t.start;
  }).map(function(t){
    return { id:t.id||uid(), name:String(t.name||'學期'),
             start:normTermStart(t.start), weeks:Math.max(1,Math.min(30,+t.weeks||14)) };
  });
  if(!S.terms.length) S.terms=[newTerm(DEF_TERM.name,DEF_TERM.start,DEF_TERM.weeks)];
  if(typeof S.termIdx!=='number'||!isFinite(S.termIdx)||S.termIdx<0||S.termIdx>=S.terms.length) S.termIdx=0;
  if(S.badgeMode!=='sess'&&S.badgeMode!=='day'&&S.badgeMode!=='off') S.badgeMode='sess';
  syncTerm();
  if(typeof S.studyMin!=='number'||!isFinite(S.studyMin)||S.studyMin<0) S.studyMin=0;
  if(!S.studyLog||typeof S.studyLog!=='object') S.studyLog={};
  if(typeof S.timerAcc!=='number'||!isFinite(S.timerAcc)||S.timerAcc<0) S.timerAcc=0;
  if(typeof S.timerStart!=='number'||!isFinite(S.timerStart)||S.timerStart<=0) S.timerStart=null;
  if(typeof S.timerDay!=='string'||!S.timerDay) S.timerDay=null;
  if(typeof S.timerFrom!=='number'||!isFinite(S.timerFrom)||S.timerFrom<=0) S.timerFrom=null;
  if(!Array.isArray(S.studySessions)) S.studySessions=[];
  S.studySessions=S.studySessions.filter(function(x){
    return x&&typeof x==='object'&&typeof x.d==='string'&&
           typeof x.s==='string'&&typeof x.e==='string';
  });
  /* 自訂科目外觀：只保留 {color?: 有效色名, icon?: 非空短字串}，其餘垃圾一律清走。
     用 prefKey 重新 key 一次，令 'FINA2303' 同 'fina 2303' 唔會變兩筆。 */
  if(!S.subjectPref||typeof S.subjectPref!=='object'||Array.isArray(S.subjectPref)) S.subjectPref={};
  (function(){
    var clean={};
    Object.keys(S.subjectPref).forEach(function(k0){
      var k=prefKey(k0); if(!k) return;
      var v=S.subjectPref[k0]; if(!v||typeof v!=='object') return;
      var out={};
      if(typeof v.color==='string' && PAL[v.color]) out.color=v.color;
      if(typeof v.icon==='string'){ var ic=v.icon.trim().slice(0,4); if(ic) out.icon=ic; }
      if(Object.keys(out).length) clean[k]=out;
    });
    S.subjectPref=clean;
  })();
  /* 分科溫書：只保留 { 'YYYY-MM-DD': {科目: 正數分鐘} } 嘅形狀 */
  if(!S.studySubj||typeof S.studySubj!=='object') S.studySubj={};
  Object.keys(S.studySubj).forEach(function(ds){
    var m=S.studySubj[ds];
    if(!m||typeof m!=='object'){ delete S.studySubj[ds]; return; }
    var clean={};
    Object.keys(m).forEach(function(k){
      var v=m[k];
      if(typeof v==='number'&&isFinite(v)&&v>0) clean[normSubj(k)]=Math.round(v);
    });
    if(Object.keys(clean).length) S.studySubj[ds]=clean; else delete S.studySubj[ds];
  });
  if(typeof S.timerSubj!=='string') S.timerSubj='';
  if(!S.pomoDone||typeof S.pomoDone!=='object') S.pomoDone={};
  Object.keys(S.pomoDone).forEach(function(k){
    var v=S.pomoDone[k];
    if(typeof v!=='number'||!isFinite(v)||v<=0) delete S.pomoDone[k];
  });
  S.pomo=normPomo(S.pomo);
  if(!Array.isArray(S.acts)) S.acts=[];
  S.acts=S.acts.filter(function(x){
    return x&&typeof x==='object'&&typeof x.d==='string'&&
           typeof x.s==='string'&&typeof x.e==='string'&&
           typeof x.label==='string'&&x.label;
  });
  /* 預設資料只落一次（S.seedDone）：之後用家刪咗就唔會自動彈返出嚟，
     還原備份時亦唔會被塞返一堆預設項目。 */
  if(!S.seedDone){
    if(!S.gpa.length) S.gpa=seedGpa();
    if(!S.oneOff.length) S.oneOff=seedOneOff();
    seedTodos().forEach(function(t){
      var dup=false;
      for(var i=0;i<S.todos.length;i++) if(S.todos[i].text===t.text){ dup=true; break; }
      if(!dup) S.todos.push(t);
    });
    S.seedDone=true;
  }
  if(!Array.isArray(S.courses)||!S.courses.length) S.courses=seed();
  /* 課堂一定要有學期：舊資料（或者啱啱 seed 出嚟嘅）一律歸入第一個學期 */
  var _t0=S.terms[0].id;
  S.courses.forEach(function(c){ if(!c.term) c.term=_t0; });
  if(typeof S.weekIdx!=='number'||isNaN(S.weekIdx)||S.weekIdx<0||S.weekIdx>=WEEKS){
    var auto=Math.round((mon(new Date())-TERM)/(7*864e5));
    S.weekIdx=Math.max(0,Math.min(WEEKS-1,auto));
  }
  applyTheme();
  ttl.textContent=S.title;
  buildTermSel();
  document.title=S.title+' · '+termName();
  buildJump();
  setView(S.view||'week');
  refreshAll();
  tickTimer(timerRunning());   /* 重新開 app 時如果計時器仲開住，繼續跳 */
  renderTimer();
}
boot();

window.addEventListener('beforeprint',function(){

  var hrs = dayRange().to - dayRange().from;

  refreshAll();

window.addEventListener('afterprint',function(){

});

/* 關閉或切走頁面時立即存檔，避免 debounce 未完成而遺失最後一次編輯 */
function flushSave(){
  clearTimeout(saveT);
  if(!canStore) return;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){ flushSave(); return; }
  /* 返返嚟：背景時 setInterval 會被 throttle 甚至暫停，
     所以即刻校正返個顯示（計時本身係用時間戳，唔會少咗）。 */
  tickTimer(timerRunning());
  renderTimer();
});
window.addEventListener('focus',function(){
  if(document.visibilityState==='hidden') return;
  tickTimer(timerRunning());
  renderTimer();
});
})();

<!-- ===== 加入主畫面提示 ===== -->
<div class="inst" id="inst" hidden>
  <img src="icon-192.png" alt="時間表">
  <div class="tx">
    <b id="instTitle">加到主畫面</b>
    <span id="instHint">像 App 一樣全螢幕開啟，離線都用得</span>
  </div>
  <button class="btn pri" id="instGo">安裝</button>
  <button class="x" id="instNo" aria-label="關閉" title="關閉">&times;</button>
</div>

<script>
/* ============================================================
   PWA：離線快取 + 加入主畫面 + 捷徑
   ============================================================ */
(function(){
  'use strict';

  var isFile = location.protocol === 'file:';
  /* 呢個常數要同 sw.js 嘅 VERSION 一致；設定頁靠對比兩者判斷有冇新版 */
  var APP_VER = 'v46';
  var ua = navigator.userAgent || '';
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                   || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(ua)
              || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = isIOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);

  var bar   = document.getElementById('inst');
  var elT   = document.getElementById('instTitle');
  var elH   = document.getElementById('instHint');
  var btnGo = document.getElementById('instGo');
  var btnX  = document.getElementById('instNo');
  var KEY   = 'timetable-install-dismissed-v1';
  var deferred = null;

  /* ---- 更新狀態 ---- */
  var swReg = null;           /* Service Worker registration（有咗先檢查得到更新） */
  var updBarShowing = false;  /* 而家個橫幅係唔係「有新版本」 */
  var updApplying = false;    /* 用戶撳咗「更新」，等 controllerchange */
  var reloading = false;
  var UPD = { msg: '', kind: '' };

  function seen(){ try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; } }
  function hide(){ if(bar) bar.hidden = true; }
  function mark(){ try{ localStorage.setItem(KEY, '1'); }catch(e) {} }

  function show(title, hint, actionText, onClick){
    if(!bar) return;
    elT.textContent = title;
    elH.textContent = hint;
    if(actionText){
      btnGo.hidden = false;
      btnGo.textContent = actionText;
      btnGo.onclick = onClick;
    } else {
      btnGo.hidden = true;
    }
    bar.hidden = false;
  }

  if(btnX) btnX.addEventListener('click', function(){
    hide();
    /* 「有新版本」只係關今次；「加到主畫面」先會永久記住，
       唔然用戶關咗更新提示，就連安裝提示都永遠唔會再出。 */
    if(updBarShowing){ updBarShowing = false; return; }
    mark();
  });

  /* ---- 1. Service Worker：離線可用 + 更新 ---- */

  function updMsg(t, k){ UPD.msg = t || ''; UPD.kind = k || ''; paintUpd(); }
  function paintUpd(){
    var el = document.getElementById('upStat');
    if(!el) return;
    el.className = 'clstat' + (UPD.kind ? ' ' + UPD.kind : '');
    el.textContent = UPD.msg || ('目前版本 ' + APP_VER + '，' +
      (swReg ? '離線快取已啟用' : (isFile ? '用 file:// 開啟，冇離線快取' : '離線快取未啟用')));
  }

  function doReload(){
    if(reloading) return;
    reloading = true;
    location.reload();
  }

  /* 導航係 cache-first：唔清走舊 HTML 嘅話，reload 只會拿返舊版，
     更新就會「撳完好似冇反應」。所以一定要先清，清完才 reload。 */
  function purgeShell(){
    try{
      if(!window.caches || !caches.keys) return Promise.resolve();
      return caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){
          return caches.open(k).then(function(c){
            return Promise.all(['./','./index.html'].map(function(u){
              return c.delete(u).catch(function(){});
            }));
          }).catch(function(){});
        }));
      }).catch(function(){});
    }catch(e){ return Promise.resolve(); }
  }

  function applyUpdate(){
    updApplying = true;
    updMsg('更新緊，畫面會自動重新載入…', 'ok');
    purgeShell().then(function(){
      var sw = swReg && (swReg.waiting || swReg.active);
      try{ if(sw) sw.postMessage('skip-waiting'); }catch(e){}
      /* controllerchange 冇 fire 都照 reload（快取已清，導航一定上網拿新 HTML） */
      setTimeout(doReload, 700);
    });
  }

  function showUpdateBar(){
    if(updBarShowing) return;
    updBarShowing = true;
    show('有新版本', '撳「更新」即刻載入最新內容', '更新', applyUpdate);
    updMsg('有新版本可以更新。', 'ok');
  }

  /* 對比「線上 sw.js 嘅 VERSION」同「本頁 APP_VER」——唔靠 reg.waiting，
     因為 sw.js 安裝時會 skipWaiting，等到嘅時候 waiting 已經係 null。 */
  function checkUpdate(manual){
    if(manual) updMsg('檢查緊…');
    if(swReg){ try{ swReg.update(); }catch(e){} }
    if(isFile){
      if(manual) updMsg('用 file:// 開啟，唔支援自動更新。', 'bad');
      return;
    }
    fetch('sw.js', { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
      var m = /VERSION\s*=\s*['"]([^'"]+)['"]/.exec(t);
      if(m && m[1] !== APP_VER){ showUpdateBar(); return; }
      if(manual) updMsg('已經係最新版本（' + APP_VER + '）。', 'ok');
    }).catch(function(){
      if(manual) updMsg('檢查唔到，可能冇網絡。', 'bad');
    });
  }

  if('serviceWorker' in navigator && !isFile){
    /* 新 SW 接手之後才 reload，避免拿到新舊夾雜嘅畫面 */
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(updApplying) doReload();
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(reg){
        swReg = reg;
        paintUpd();
        /* 已經等緊嘅新版本（例如上次閂咗提示） */
        if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
          });
        });
        /* 開 App 之後自動檢查一次 */
        setTimeout(function(){ checkUpdate(false); }, 2500);
      }).catch(function(err){
        console.warn('[PWA] Service Worker 註冊失敗：', err);
        updMsg('呢個瀏覽器／環境唔支援離線快取。', 'bad');
      });
    });
    /* 由背景返返嚟就順手檢查（最多 5 分鐘一次） */
    var lastCheck = Date.now();
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - lastCheck < 5 * 60 * 1000) return;
      lastCheck = Date.now();
      checkUpdate(false);
    });
  } else if(isFile){
    updMsg('用 file:// 開啟，唔支援自動更新。');
  }

  /* ---- 2. 加入主畫面 ---- */
  // Android / 桌面 Chrome：有原生安裝提示
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if(standalone || seen()) return;
    show('加到主畫面', '一撳即開，唔使再搵網址', '安裝', function(){
      if(!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function(r){
        deferred = null;
        hide();
        if(r && r.outcome === 'accepted') mark();
      });
    });
  });

  window.addEventListener('appinstalled', function(){ hide(); mark(); });

  // iOS Safari 冇自動安裝 API，改用圖文指引
  window.addEventListener('load', function(){
    if(standalone || seen()) return;
    if(isFile){
      show('想放上桌面？', '要先用網址開啟，先可以加入主畫面', null, null);
      return;
    }
    if(isSafari && !deferred && bar && bar.hidden){
      show('加到主畫面', '撳底部「分享」掣 →「加入主畫面」', null, null);
    }
  });

  // Android／其他流動瀏覽器：若冇收到原生安裝提示，用選單指引兜底
  var isMobileUA = /Android|iPhone|iPad|iPod|Mobile/.test(ua);
  if(isMobileUA && !isIOS && !standalone){
    setTimeout(function(){
      if(standalone || seen() || deferred || (bar && !bar.hidden)) return;
      show('加到主畫面', '撳瀏覽器選單「安裝應用程式」或「加到主畫面」', null, null);
    }, 3500);
  }

  /* ---- 3. 桌面捷徑 ?view=week|month|todo|countdown|grade|gpa|diary ---- */
  var m = /[?&]view=(week|month|todo|countdown|grade|gpa|diary)/.exec(location.search);
  if(m){
    var vmap = { week:'vWeek', month:'vMonth', todo:'vTodo', countdown:'vCd',
                 grade:'vGrade', gpa:'vGpa', diary:'vDiary' };
    var el = document.getElementById(vmap[m[1]]);
    if(el) el.click();
  }

  /* ---- 4. 設定頁嘅「App 更新」欄位 ----
     設定頁（主 IIFE）同呢一段係兩個 scope，所以經 window.__upd 交介面過去。
     drawSettings() 係用戶撳掣先叫，嗰陣呢度一定已經定義好。 */
  window.__upd = {
    version: APP_VER,
    field: function(){
      return '<div class="fld"><label>App 更新</label>'+
        '<div class="bkinfo" style="margin-top:2px">而家係 <b>'+APP_VER+'</b>。'+
        'App 一開、同由背景返返嚟，都會自動檢查有冇新版；'+
        '搵到就會喺畫面下面彈提示，撳一下即刻換新版，'+
        '<b>資料完全唔會受影響</b>。</div>'+
        '<div class="clstat" id="upStat"></div>'+
        '<div class="cprow" style="margin-top:9px">'+
          '<button class="btn pri" id="upCheck">檢查更新</button>'+
        '</div></div>';
    },
    bind: function(){
      var ub = document.getElementById('upCheck');
      if(ub) ub.addEventListener('click', function(){ checkUpdate(true); });
      paintUpd();
    }
  };
})();
</script>
</body>
